<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yasa's Everclean — Carwash Simulator</title>
<link rel="preload" as="image" href="splash.png" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #06121d; overflow: hidden;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #e6f2ff;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: manipulation; }
  #wrap { width: 100vw; height: 100vh; display: grid; place-items: center; background: #06121d; position: relative; }
  #stage { aspect-ratio: 16 / 9; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh;
    object-fit: contain; display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #0D1B2A; }
  #hint { position: fixed; bottom: 6px; left: 8px; opacity: .35; font-size: 11px; pointer-events: none; }

  /* ============ Touch HUD (shown only when body.touch is set by JS) ============ */
  #touchHud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  body.touch #touchHud { display: block; }
  body.touch #hint { display: none; }

  /* Each button: tap target must be big & forgiving on phones */
  .tbtn, .abtn, .dp {
    pointer-events: auto;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border: 2px solid rgba(144, 202, 249, 0.55);
    background: rgba(13, 27, 42, 0.55);
    color: #e6f2ff;
    font-family: inherit; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: transform 60ms linear, background 60ms linear;
  }
  .tbtn:active, .abtn:active, .dp:active {
    background: rgba(144, 202, 249, 0.4);
    transform: scale(0.94);
  }

  /* D-pad bottom-left */
  .dpad { position: absolute; left: 14px; bottom: 14px; width: 168px; height: 168px;
    pointer-events: none; }
  .dp { position: absolute; width: 56px; height: 56px; border-radius: 12px; font-size: 28px; line-height: 1; }
  .dp.up    { left: 56px; top: 0; }
  .dp.down  { left: 56px; top: 112px; }
  .dp.left  { left: 0;    top: 56px; }
  .dp.right { left: 112px; top: 56px; }

  /* Action buttons bottom-right */
  .actions { position: absolute; right: 14px; bottom: 14px; width: 200px; height: 168px;
    pointer-events: none; }
  .abtn { position: absolute; border-radius: 50%; }
  .abtn.big   { right: 0;    bottom: 56px; width: 96px; height: 96px; font-size: 28px;
    border-color: #ffe082; color: #ffe082; }
  .abtn.small { width: 56px; height: 56px; font-size: 18px; }
  .abtn.q-btn { right: 110px; bottom: 12px; }
  .abtn.p-btn { right: 110px; bottom: 80px; }

  /* Top-right control strip: tutorial, pause */
  .topright { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; pointer-events: none; }
  .tbtn { width: 44px; height: 44px; border-radius: 10px; font-size: 16px; }

  /* Modal-mode overlay: shown when tutorial / phone / start / game-over modal is up.
     Bigger NEXT/BACK/CLOSE buttons replacing the gameplay HUD. */
  #touchModal { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 6; }
  /* In modal mode (tutorial/phone/pause/start/game-over) hide the gameplay
     D-pad and action buttons. Keep the top-right strip (II / ?) visible so
     the player can always close a modal or pause/unpause. */
  body.touch.touch-modal #touchHud .dpad,
  body.touch.touch-modal #touchHud .actions { display: none; }
  /* Bottom Back/Next/Skip bar only when paginating the tutorial. Other
     modals (phone/pause/start/game-over) close via the top-right [II] or
     a canvas tap. */
  body.touch.touch-tutorial #touchModal { display: block; }
  .modalbar { position: absolute; left: 0; right: 0; bottom: 14px; display: flex;
    justify-content: center; gap: 14px; pointer-events: none; padding: 0 14px; }
  .mbtn { pointer-events: auto; min-width: 96px; height: 56px; border-radius: 14px;
    border: 2px solid rgba(144, 202, 249, 0.55); background: rgba(13, 27, 42, 0.78);
    color: #e6f2ff; font-family: inherit; font-weight: bold; font-size: 16px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45); }
  .mbtn:active { background: rgba(144, 202, 249, 0.4); transform: scale(0.96); }
  .mbtn.primary { border-color: #ffe082; color: #ffe082; }

  /* Rotate-to-landscape overlay — shown only on touch devices in portrait. */
  #rotateNag { position: fixed; inset: 0; background: #06121d; color: #e6f2ff;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    text-align: center; padding: 24px; z-index: 9999;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  body.touch #rotateNag { display: none; }
  @media (orientation: portrait) and (max-width: 900px) {
    body.touch #rotateNag { display: flex; }
  }
  #rotateNag .icon { font-size: 56px; margin-bottom: 14px; animation: spin 2.4s ease-in-out infinite; }
  #rotateNag h2 { font-size: 22px; margin: 0 0 6px; color: #ffe082; }
  #rotateNag p { font-size: 14px; margin: 4px 0; opacity: 0.8; max-width: 320px; }
  @keyframes spin { 0%,40% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }
  @media (max-width: 480px) {
    .dpad { width: 156px; height: 156px; }
    .dp { width: 52px; height: 52px; }
    .dp.up    { left: 52px; top: 0; }
    .dp.down  { left: 52px; top: 104px; }
    .dp.left  { left: 0;    top: 52px; }
    .dp.right { left: 104px; top: 52px; }
    .abtn.big { width: 88px; height: 88px; }
  }

  /* Music toggle — always visible in game corner */
  #audioPanel { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10;
    flex-direction: column; gap: 10px; padding: 14px 20px; border-radius: 14px;
    background: rgba(13,27,42,0.88); border: 2px solid rgba(144,202,249,0.35); min-width: 300px; }
  #audioPanel.show { display: flex; }
  #audioPanel .row { display: flex; align-items: center; gap: 10px; }
  #audioPanel label { flex: 0 0 62px; font-size: 14px; font-weight: bold; color: #ffe082; }
  #audioPanel input[type=range] { flex: 1; min-width: 120px; accent-color: #90caf9; cursor: pointer; }
  #sfxBtn { position: static; }
  #sfxBtn, #musicBtn {
    position: static;
    width: 36px; height: 36px; padding: 0;
    border-radius: 10px;
    background: rgba(13,27,42,0.82);
    border: 2px solid rgba(144,202,249,0.35);
    color: #90caf9;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.15s, color 0.15s;
  }
  #musicBtn:hover, #sfxBtn:hover { border-color: #90caf9; color: #fff; }
  #musicBtn.muted, #sfxBtn.muted { color: #546e7a; border-color: rgba(84,110,122,0.4); }
  /* On touch: shift left so it doesn't overlap ? and II buttons */
  

  </style>
</head>
<body>
  <div id="wrap">
  <audio id="bgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
  
    <div id="audioPanel">
      <div style="font-weight:bold;color:#ffe082;text-align:center;letter-spacing:2px">SETTINGS</div>
      <div class="row"><label>MUSIC</label>
        <button id="musicBtn" title="Pause music (M)" aria-label="Play or pause music">⏸</button>
        <input id="musicVol" type="range" min="0" max="100" value="45" aria-label="Music volume" /></div>
      <div class="row"><label>SFX</label>
        <button id="sfxBtn" title="Mute sound effects (N)" aria-label="Toggle sound effects">🔊</button>
        <input id="sfxVol" type="range" min="0" max="100" value="85" aria-label="SFX volume" /></div>
    </div>

    <canvas id="stage" width="1280" height="720"></canvas>
    <div id="touchHud" aria-hidden="true">
      <div class="topright">
        <button class="tbtn" data-k="t" aria-label="Tutorial">?</button>
        <button class="tbtn" data-k="escape" aria-label="Pause">II</button>
      </div>
      <div class="dpad">
        <button class="dp up"    data-hold="w"        aria-label="Up">&#9650;</button>
        <button class="dp left"  data-hold="a"        aria-label="Left">&#9664;</button>
        <button class="dp right" data-hold="d"        aria-label="Right">&#9654;</button>
        <button class="dp down"  data-hold="s"        aria-label="Down">&#9660;</button>
      </div>
      <div class="actions">
        <button class="abtn small p-btn" data-k="p" aria-label="Phone">P</button>
        <button class="abtn small q-btn" data-k="q" aria-label="Back">Q</button>
        <button class="abtn big"         data-k="e" data-hold="e" aria-label="Action">A</button>
      </div>
    </div>
    <div id="touchModal" aria-hidden="true">
      <div class="modalbar">
        <button class="mbtn" data-k="q"          aria-label="Back">&#9664; Back</button>
        <button class="mbtn" data-k="escape"     aria-label="Skip">Skip</button>
        <button class="mbtn primary" data-k="e"  aria-label="Next/OK">Next &#9654;</button>
      </div>
    </div>
  </div>
  <div id="rotateNag" aria-hidden="true">
    <div class="icon">&#x1F4F1;</div>
    <h2>Rotate your phone</h2>
    <p>Yasa's Everclean plays best in landscape.</p>
    <p>Turn your device sideways to start washing.</p>
  </div>
  <div id="hint">WASD move • E load / interact / eat • Q leave break room • P phone • T tutorial • ESC pause • M music • N sfx</div>
<script>
"use strict";

/* ============================================================================
   CONSTANTS
============================================================================ */
const VIEW_W = 1280, VIEW_H = 720;
const PLAYER_SPEED = 420;
// Character renders at a fixed on-screen size regardless of source frame
// dimensions. Height is tuned to ~18% of the 720px canvas height so the
// character reads as a human at the carwash scale; width is derived from
// walk_down's aspect at load time so the character is proportional and
// doesn't balloon/squash when turning (rows have slightly different source
// heights, which would otherwise change drawW if we used per-frame aspect).
const PLAYER_DRAW_H = 128;
let PLAYER_DRAW_W = 88;
const CAR_SPEED_ARRIVE   = 150;   // drive-in speed to staging spot
const CAR_SPEED_EXIT     = 240;   // speed after fully serviced
const CAR_STAGING_X      = 90;    // where car stops at bottom-left for loading
// Car moves this fast (px/s) across the screen while being serviced.
// Scales with difficulty: base + diff*7, capped at 145.
const CAR_MOVE_SPEED_BASE = 62;
const CAR_MOVE_SPEED_MAX  = 145;
const GAME_TIME_START = 120;
const ENERGY_MAX = 100;
const ENERGY_DRAIN_BASE = 1.0;
const TIP_BASE = 8;
const TIP_PERFECT_BONUS = 5;
const STATION_PICKUP_X = 38;
const STATION_PICKUP_Y = 30;
const CAR_ACTION_RADIUS = 200;   // generous — car is moving, player needs margin
const ACTION_DURATION = 1.2;     // shorter so player can keep up with moving car
const LOAD_PRESSES_NEEDED = 12;
const LOAD_TIME_LIMIT     = 6;

const C_ACCENT = "#4FC3F7";
const C_PANTS  = "#1A237E";
const C_FLOOR  = "#607D8B";
const C_LANE   = "#FFD600";
const C_UI_BG  = "#0D1B2A";
const C_TEXT   = "#e6f2ff";
const C_DIRT   = "#3a2a16";
const C_WATER  = "#8fd7ff";

const TOOL_NAMES = {
  hose: "BUG SPRAY HOSE",
  backbrush: "BACKBRUSH",
  scent_yellow: "LEMON",
  scent_red: "BLACK ICE",
  scent_purple: "MYSTERY",
};

// Rarity determines tip multiplier when a scent is applied to a car:
//  common → 1.0×   medium → 1.6×   rare → 2.5×
// Cars track the *highest* rarity applied during their service, so using a
// rare scent on a multi-step wash substantially boosts the final tip.
// Hose + brush are tools (not collectibles), so they have no rarity.
const TOOL_RARITY = {
  hose: null,
  backbrush: null,
  scent_yellow: 'common',
  scent_red:    'medium',
  scent_purple: 'rare',
};
const RARITY_ORDER = { common: 0, medium: 1, rare: 2 };
const RARITY_TIP_MULT = { common: 1.0, medium: 1.6, rare: 2.5 };
const RARITY_LABEL = { common: 'COMMON', medium: 'MEDIUM', rare: 'RARE' };
const RARITY_COLOR = { common: '#90a4ae', medium: '#81d4fa', rare: '#ce93d8' };

// Station x-positions match the painted tool locations on the bg.png counter.
// All stations share a single floor y (STATION_FLOOR_Y) since the player walks
// along the floor in front of the counter to pick them up. The y field on each
// station is the VISUAL y of the tool on the counter (used for [E] prompt placement).
// Tools are painted into bg.png. Each station entry has:
//  - x,y: pixel position of the tool ICON on the counter (used for [E] chip).
//  - color: matches the painted tool, used to tint the pickup chip so the
//    player can see WHAT they're about to pick up without reading a label.
// The scent cluster is compressed so MYSTERY (purple) is reachable without
// backing off the wall.
const STATIONS_DEF = [
  { id: 'hose',         x: 124, y: 240, label: "BUG SPRAY HOSE", color: '#43a047' },
  { id: 'backbrush',    x: 355, y: 275, label: "BACKBRUSH",      color: '#ec407a' },
  { id: 'scent_yellow', x: 560, y: 250, label: "LEMON",          color: '#fdd835' },
  { id: 'scent_red',    x: 610, y: 250, label: "BLACK ICE",      color: '#e53935' },
  { id: 'scent_purple', x: 660, y: 250, label: "MYSTERY",        color: '#ab47bc' },
];
// Player stands on the floor in front of the counter to trigger pickup.
const STATION_FLOOR_Y = 420;
// Break room door is painted into the bg at the upper-right of the wall.
// Player interacts by walking up to the floor spot right in front of it.
const BREAK_ROOM_DOOR_X = 1185;
const BREAK_ROOM_DOOR_Y = 420;

// Parking bay centers match the yellow-striped slots in the bg. The three
// slots are divided at approximately canvas x=438 and x=904. BAY_Y is pushed
// down to the bottom of the asphalt strip so cars don't eat into the
// walkable area — the player gets the full mid-floor for tool work.
const BAY_X = [219, 671, 1096];
const BAY_Y = 560;
// Car bounding size — shrunk from 160×78 to keep the walkable area open.
const CAR_W = 120;
const CAR_H = 54;
// Floor playable area — derived from the bg composition.
// Top clamp is just below the counter base so the player sprite stands in front
// of the counter; bottom clamp keeps the player off the road strip.
const FLOOR_MIN_Y = 400;
const FLOOR_MAX_Y = 620;

const SHEETS = {
  main:         "hf_20260423_015610_8894dcdc-e8f9-4018-a57e-c2078cb2e1cf.png",
  walk:         "hf_20260423_042236_7ec2104b-d85f-432b-bb33-f25bc74776f7.png",
  tools:        "hf_20260423_043413_19c6b54a-e292-463c-b456-5b76f4f49ba2.png",
  hose:         "hf_20260423_050334_b002773a-6665-4a0c-8ab9-66df15dbc2b4.png",
  backbrush:    "hf_20260423_050736_66db7f90-3934-45c3-95d8-c4dbfc681cbe.png",
  scent_yellow: "hf_20260423_050946_36f7587b-3d6b-4125-8aa2-90defb1d98dd.png",
  scent_red:    "hf_20260423_051243_10cc0cae-46da-4c2c-89d8-8f4a8bdf41eb.png",
  scent_purple: "hf_20260423_051345_3abc6eb9-5235-4ef6-991f-bf5cb7ed9c8f.png",
};

/* ============================================================================
   ANIMATION DEFINITIONS
============================================================================ */
// Animation frame rates tuned for readability:
//  * walk cycles are 9 frames per direction → 10fps ≈ 0.9s per cycle, natural
//    stride cadence that stays snappy during rush hour.
//  * idle is static (single frame) so fps is cosmetic — low value keeps CPU cool.
//  * action anims (scrub/spray/hose) run fast for satisfying visual feedback
//    while the action-timer tracks progress; fps=12 reads as "busy work".
const ANIMS = {
  idle_down:   { fps: 3, loop: true },
  idle_up:     { fps: 3, loop: true },
  idle_left:   { fps: 3, loop: true },
  idle_right:  { fps: 3, loop: true },
  walk_down:   { fps: 14, loop: true },
  walk_up:     { fps: 14, loop: true },
  walk_right:  { fps: 14, loop: true },
  walk_left:   { fps: 14, loop: true },
  scrub:       { fps: 12, loop: true },
  spray:       { fps: 12, loop: true },
  hose:        { fps: 12, loop: true },
  break_sit:   { fps: 3, loop: true },
  mistake:     { fps: 8, loop: false },
};

// Frame dictionaries — each maps anim name -> array of {x,y,w,h} on the source sheet.
// These are populated at load-time by pixel-scanning each sheet. Never assume a grid.
const ANIM_FRAMES = {};            // main / fallback sheet
const WALK_FRAMES = {};            // 8-frame walk cycle sheet
const TOOL_SPRITES = {};           // tool icons (single image per tool id)
const HOSE_HELD_FRAMES = {};
const BACKBRUSH_HELD_FRAMES = {};
const SCENT_YELLOW_HELD_FRAMES = {};
const SCENT_RED_HELD_FRAMES = {};
const SCENT_PURPLE_HELD_FRAMES = {};

const HELD_DICTS = {
  hose:         HOSE_HELD_FRAMES,
  backbrush:    BACKBRUSH_HELD_FRAMES,
  scent_yellow: SCENT_YELLOW_HELD_FRAMES,
  scent_red:    SCENT_RED_HELD_FRAMES,
  scent_purple: SCENT_PURPLE_HELD_FRAMES,
};

/* ============================================================================
   STATE
============================================================================ */
class AnimController {
  constructor(defs) {
    this.defs = defs;
    this.current = 'idle_down';
    this.frame = 0;
    this.t = 0;
    this.done = false;
  }
  play(name) {
    if (this.current === name) return;
    if (!this.defs[name]) name = 'idle_down';
    this.current = name;
    this.frame = 0;
    this.t = 0;
    this.done = false;
  }
  update(dt) {
    const def = this.defs[this.current];
    if (!def) return;
    this.t += dt;
    const advance = Math.floor(this.t * def.fps);
    if (advance > 0) {
      this.t -= advance / def.fps;
      this.frame += advance;
      // Prevent unbounded growth on long-running loop animations
      if (this.frame > 10000) this.frame = this.frame % 100;
    }
  }
  // Returns the source rect for the current frame.
  //
  // IMPORTANT: All held-tool sheets are used for NOTHING. The AI-generated
  // tool sheets have inconsistent layouts: (a) some rows contain two
  // different facing poses back-to-back (hose, scent_yellow, scent_purple)
  // which made walking look like spinning, and (b) the action poses
  // (spray/scrub) have frame aspect ratios that differ from the walk sheet,
  // so scaling them to the fixed on-screen box made the character's body
  // width jump from ~70px to ~43px — the "character gets skinny when using
  // tools" artifact. We therefore source every pose from the main walk
  // sheet and overlay the tool icon in drawPlayer, guaranteeing the body
  // renders at identical dimensions whether idle, walking, or performing
  // an action.
  sheetRect() {
    const cur = this.current;
    // Map action poses to walk_down so the character keeps working-stance
    // while performing an action. Particles + progress bar indicate that
    // an action is happening; the tool icon is still overlaid in drawPlayer.
    // Idle poses with no dedicated entry also fall back to walk_[dir][0].
    const actionMap = { spray: 'walk_down', scrub: 'walk_down', hose: 'walk_down' };
    const idleMap   = { idle_down: 'walk_down', idle_up: 'walk_up',
                        idle_left: 'walk_left', idle_right: 'walk_right' };
    const effectiveCur = actionMap[cur] || idleMap[cur] || cur;
    const isIdleOrAction = !!actionMap[cur] || !!idleMap[cur];
    if (WALK_FRAMES[effectiveCur] && WALK_FRAMES[effectiveCur].length) {
      const arr = WALK_FRAMES[effectiveCur];
      // Idle poses hold the first frame so the character doesn't
      // mini-walk in place while standing still.
      const idx = (idleMap[cur] && !actionMap[cur]) ? 0
                  : (arr.length === 1 ? 0 : (this.frame % arr.length));
      const r = arr[idx];
      return { sx: r.x, sy: r.y, sw: r.w, sh: r.h, flip: false, sheet: 'walk' };
    }
    // walk_left fallback: flip walk_right if we have no left row.
    if (effectiveCur === 'walk_left' && WALK_FRAMES.walk_right && WALK_FRAMES.walk_right.length) {
      const arr = WALK_FRAMES.walk_right;
      const idx = arr.length === 1 ? 0 : (this.frame % arr.length);
      const r = arr[idx];
      return { sx: r.x, sy: r.y, sw: r.w, sh: r.h, flip: true, sheet: 'walk' };
    }
    // Last-resort: main sheet (populated only if ANIM_FRAMES has an entry).
    if (ANIM_FRAMES[cur] && ANIM_FRAMES[cur].length) {
      const arr = ANIM_FRAMES[cur];
      const idx = arr.length === 1 ? 0 : (this.frame % arr.length);
      const r = arr[idx];
      return { sx: r.x, sy: r.y, sw: r.w, sh: r.h, flip: false, sheet: 'main' };
    }
    return null;
  }
}

const state = {
  images: {}, sprite: null, walkSprite: null, toolSprite: null,
  hoseSprite: null, backbrushSprite: null,
  scentYellowSprite: null, scentRedSprite: null, scentPurpleSprite: null,
  frameW: 0, frameH: 0, loaded: false,
  player: { x: VIEW_W/2, y: 500, facing: 'down', moving: false },
  bgImage: null,
  anim: new AnimController(ANIMS),
  currentTool: null, pickupStation: null,
  actionTimer: 0, actionType: null, actionCar: null,
  inBreakRoom: false, breakTimer: 0, breakNotes: [],
  cars: [], spawnTimer: 2,
  tips: 0, carsServed: 0, carsLost: 0, rep: 50, energy: ENERGY_MAX,
  energyDisplay: ENERGY_MAX,
  gameTimer: GAME_TIME_START,   // countdown clock — hits 0 = game over
  highScore: parseInt(localStorage.getItem('everclean_hs') || '0'),
  runStartBest: 0,
  stations: [], manager: null,
  paused: false, caughtFlash: 0,
  shakeX: 0, shakeY: 0,
  floatingTexts: [],
  gameOver: false, gameOverFade: 0,
  gameOverReason: '',
  shake: 0,
  missFlash: 0,   // red vignette timer on car escape
  playerSpeech: null,  // { text, life, max, color }
  particles: [],
  startScreen: true,
  tutorialOpen: false,
  tutorialPage: 0,
  tutorialSeen: localStorage.getItem('everclean_tut_v2') === '1',
  lastBayIndex: -1,   // round-robin bay rotation
  // new sound-related timers / flags
  footstepTimer: 0,
  hoseLoopTimer: 0,

/* ============================================================================
   AUDIO KIT (procedural Web Audio SFX, no files)
============================================================================ */
const AudioKit = (() => {
  let ctx = null, master = null, unlocked = false;
  let sfxVol = 0.85, sfxMuted = false;
  function applyMaster() { if (master) master.gain.value = sfxMuted ? 0 : sfxVol; }
  function setVolume(v) { sfxVol = Math.max(0, Math.min(1, v)); applyMaster(); }
  function setMuted(m) { sfxMuted = !!m; applyMaster(); }

  function ensure() {
    if (ctx) return ctx;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.connect(ctx.destination); applyMaster();
    } catch (e) { ctx = null; }
    return ctx;
  }
  function unlock() {
    if (unlocked) return;
    ensure();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    unlocked = true;
  }

  // ── Shared helpers ─────────────────────────────────────────────────────────
  function noiseBuffer(seconds) {
    const c = ensure(); if (!c) return null;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * seconds), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  // Quick one-shot square/pulse note — 8-bit staple
  function blip(freq, dur, vol = 0.18, type = 'square') {
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(c.currentTime + dur + 0.01);
  }
  // Schedule a sequence of blips: [[freq, dur], ...]
  function melody(notes, vol = 0.15, type = 'square') {
    const c = ensure(); if (!c) return;
    let t = c.currentTime;
    for (const [freq, dur, gap = 0] of notes) {
      if (freq === 0) { t += dur; continue; }
      const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.85);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
      t += dur + gap;
    }
  }

  // ── SFX ────────────────────────────────────────────────────────────────────
  function water() {                      // hose spray — filtered noise swoosh
    const c = ensure(); if (!c) return;
    const buf = noiseBuffer(0.5); const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    f.frequency.exponentialRampToValueAtTime(600, c.currentTime + 0.5);
    const g = c.createGain();
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(0.38, c.currentTime + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.5);
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }

  function squeak() {                     // brush scrub — rising 8-bit chirp
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(400, c.currentTime);
    o.frequency.linearRampToValueAtTime(900, c.currentTime + 0.06);
    o.frequency.linearRampToValueAtTime(600, c.currentTime + 0.14);
    const g = c.createGain();
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(0.15, c.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.18);
    o.connect(g); g.connect(master); o.start(); o.stop(c.currentTime + 0.2);
  }

  function spray() {                      // scent bottle — hiss + sparkle blip
    const c = ensure(); if (!c) return;
    const buf = noiseBuffer(0.35); const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3000;
    const g = c.createGain();
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(0.22, c.currentTime + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.35);
    src.connect(f); f.connect(g); g.connect(master); src.start();

  function pauseOut() {                  // soft whoosh when unpausing
    const c = ensure(); if (!c) return;
    const buf = noiseBuffer(0.20); const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 200; f.Q.value = 1.5;
    f.frequency.linearRampToValueAtTime(900, c.currentTime + 0.18);
    const g = c.createGain();
    g.gain.setValueAtTime(0.14, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.20);
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }

  // ── NEW NEW SOUNDS ─────────────────────────────────────────────────────────
  function birdSplat() {                  // wet noise burst + low thud
    const c = ensure(); if (!c) return;
    const buf = noiseBuffer(0.18); const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 1.5;
    const g = c.createGain();
    g.gain.setValueAtTime(0.32, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.18);
    src.connect(f); f.connect(g); g.connect(master); src.start();

  function birdCaw() {                    // descending square chirp
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(900, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(280, c.currentTime + 0.22);
    const g = c.createGain();
    g.gain.setValueAtTime(0.16, c.currentTime);

  function phoneBuzz() {                  // quick low-freq buzz
    const c = ensure(); if (!c) return;
    const o = c.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(85, c.currentTime);

    g.gain.setValueAtTime(0.0,  c.currentTime + 0.10);

    g.gain.setValueAtTime(0.0,  c.currentTime + 0.26);

/* ============================================================================
   IMAGE LOADING + COLOR-KEY + PIXEL SCANNER
============================================================================ */
function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error("img load: " + src));
    img.src = src;
  });
}

// Strip the baked-in checkerboard background of the sprite sheets.
// Spec called out [155-180] and [225-245] but the actual sheets use darker
// gray squares around r=130 — sample pixels confirmed dark≈130 / light≈225.
// We widen the ranges to catch both, while keeping character pixels intact
// (skin / shirt / hair / pants are all chromatic, not grayscale).
function colorKey(canvas) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  // Different sheets use different checkerboards: walk=130/225, hose=163/185,
  // purple=240/254, tools=105/~. Catch any grayscale pixel in [95, 255].
  // Pure black (<95) is preserved for ink outlines.
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
    if (mx - mn < 10 && r >= 95) {
      d[i+3] = 0;
    }
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function imageToCanvas(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}

// A pixel counts as CHARACTER CONTENT if it is opaque. Scans always run with
// a gutter past the label column so pure-black label text can't be confused
// with pure-black character details (shoes, hair, eyes). Using alpha-only
// means the black shoe tips and black hair caps, which have max==min==0 and
// would be rejected by a chromatic test, are correctly included in bbox
// calculations — otherwise walk_up bands measured only the torso and the
// character appeared cut off at the knees.
function isColorContent(r, g, b, a) {
  return a > 16;
}

// Find horizontal bands of non-transparent pixels in a canvas.
// Skips the leftmost gutter (where labels live) and requires a minimum pixel
// count so that thin label artifacts don't bridge bands together. Counts only
// colorful pixels so label text can't create a phantom band.
function findBands(canvas, minH = 24, ignoreLeftPx = 0, minPixels = 30) {
  const w = canvas.width, h = canvas.height;
  const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const has = new Uint8Array(h);
  for (let y = 0; y < h; y++) {
    let n = 0;
    for (let x = ignoreLeftPx; x < w; x++) {
      const i = (y * w + x) * 4;
      if (isColorContent(data[i], data[i+1], data[i+2], data[i+3])) {
        n++;
        if (n >= minPixels) { has[y] = 1; break; }
      }
    }
  }
  const bands = [];
  let start = -1;
  let gapRows = 0;
  const allowGap = 2; // tolerate 1-2 fully-empty rows mid-character (eyes, gaps)
  for (let y = 0; y < h; y++) {
    if (has[y]) {
      if (start < 0) start = y;
      gapRows = 0;
    } else if (start >= 0) {
      gapRows++;
      if (gapRows > allowGap) {
        const y1 = y - gapRows + 1;
        if (y1 - start >= minH) bands.push({ y0: start, y1 });
        start = -1; gapRows = 0;
      }
    }
  }
  if (start >= 0 && (h - start) >= minH) bands.push({ y0: start, y1: h });
  return bands;
}

// Find frames within a horizontal band by scanning columns.
// Skips the leftmost gutter and tolerates small intra-frame gaps.
function findFrames(canvas, y0, y1, minW = 16, gap = 3, ignoreLeftPx = 0) {
  const w = canvas.width;
  const h = y1 - y0;
  const data = canvas.getContext('2d').getImageData(0, y0, w, h).data;
  const has = new Uint8Array(w);
  // Need a real colorful run per column so single-column-wide label strokes
  // don't register as content.
  const minColPx = 4;
  for (let x = ignoreLeftPx; x < w; x++) {
    let n = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      if (isColorContent(data[i], data[i+1], data[i+2], data[i+3])) {
        n++;
        if (n >= minColPx) { has[x] = 1; break; }
      }
    }
  }
  const frames = [];
  let start = -1, gapCount = 0;
  for (let x = 0; x < w; x++) {
    if (has[x]) {
      if (start < 0) start = x;
      gapCount = 0;
    } else if (start >= 0) {
      gapCount++;
      if (gapCount > gap) {
        const fw = (x - gapCount) - start + 1;
        if (fw >= minW) frames.push({ x: start, w: fw });
        start = -1; gapCount = 0;
      }
    }
  }
  if (start >= 0) {
    const fw = w - start;
    if (fw >= minW) frames.push({ x: start, w: fw });
  }
  return frames;
}

// For each band, build frame entries with the full band height (no cropping).
function bandFrames(canvas, band, minW = 20, ignoreLeftPx = 0) {
  const fs = findFrames(canvas, band.y0, band.y1, minW, 4, ignoreLeftPx);
  return fs.map(f => ({ x: f.x, y: band.y0, w: f.w, h: band.y1 - band.y0 }));
}

// Tight per-frame bbox: find column ranges, then shrink each frame's y to the
// exact row span of its pixels. The band-y is a crude bbox — e.g. walk_up's
// band is 79px because the back-of-head only registers ~10 pixels per pose;
// per-frame scanning pulls the true top-of-hair and bottom-of-heel for each
// pose individually so head and feet never clip.
function tightBandFrames(canvas, band, minW = 20, ignoreLeftPx = 0) {
  const cols = findFrames(canvas, band.y0, band.y1, minW, 4, ignoreLeftPx);
  const w = canvas.width;
  const bandH = band.y1 - band.y0;
  const data = canvas.getContext('2d').getImageData(0, band.y0, w, bandH).data;
  const out = [];
  for (const col of cols) {
    let yMin = -1, yMax = -1, xMin = -1, xMax = -1;
    const xEnd = col.x + col.w;
    for (let y = 0; y < bandH; y++) {
      for (let x = col.x; x < xEnd; x++) {
        const i = (y * w + x) * 4;
        if (isColorContent(data[i], data[i + 1], data[i + 2], data[i + 3])) {
          if (yMin < 0) yMin = y;
          yMax = y;
          if (xMin < 0 || x < xMin) xMin = x;
          if (x > xMax) xMax = x;
        }
      }
    }
    if (yMin >= 0) {
      out.push({
        x: xMin,
        y: band.y0 + yMin,
        w: xMax - xMin + 1,
        h: yMax - yMin + 1,
      });
    }
  }
  return out;
}

// Normalize frames within a row to a uniform rendering size so the character
// doesn't wobble horizontally as tight-bbox widths fluctuate (pose-to-pose
// silhouettes expand and contract as arms/legs spread). Each frame is widened
// to the median pitch, centered on its original bbox center — and heightened
// to the max tight height, bottom-anchored so feet always rest on the same
// ground line. Result: every frame renders at the same (drawW, drawH) with
// the character's visual center pinned to (p.x, p.y-footline), removing the
// "pirouette" effect caused by aspect ratio changes per frame.
function uniformizeRowFrames(frames) {
  if (frames.length < 2) return frames;
  const centers = frames.map(f => f.x + f.w / 2);
  const pitches = [];
  for (let i = 1; i < centers.length; i++) pitches.push(centers[i] - centers[i - 1]);
  pitches.sort((a, b) => a - b);
  const pitch = pitches[Math.floor(pitches.length / 2)];
  // Uniform width = pitch (slot fills exactly so characters are snug).
  const uniW = Math.round(pitch);
  // Uniform height = max height in the row so no frame gets clipped.
  let maxH = 0, maxBot = 0;
  for (const f of frames) {
    if (f.h > maxH) maxH = f.h;
    if (f.y + f.h > maxBot) maxBot = f.y + f.h;
  }
  return frames.map(f => {
    const cx = f.x + f.w / 2;
    // Bottom-anchored: each frame's bottom matches the row's bottom line,
    // so feet land at the same on-screen y regardless of pose.
    const bot = f.y + f.h;
    const newY = Math.max(0, bot - maxH);
    return {
      x: Math.max(0, Math.round(cx - uniW / 2)),
      y: newY,
      w: uniW,
      h: maxH,
    };
  });
}

// Cap to N frames if the scanner over-detected (e.g. label letters making it through).
function trimFramesTo(frames, expectedCount) {
  if (frames.length <= expectedCount) return frames;
  // Drop the smallest frames first (labels/noise)
  const sorted = frames.slice().sort((a, b) => b.w - a.w).slice(0, expectedCount);
  sorted.sort((a, b) => a.x - b.x);
  return sorted;
}

// Slice a band horizontally into `count` equal-width frames spanning the band's
// actual content extent (auto-trims label gutter). Adjacent characters often
// touch so column-gap detection merges them — uniform slicing fixes that.
function uniformSliceBand(canvas, band, count, ignoreLeftPx) {
  const w = canvas.width;
  const h = band.y1 - band.y0;
  const data = canvas.getContext('2d').getImageData(0, band.y0, w, h).data;
  let xMin = -1, xMax = -1;
  for (let x = ignoreLeftPx; x < w; x++) {
    let n = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      if (isColorContent(data[i], data[i+1], data[i+2], data[i+3])) {
        n++;
        if (n >= 4) break;
      }
    }
    if (n >= 4) {
      if (xMin < 0) xMin = x;
      xMax = x;
    }
  }
  if (xMin < 0 || count <= 0) return [];
  const totalW = xMax - xMin + 1;
  const frameW = totalW / count;
  const frames = [];
  for (let i = 0; i < count; i++) {
    frames.push({
      x: Math.round(xMin + i * frameW),
      y: band.y0,
      w: Math.round(frameW),
      h,
    });
  }
  return frames;
}

/* ============================================================================
   SHEET BINDING (after load + color-key + scan)
============================================================================ */
async function loadAllSheets() {
  const entries = await Promise.all(
    Object.entries(SHEETS).map(async ([k, src]) => {
      try {
        const img = await loadImage(src);
        const c = colorKey(imageToCanvas(img));
        return [k, c];
      } catch (e) {
        console.warn("sheet missing:", k, src);
        return [k, null];
      }
    })
  );
  for (const [k, c] of entries) state.images[k] = c;

  // Walk cycle: 4 bands (down/up/right/left), 9 poses each.
  //  1. findBands with a LOOSE pixel threshold (6) so head-tops and feet-tips,
  //     which contribute very few pixels per row, aren't dropped. The 4 rows
  //     are separated by lots of empty space so loose thresholding stays clean.
  //  2. tightBandFrames gives each pose its own precise y-extent — fixes the
  //     "walk_up is 79px tall vs walk_down 98px" discrepancy by measuring each
  //     pose individually instead of the whole band.
  //  3. uniformizeRowFrames normalizes all 9 frames in a row to one width +
  //     one height, so the character renders at a stable size and centered
  //     anchor — no more wobble/spin from per-frame aspect ratio changes.
  if (state.images.walk) {
    const c = state.images.walk;
    const gutter = 200; // label "walk_X_frames)" extends to ~x=200
    const bands = findBands(c, 40, gutter, 6);
    const order = ['walk_down', 'walk_up', 'walk_right', 'walk_left'];
    for (let i = 0; i < bands.length && i < order.length; i++) {
      let frames = tightBandFrames(c, bands[i], 24, gutter);
      frames = trimFramesTo(frames, 9);
      frames = uniformizeRowFrames(frames);
      WALK_FRAMES[order[i]] = frames;
    }
    state.walkSprite = c;
  }

  // Main / fallback sheet (single standing pose, no labels).
  if (state.images.main) {
    const c = state.images.main;
    const bands = findBands(c, 60, 0, 30);
    if (bands.length) {
      const frames = bandFrames(c, bands[0], 30, 0);
      if (frames.length) {
        ANIM_FRAMES.idle_down = [frames[0]];
        ANIM_FRAMES.idle_up = [frames[0]];
        ANIM_FRAMES.break_sit = [frames[0]];
        ANIM_FRAMES.mistake = [frames[0]];
      }
    }
    state.sprite = c;
  }

  // Tool icons: connected components (positions matter).
  if (state.images.tools) {
    extractToolIcons(state.images.tools);
    state.toolSprite = state.images.tools;
  }

  // Held-tool sheets: each has a known row layout. Pixel-scan bands & frames.
  if (state.images.hose) {
    // Hose sheet has 3 physical rows: idle/front, walk/movement, spray action.
    // Other directions use fallbacks in AnimController.sheetRect().
    bindHeldFrames(state.images.hose, HOSE_HELD_FRAMES,
      ['idle_down','walk_down','spray'], 6);
    state.hoseSprite = state.images.hose;
  }
  if (state.images.backbrush) {
    bindHeldFrames(state.images.backbrush, BACKBRUSH_HELD_FRAMES,
      ['idle_down','idle_up','walk_down','walk_right','scrub'], 8);
    state.backbrushSprite = state.images.backbrush;
  }
  if (state.images.scent_yellow) {
    bindHeldFrames(state.images.scent_yellow, SCENT_YELLOW_HELD_FRAMES,
      ['idle_down','walk_down','spray'], 5);
    state.scentYellowSprite = state.images.scent_yellow;
  }
  if (state.images.scent_red) {
    bindHeldFrames(state.images.scent_red, SCENT_RED_HELD_FRAMES,
      ['idle_down','walk_up','walk_right','walk_left','spray'], 8);
    state.scentRedSprite = state.images.scent_red;
  }
  if (state.images.scent_purple) {
    bindHeldFrames(state.images.scent_purple, SCENT_PURPLE_HELD_FRAMES,
      ['idle_down','walk_down','walk_right','spray'], 6);
    state.scentPurpleSprite = state.images.scent_purple;
  }

  // Pick a frameW/frameH from the walk sheet for default character sizing.
  // Also lock PLAYER_DRAW_W to walk_down's aspect so direction changes don't
  // cause width-jumps on screen (walk_down is the canonical front-facing pose).
  if (WALK_FRAMES.walk_down && WALK_FRAMES.walk_down.length) {
    const f = WALK_FRAMES.walk_down[0];
    state.frameW = f.w; state.frameH = f.h;
    PLAYER_DRAW_W = Math.round((f.w / f.h) * PLAYER_DRAW_H);
  } else {
    state.frameW = 64; state.frameH = 96;
  }

  state.loaded = true;
}

function bindHeldFrames(canvas, dict, rowOrder, expectedFramesPerRow) {
  const gutter = 90;
  const bands = findBands(canvas, 56, gutter, 100);
  let useBands = bands;
  if (bands.length > rowOrder.length) {
    // Drop a "title" row if the sheet has a header above the data rows.
    const heights = bands.map(b => b.y1 - b.y0);
    const sorted = heights.slice().sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];
    useBands = bands.filter(b => (b.y1 - b.y0) >= median * 0.6);
    if (useBands.length > rowOrder.length) {
      useBands = useBands.slice().sort((a, b) => (b.y1 - b.y0) - (a.y1 - a.y0))
                                  .slice(0, rowOrder.length)
                                  .sort((a, b) => a.y0 - b.y0);
    }
  }
  for (let i = 0; i < useBands.length && i < rowOrder.length; i++) {
    const frames = uniformSliceBand(canvas, useBands[i], expectedFramesPerRow, gutter);
    if (frames.length) dict[rowOrder[i]] = frames;
  }
  const actionKey = rowOrder[rowOrder.length - 1];
  if (dict[actionKey]) dict.action = dict[actionKey];
}

// Tool icons sheet: 4-connected flood-fill to find discrete blobs, then classify
// by dominant inner color (ignoring black outlines). Each blob becomes one sprite.
function extractToolIcons(canvas) {
  const w = canvas.width, h = canvas.height;
  const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
  const visited = new Uint8Array(w * h);
  const blobs = [];
  const stack = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      if (visited[idx]) continue;
      if (data[idx * 4 + 3] < 16) { visited[idx] = 1; continue; }
      // 4-connected BFS only — diagonals would merge the three scent hexagons,
      // which touch only on diagonal corners. Stay orthogonal to keep them apart.
      stack.length = 0;
      stack.push(x, y);
      visited[idx] = 1;
      let minX = x, maxX = x, minY = y, maxY = y, count = 0;
      // Color accumulators (ignore black outline pixels)
      let sr = 0, sg = 0, sb = 0, sn = 0;
      while (stack.length) {
        const cy = stack.pop();
        const cx = stack.pop();
        count++;
        if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
        if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
        const p = (cy * w + cx) * 4;
        const r = data[p], g = data[p + 1], b = data[p + 2];
        if (!(r < 60 && g < 60 && b < 60)) {
          sr += r; sg += g; sb += b; sn++;
        }
        const nbrs = [
          [cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1],
        ];
        for (const [nx, ny] of nbrs) {
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const nidx = ny * w + nx;
          if (visited[nidx]) continue;
          if (data[nidx * 4 + 3] < 16) continue;
          visited[nidx] = 1;
          stack.push(nx, ny);
        }
      }
      if (count > 200) {
        const cr = sn ? sr / sn : 0, cg = sn ? sg / sn : 0, cb = sn ? sb / sn : 0;
        blobs.push({
          x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1,
          count, cr, cg, cb,
        });
      }
    }
  }
  if (!blobs.length) return;

  // Classify each blob by dominant color / position.
  const classified = {};
  for (const b of blobs) {
    const { cr, cg, cb } = b;
    let name = null;
    // Character blob: tall, cyan shirt dominant (roughly r<130, g>140, b>180)
    const isChar = b.h > b.w * 1.3 && cb > 140 && cg > 110 && cr < 160;
    if (isChar) continue; // skip character
    // Green hose: g dominant
    if (cg > cr + 20 && cg > cb + 10 && cg > 80) name = 'hose';
    // Red scent
    else if (cr > 150 && cg < 120 && cb < 120) name = 'scent_red';
    // Yellow scent
    else if (cr > 160 && cg > 140 && cb < 120) name = 'scent_yellow';
    // Purple scent
    else if (cr > 80 && cb > cg + 20 && cr > cg + 10) name = 'scent_purple';
    // Brush: light warm tones (bristles + wood handle), neutral high rgb
    else if (cr > 160 && cg > 130 && Math.abs(cr - cg) < 60) name = 'backbrush';
    if (!name) continue;
    // If we already have this name, keep the larger blob.
    if (!classified[name] || classified[name].count < b.count) classified[name] = b;
  }

  const pad = 4;
  for (const name of Object.keys(classified)) {
    const b = classified[name];
    TOOL_SPRITES[name] = {
      x: Math.max(0, b.x - pad),
      y: Math.max(0, b.y - pad),
      w: Math.min(w, b.x + b.w + pad) - Math.max(0, b.x - pad),
      h: Math.min(h, b.y + b.h + pad) - Math.max(0, b.y - pad),
    };
  }
}

// (Legacy — no longer used, color-cluster extractor above handles this.)
function identifyScentColors(canvas, scents) {
  if (!scents.length) return [];
  const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  const w = canvas.width;
  const named = scents.map(b => {
    let r = 0, g = 0, bl = 0, n = 0;
    const cy = Math.floor(b.y + b.h / 2);
    const cx = Math.floor(b.x + b.w / 2);
    for (let y = cy - 4; y <= cy + 4; y++) {
      for (let x = cx - 4; x <= cx + 4; x++) {
        if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) continue;
        const i = (y * w + x) * 4;
        if (data[i + 3] < 16) continue;
        r += data[i]; g += data[i + 1]; bl += data[i + 2]; n++;
      }
    }
    if (!n) return ['scent_yellow', b];
    r /= n; g /= n; bl /= n;
    if (bl > 120 && bl > r * 0.9) return ['scent_purple', b];
    if (r > 160 && g > 130 && bl < 100) return ['scent_yellow', b];
    if (r > 150 && g < 100) return ['scent_red', b];
    // fallback by hue
    if (r > g && r > bl) return ['scent_red', b];
    if (bl > r && bl > g) return ['scent_purple', b];
    return ['scent_yellow', b];
  });
  // dedupe — if two map to the same name, give the conflicting one the missing name.
  const seen = new Set();
  const remaining = ['scent_yellow', 'scent_red', 'scent_purple'].filter(n =>
    !named.some(([nm]) => nm === n));
  const out = [];
  for (const [nm, b] of named) {
    if (!seen.has(nm)) { seen.add(nm); out.push([nm, b]); }
    else if (remaining.length) { const next = remaining.shift(); out.push([next, b]); seen.add(next); }
  }
  return out;
}

window.addEventListener('keydown', (e) => {
  AudioKit.unlock();
  const k = e.key.toLowerCase();
  if (!state.keys[k]) state.edges[k] = true;
  state.keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  state.keys[k] = false;
});
window.addEventListener('blur', () => { state.keys = {}; });

function consumeEdge(k) {
  const v = state.edges[k];
  if (v) state.edges[k] = false;
  return v;
}
function clearEdges() { state.edges = {}; }

/* ============================================================================
   TOUCH HUD — virtual D-pad + action buttons for phones/tablets.
   Buttons funnel through the same state.keys / state.edges system as the
   keyboard, so the gameplay code is identical for desktop and mobile.
============================================================================ */
// `let` (not const) so dev tooling / a debug flag can flip this at runtime.
let IS_TOUCH = (('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0);
function pressVKey(k) {
  AudioKit.unlock();
  if (!state.keys[k]) state.edges[k] = true;
  state.keys[k] = true;
}
function releaseVKey(k) { state.keys[k] = false; }
// Some buttons need to fire ALSO an 'enter' edge so they activate start /
// game-over screens that listen for ENTER. The big A-button does this.
function pressVKeyAlias(k) {
  if (k === 'e') {
    if (!state.keys['enter']) state.edges['enter'] = true;
    state.keys['enter'] = true;
  }
}
function releaseVKeyAlias(k) {
  if (k === 'e') state.keys['enter'] = false;
}

function bindTouchButton(btn) {
  // data-k = edge-trigger (one tap = one edge), data-hold = continuous hold
  // (sets state.keys true while pressed). A button can have both: tap fires
  // the edge AND while held the key is "down" — matches keydown/keyup semantics.
  const tap  = btn.getAttribute('data-k');
  const hold = btn.getAttribute('data-hold');
  const down = (e) => {
    e.preventDefault();
    if (tap)  { pressVKey(tap);  pressVKeyAlias(tap); }
    if (hold && hold !== tap) pressVKey(hold);
    btn.dataset.pressed = '1';
  };
  const up = (e) => {
    if (e) e.preventDefault();
    if (hold) releaseVKey(hold);
    if (tap)  { releaseVKey(tap); releaseVKeyAlias(tap); }
    btn.dataset.pressed = '';
  };
  // pointer events handle mouse + touch + pen uniformly
  btn.addEventListener('pointerdown',   down, { passive: false });
  btn.addEventListener('pointerup',     up,   { passive: false });
  btn.addEventListener('pointercancel', up,   { passive: false });
  btn.addEventListener('pointerleave',  (e) => { if (btn.dataset.pressed) up(e); });
  // Prevent the touch from triggering the page scroll / context menu
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}

function setupTouchHud() {
  if (!IS_TOUCH) return;
  document.body.classList.add('touch');
  document.querySelectorAll('#touchHud [data-k], #touchHud [data-hold], #touchModal [data-k]')
    .forEach(bindTouchButton);
}

// Toggle the modal-mode class so the touch HUD swaps between gameplay
// controls and the bigger Next/Back/Skip strip when a modal is up.
function syncTouchModalMode() {
  if (!IS_TOUCH) return;
  const modal = state.startScreen || state.tutorialOpen
             || state.phoneOpen   || state.gameOver
             || state.paused || !!state.shiftOver || state.shiftIntro > 0;
  document.body.classList.toggle('touch-modal', !!modal);
  document.body.classList.toggle('touch-tutorial', !!state.tutorialOpen);
}

const CAR_BODY_COLORS = [
  '#e53935', '#43a047', '#fdd835', '#1e1e1e', '#1976d2', '#8e24aa', '#fb8c00'
];

function makeCar() {
  const diff = getDifficulty();
  let seq;
  const r = Math.random();
  // ~25% of cars don't want scents — just basic wash
  const wantsScents = Math.random() > 0.25;
  if (!wantsScents) {
    seq = ['hose','backbrush'];
  } else if (diff <= 1) {
    seq = r < 0.5 ? ['hose','backbrush','scent_yellow'] : ['hose','backbrush','scent_red'];
  } else if (diff <= 4) {
    seq = r < 0.4 ? ['hose','backbrush','scent_yellow','scent_purple']
                  : ['hose','backbrush','scent_red'];
  } else {
    if (r < 0.5)      seq = ['hose','backbrush','scent_yellow','scent_purple'];
    else if (r < 0.8) seq = ['hose','backbrush','scent_red','scent_purple'];
    else              seq = ['hose','backbrush','scent_yellow','scent_red'];
  }
  // Car move speed increases with difficulty
  const moveSpeed = Math.min(CAR_MOVE_SPEED_MAX, CAR_MOVE_SPEED_BASE + diff * 8);
  // VIP: ~10% chance once shift is going (>=2 cars served).
  const isVip = state.carsServed >= 2 && Math.random() < 0.10;
  // Rainy weather → cars arrive dirtier (extra hose step at the front).
  if (state.weather === 'rainy' && Math.random() < 0.6) {
    seq = ['hose', ...seq];
  }
  // Car types: trucks need an extra scrub, sports cars are fast + impatient,
  // muddy cars need an extra rinse. Each pays more than a plain sedan.
  const day = state.day || 1, kr = Math.random();
  let kind = 'sedan', w = CAR_W, h = CAR_H, speedMult = 1, tipKind = 1, patienceKind = 1;
  if (day >= 2 && kr < 0.14) {
    kind = 'truck'; w = 150; h = 62; speedMult = 0.8; tipKind = 1.5;
    seq.splice(seq.indexOf('backbrush') + 1, 0, 'backbrush');
  } else if (day >= 2 && kr < 0.28) {
    kind = 'sports'; w = 112; h = 46; speedMult = 1.3; tipKind = 1.6; patienceKind = 1.25;
  } else if (kr > (state.weather === 'rainy' ? 0.72 : 0.86)) {
    kind = 'muddy'; tipKind = 1.3;
    if (seq[1] !== 'hose') seq = ['hose', ...seq];
  }
  return {
    kind, tipKind, patienceKind,
    popIdx: -1, popT: 0, squash: 0, wrongT: 0,
    x: -(w + 20),   // starts just off the left edge
    y: BAY_Y,
    w, h,
    color: CAR_BODY_COLORS[Math.floor(Math.random() * CAR_BODY_COLORS.length)],
    // States: 'arriving' → 'loading' → 'moving' → 'driving_out' | 'leaving_angry'
    state: 'arriving',
    sequence: seq,
    progress: 0,
    satisfaction: 100,
    perfectSoFar: true,
    dirt: 1.0,
    finalTip: 0,
    topRarity: null,
    moveSpeed: Math.min(CAR_MOVE_SPEED_MAX * 1.2, moveSpeed * speedMult),
    loadMeter: 0,
    loadTimer: 0,
    exitLeft: false,
    wantsScents,
    greeted: false,          // has Yasa said "welcome in"?
    offeredScents: false,    // has Yasa asked about scents?
    thanked: false,          // has Yasa said "have a great day"?
    speech: null,            // { text, life, max, color }
    missTriggered: false,    // true once the escape-miss has fired
    impatientCooldown: 2.5,  // seconds until next impatient line
    vip: isVip,
    vipAnnounce: isVip,
    vipHonkCooldown: isVip ? 2.0 : 0,
    birdSplat: false,
    birdSplatProgress: 0,    // 1 = full splat, 0 = clean
  };
}

function makeManager() {
  // Danny starts inside the break room and comes out after a short delay.
  // This way the player always sees him walk out from the door — never
  // materialises in the middle of the floor.
  return {
    // Position him right at the break-room door so when he steps out
    // he walks from the correct spot.
    x: BREAK_ROOM_DOOR_X - 30,
    y: BREAK_ROOM_DOOR_Y + 40,
    targetX: BREAK_ROOM_DOOR_X - 30,
    targetY: BREAK_ROOM_DOOR_Y + 40,
    speed: 60,
    waitTimer: 1.0,
    facing: 'left',
    catchCooldown: 0,
    bumpCount: 0,
    bumpContact: false,
    bumpCooldown: 0,
    friendlyCooldown: 4 + Math.random() * 4,
    // Start IN the break room — first appearance is him walking out.
    // Phases: 'in_break' → 'returning' (walks out) → 'floor' (patrols) →
    //         'heading_break' (walks back) → 'in_break' → repeat
    breakPhase: 'in_break',
    breakPhaseTimer: 3 + Math.random() * 4,  // 3-7s before first appearance
    speech: null,
  };
}

function buildStations() {
  state.stations = STATIONS_DEF.map(s => ({ ...s }));
}

/* ============================================================================
   GAMEPLAY HELPERS
============================================================================ */
function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; }
function within(p, x, y, r) { return dist2(p.x, p.y, x, y) <= r*r; }

function addFloating(text, x, y, color = C_TEXT, life = 1.2, tag = null) {
  // If a tagged floater already exists (e.g. "danny"), drop it so the new one
  // takes its place — prevents stacking/overlap when Danny chats rapidly.
  if (tag) {
    state.floatingTexts = state.floatingTexts.filter(f => f.tag !== tag);
  }
  // Anti-overlap nudge: if any active floater is within 30px vertically and
  // 140px horizontally, lift this new one above it so they don't smash together.
  let ny = y;
  for (const f of state.floatingTexts) {
    if (Math.abs(f.x - x) < 140 && Math.abs(f.y - ny) < 30) ny = f.y - 32;
  }
  state.floatingTexts.push({ text, x, y: ny, color, life, max: life, vy: -34, scale: 1.25, tag });
}

const _lineHistory = new WeakMap();
function pickLine(arr) {
  if (!arr || !arr.length) return '';
  if (arr.length === 1) return arr[0];
  let hist = _lineHistory.get(arr);
  if (!hist) { hist = []; _lineHistory.set(arr, hist); }
  // Avoid the last min(N/2, 8) shown
  const avoid = Math.min(Math.floor(arr.length / 2), 8);
  let idx, tries = 0;
  do {
    idx = Math.floor(Math.random() * arr.length);
    tries++;
  } while (hist.includes(idx) && tries < 20);
  hist.push(idx);
  if (hist.length > avoid) hist.shift();
  return arr[idx];
}

// Pick a scent reply that matches the car's actual sequence so the dialogue
// doesn't contradict the icon bubble (e.g. car won't say "lemon please" if
// their sequence only has Black Ice).
function pickScentReply(car) {
  const seq = car.sequence;
  const hasLemon  = seq.includes('scent_yellow');
  const hasBlack  = seq.includes('scent_red');
  const hasMystery = seq.includes('scent_purple');
  // If only one scent — be specific
  if (hasLemon && !hasBlack && !hasMystery) return pickLine(CAR_LINES.yesLemon);
  if (hasBlack && !hasLemon && !hasMystery) return pickLine(CAR_LINES.yesBlackIce);
  if (hasMystery && !hasLemon && !hasBlack) return pickLine(CAR_LINES.yesMystery);
  // Multiple scents — mention one of them at random, or go generic
  if (Math.random() < 0.5) return pickLine(CAR_LINES.yesGeneric);
  if (hasMystery) return pickLine(CAR_LINES.yesMystery);
  if (hasBlack)   return pickLine(CAR_LINES.yesBlackIce);
  return pickLine(CAR_LINES.yesLemon);
}

// Car speech — anchored above the car. Replaces any existing bubble.
