/* ============================================================================
   PARTICLES + FLOATING TEXT
============================================================================ */
function updateParticles(dt) {
  for (const p of state.particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.g * dt;
  }
  state.particles = state.particles.filter(p => p.life > 0);
  for (const t of state.floatingTexts) {
    t.life -= dt;
    t.y += t.vy * dt;
    // dt-independent deceleration: ~6% per frame at 60fps
    t.vy *= Math.pow(0.94, dt * 60);
    // scale pops up on spawn then eases back to 1 over first 0.2s
    if (t.scale > 1) t.scale = Math.max(1, t.scale - dt * 4);
  }
  state.floatingTexts = state.floatingTexts.filter(t => t.life > 0);
}

/* ============================================================================
   DRAWING
============================================================================ */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

function clearScreen() {
  ctx.fillStyle = C_UI_BG;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function drawBackground() {
  // Painted scene (bg.png) — counter with tools, break-room door on the
  // right, three parking bays, road. All sprite positions are calibrated
  // against this art. If the image hasn't loaded yet, fall back to a flat
  // concrete floor so the game is still playable during the first frames.
  if (state.bgImage) {
    ctx.drawImage(state.bgImage, 0, 0, VIEW_W, VIEW_H);
  } else {
    ctx.fillStyle = C_FLOOR;
    ctx.fillRect(0, 200, VIEW_W, VIEW_H - 200);
  }

  // Break-room door hover prompt — the door itself is painted in the BG.
  // Shares the [E] chip style with tool pickups. Blue tint so it reads
  // as "door" rather than "tool". Tight radius so the chip only appears
  // when you're clearly standing at the door.
  if (within(state.player, BREAK_ROOM_DOOR_X, BREAK_ROOM_DOOR_Y, 70)) {
    drawEChip(state.player.x, state.player.y - 140, '#1e88e5');
  }
}

// Parse a "#rrggbb" hex string into an {r,g,b} triple.
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return { r: (n >> 16) & 0xff, g: (n >> 8) & 0xff, b: n & 0xff };
}

// Draw the pulsing [E] interact chip at (x,y).
//   colorHex — "#rrggbb" of the tintable background; defaults to a neutral
//     dark-blue when omitted (e.g. for the break-room door).
// Opacity is intentionally LOW so the chip doesn't obscure art.
function drawEChip(x, y, colorHex) {
  const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 220);
  const w = 26, h = 20;
  const base = colorHex ? hexToRgb(colorHex) : { r: 30, g: 42, b: 64 };
  // Background fill: item color at ~35% + pulse bump — subtle, tinted.
  ctx.fillStyle = `rgba(${base.r},${base.g},${base.b},${0.28 + 0.18 * pulse})`;
  ctx.fillRect(x - w / 2, y - h, w, h);
  // Outline: same color, brighter, so the chip edge reads against busy BG.
  ctx.strokeStyle = `rgba(${base.r},${base.g},${base.b},${0.5 + 0.4 * pulse})`;
  ctx.lineWidth = 1;
  ctx.strokeRect(x - w / 2 + 0.5, y - h + 0.5, w - 1, h - 1);
  // "E" label: soft white — readable on any tint without being loud.
  ctx.fillStyle = `rgba(255,255,255,${0.55 + 0.35 * pulse})`;
  ctx.font = 'bold 14px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('E', x, y - h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

// Returns the first station the player is currently close enough to pick up.
// Requires the player to be "hugging the wall" (near the counter, top of the
// walkable area) AND horizontally within the tool. This frees up the mid-
// floor for tool work without accidentally grabbing something.
function stationInReach() {
  const p = state.player;
  // Hug-wall check: must be near the top of the walkable area.
  if (p.y > FLOOR_MIN_Y + STATION_PICKUP_Y) return null;
  let best = null, bestD = STATION_PICKUP_X + 1;
  for (const s of state.stations) {
    const d = Math.abs(p.x - s.x);
    if (d < bestD) { best = s; bestD = d; }
  }
  return best;
}

function drawStations() {
  // Stations are PAINTED INTO THE BG — hoses, brushes, and scent bottles
  // live on the counter in bg.png. We don't draw pedestals/icons OR a
  // text label on hover (the label would obscure the painted tool you're
  // trying to see). Instead: a small tinted [E] chip over the player's
  // head, colored to match the tool so you know WHAT you're picking up.
  const s = stationInReach();
  if (s) drawEChip(state.player.x, state.player.y - 140, s.color);
}

function drawToolIcon(id, cx, cy, h) {
  const sp = TOOL_SPRITES[id];
  if (sp && state.toolSprite) {
    const scale = h / sp.h;
    const w = sp.w * scale;
    ctx.drawImage(state.toolSprite, sp.x, sp.y, sp.w, sp.h, cx - w/2, cy - h/2, w, h);
    // No rarity frame — the AI-drawn bottle already reads as its color.
  } else {
    // Fallback: colored badge
    let col = '#90caf9';
    if (id === 'hose') col = '#43a047';
    else if (id === 'backbrush') col = '#fff59d';
    else if (id === 'scent_yellow') col = '#fdd835';
    else if (id === 'scent_red') col = '#e53935';
    else if (id === 'scent_purple') col = '#8e24aa';
    ctx.fillStyle = col;
    ctx.fillRect(cx - h/2, cy - h/2, h, h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - h/2, cy - h/2, h, h);
  }
}

// Pixel-art car renderer. All coordinates are on a 1-pixel grid so the result
// matches the 8-bit BG art style. Cars face RIGHT (headlights on the right).
// The car is 120×54 at default CAR_W/H. All offsets below are written for
// that size; sx/sy scale them linearly so the proportions hold at any size.
function drawCar(c) {
  const W = c.w, H = c.h;
  const bx = Math.round(c.x - W / 2);   // pixel-snapped left edge
  const by = Math.round(c.y - H / 2);   // pixel-snapped top edge

  // ── Ground shadow ───────────────────────────────────────────────────────
  // Soft dark ellipse under the car so it grounds to the asphalt instead of
  // floating. Wider than the car body, faded out at the edges. Drawn first
  // so the body and wheels overlay it cleanly.
  ctx.save();
  const sgx = c.x;
  const sgy = c.y + H / 2 + 8;          // ground line ~ wheel bottom
  const sgrad = ctx.createRadialGradient(sgx, sgy, 4, sgx, sgy, W * 0.62);
  sgrad.addColorStop(0,    'rgba(0,0,0,0.45)');
  sgrad.addColorStop(0.55, 'rgba(0,0,0,0.22)');
  sgrad.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = sgrad;
  ctx.beginPath();
  ctx.ellipse(sgx, sgy, W * 0.62, H * 0.40, 0, 0, Math.PI * 2);
  ctx.fill();
  // Crisp inner shadow band right under the body for that "weight" look
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(sgx, sgy - 2, W * 0.46, H * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // Scale helpers so all magic numbers read against the 120×54 reference.
  const sx = W / 120, sy = H / 54;
  function px(v) { return Math.round(v * sx); }
  function py(v) { return Math.round(v * sy); }
  function fill(col, rx, ry, rw, rh) {
    ctx.fillStyle = col;
    ctx.fillRect(bx + px(rx), by + py(ry), Math.max(1, px(rw)), Math.max(1, py(rh)));
  }

  // ── Body ────────────────────────────────────────────────────────────────
  // Main chassis block
  fill(c.color,  0, 10, 120, 34);
  // Dark bottom undercarriage strip (ground shadow line)
  const dark = shadeColor(c.color, -38);
  fill(dark,     0, 38, 120,  6);
  // Bright top highlight stripe (one-pixel rim light along roof edge)
  const lite = shadeColor(c.color,  40);
  fill(lite,     2, 10, 116,  3);

  // ── Cabin / roof ────────────────────────────────────────────────────────
  // Roof block sits on top of body, narrower, dark charcoal
  fill('#1c1c1c', 28,  0, 64, 12);
  // Roof highlight
  fill('#2e2e2e', 30,  1, 60,  3);

  // ── Windows ─────────────────────────────────────────────────────────────
  // Front windshield (right side, faces forward)
  fill('#9ecff7', 78,  2, 12,  8);   // glass
  fill('#c8e8ff', 79,  2,  4,  3);   // glint
  // Rear window (left side)
  fill('#9ecff7', 30,  2, 12,  8);
  fill('#c8e8ff', 31,  2,  4,  3);
  // A-pillar dividers (dark strips between glass panes)
  fill('#1c1c1c', 74,  0,  4, 12);
  fill('#1c1c1c', 42,  0,  4, 12);

  // ── Door panel lines ─────────────────────────────────────────────────────
  // Two vertical seam lines on body sides give the car door details
  fill(dark,  46, 11,  2, 26);
  fill(dark,  76, 11,  2, 26);
  // Door handle nubs
  fill(lite,  52, 22,  6,  3);
  fill(lite,  82, 22,  6,  3);

  // ── Bumpers ─────────────────────────────────────────────────────────────
  fill('#2a2a2a',  0, 12,  5, 30);  // rear bumper (left)
  fill('#2a2a2a', 115, 12,  5, 30); // front bumper (right)
  fill('#555',   116, 16,  4,  6);  // headlight block
  fill('#555',   116, 32,  4,  6);

  // ── Headlights ───────────────────────────────────────────────────────────
  fill('#fff9a0', 117, 16,  3,  5); // top headlight
  fill('#fff9a0', 117, 32,  3,  5); // bottom headlight
  // Tail lights (red, on left/rear)
  fill('#ff3d3d',   1, 16,  3,  5);
  fill('#ff3d3d',   1, 32,  3,  5);

  // ── Wheels ──────────────────────────────────────────────────────────────
  // Drawn BELOW the body baseline (y > H) to peek out from underneath.
  const ww = px(20), wh = py(12);
  const wy = by + py(44);           // wheel top sits 2px below body bottom
  const wx1 = bx + px(12);         // rear axle (left)
  const wx2 = bx + px(88);         // front axle (right)
  // Tyre
  ctx.fillStyle = '#111';
  ctx.fillRect(wx1, wy, ww, wh);
  ctx.fillRect(wx2, wy, ww, wh);
  // Hub cap (lighter inner ring, 1px pixel-art style)
  ctx.fillStyle = '#444';
  ctx.fillRect(wx1 + px(5), wy + py(3), px(10), py(6));
  ctx.fillRect(wx2 + px(5), wy + py(3), px(10), py(6));
  // Hub highlight dot
  ctx.fillStyle = '#888';
  ctx.fillRect(wx1 + px(8), wy + py(4), px(4), py(4));
  ctx.fillRect(wx2 + px(8), wy + py(4), px(4), py(4));
  // Wheel arch cutout (removes the rectangular corner from body above wheel)
  ctx.fillStyle = 'rgba(0,0,0,0)'; // transparent — we overdraw with the car color
  // Draw arch shadow on body
  fill(dark, 10, 40, 22, 4);    // rear arch shadow
  fill(dark, 86, 40, 22, 4);    // front arch shadow

  // ── Car type details ────────────────────────────────────────────────────
  if (c.kind === 'truck') {
    fill('#eceff1', 0, -18, 66, 30);          // cargo box over the rear
    fill('#b0bec5', 0, 8, 66, 4);
    fill('#cfd8dc', 2, -16, 62, 3);
    fill(c.color, 6, -6, 54, 6);              // livery stripe
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by + py(-18) + 0.5, px(66) - 1, py(30) - 1);
  } else if (c.kind === 'sports') {
    fill('#111', 0, 3, 18, 3);                // spoiler wing
    fill('#111', 6, 6, 3, 5);
    fill('rgba(255,255,255,0.85)', 0, 23, 120, 3);
    fill('rgba(255,255,255,0.85)', 0, 28, 120, 2);
  } else if (c.kind === 'muddy') {
    const mud = `rgba(93,64,55,${0.35 + 0.55 * c.dirt})`;
    for (const [rx, ry, rw, rh] of [[2,30,22,12],[26,34,18,8],[50,31,26,11],[80,33,20,9],[100,29,18,13],[14,22,10,8],[66,24,9,7]]) {
      fill(mud, rx, ry, rw, rh);
    }
    fill(mud, 12, 42, 3, 6); fill(mud, 58, 42, 3, 5); fill(mud, 96, 42, 3, 7);
  }

  // ── Dirt overlay ────────────────────────────────────────────────────────
  // Pixel-art grime: small squares scattered across the body.
  if (c.dirt > 0.02) {
    const dirtColor = `rgba(52,36,14,${0.7 * c.dirt})`;
    const spots = [
      [6, 14, 8, 6], [18, 20, 6, 5], [56, 13, 10, 4],
      [36, 26, 7, 4], [70, 18, 8, 5], [92, 24, 6, 4],
      [48, 32, 9, 3], [10, 30, 5, 4], [100, 14, 7, 5],
    ];
    for (const [rx, ry, rw, rh] of spots) {
      fill(dirtColor, rx, ry, rw * c.dirt, rh * c.dirt);
    }
  }

  // ── 1-px outline for pixel art crispness ────────────────────────────────
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + py(10) + 0.5, W - 1, py(34) - 1);

  // ── VIP gold outline + crown ─────────────────────────────────────────────
  if (c.vip) {
    ctx.save();
    const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 180);
    ctx.strokeStyle = `rgba(255,213,79,${0.7 + 0.3 * pulse})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(bx - 1, by + py(10) - 1, W + 2, py(34) + 2);
    // Sparkle dots around the body
    ctx.fillStyle = `rgba(255,245,157,${pulse})`;
    const sparkX = [10, 60, 110, 30, 90];
    const sparkY = [4, 6, 4, 8, 8];
    for (let i = 0; i < sparkX.length; i++) {
      ctx.fillRect(bx + px(sparkX[i]) + ((i + Math.floor(performance.now()/200)) % 3 - 1),
                   by + py(sparkY[i]), 2, 2);
    }
    // Crown above roof
    const cx0 = c.x, cy0 = by - 14;
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(cx0 - 10, cy0 + 8);
    ctx.lineTo(cx0 - 10, cy0);
    ctx.lineTo(cx0 - 5,  cy0 + 4);
    ctx.lineTo(cx0,      cy0 - 4);
    ctx.lineTo(cx0 + 5,  cy0 + 4);
    ctx.lineTo(cx0 + 10, cy0);
    ctx.lineTo(cx0 + 10, cy0 + 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // ── Bird splat on roof ───────────────────────────────────────────────────
  if (c.birdSplat && c.birdSplatProgress > 0) {
    ctx.save();
    const sp = c.birdSplatProgress;
    ctx.fillStyle = `rgba(255,255,255,${0.85 * sp})`;
    // Main blob on roof
    const rx0 = c.x + 5, ry0 = by + 4;
    ctx.beginPath();
    ctx.ellipse(rx0, ry0, 9 * sp, 5 * sp, 0, 0, Math.PI * 2);
    ctx.fill();
    // Drips
    ctx.beginPath();
    ctx.ellipse(rx0 - 6, ry0 + 4, 3 * sp, 2 * sp, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(rx0 + 7, ry0 + 3, 3 * sp, 2 * sp, 0, 0, Math.PI * 2);
    ctx.fill();
    // Greenish center
    ctx.fillStyle = `rgba(150,200,80,${0.6 * sp})`;
    ctx.beginPath();
    ctx.ellipse(rx0, ry0, 3 * sp, 2 * sp, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ── Loading meter (spam-F state) ─────────────────────────────────────────
  if (c.state === 'loading') {
    const lim = Math.max(3, LOAD_TIME_LIMIT - getDifficulty() * 0.3);
    drawLoadMeter(c, lim);
  }

  // ── Sequence bubble + patience bar (moving state) ────────────────────────
  if (c.state === 'moving') {
    drawSequenceBubble(c);
    drawPatienceBar(c);
    // "ESCAPING!" warning when car is past halfway and not fully serviced
    if (c.progress < c.sequence.length) {
      const missThreshold = VIEW_W - Math.floor(c.w / 3);
      const warnStart = VIEW_W * 0.55;
      if (c.x > warnStart) {
        const urgency = Math.min(1, (c.x - warnStart) / (missThreshold - warnStart));
        const flash = urgency > 0.5 ? (Math.sin(Date.now() * 0.018) > 0 ? 1 : 0) : 1;
        if (flash) {
          ctx.save();
          ctx.font = `bold ${Math.round(11 + urgency * 5)}px monospace`;
          ctx.textAlign = 'center';
          const alpha = 0.6 + urgency * 0.4;
          ctx.fillStyle = `rgba(255,${Math.round(200 - urgency * 180)},50,${alpha})`;
          ctx.fillText('ESCAPING!', c.x, carTop(c) - 90);
          ctx.restore();
        }
      }
    }
  }
  // ── Angry tint ───────────────────────────────────────────────────────────
  if (c.state === 'leaving_angry') {
    ctx.fillStyle = 'rgba(239,83,80,0.28)';
    ctx.fillRect(bx, by + py(10), W, py(34));
  }

  // Car speech bubble — side-mounted so it never covers the sequence bubble.
  // Prefer the right side (player usually approaches from left on entry); if
  // the car is near the right edge, flip to the left so it stays on-screen.
  if (c.speech) {
    const fade = Math.min(1, c.speech.life / 0.4);
    const preferRight = c.x < VIEW_W - 220;
    const sideDir = preferRight ? 'left' : 'right';
    const anchorX = preferRight ? c.x + c.w / 2 : c.x - c.w / 2;
    drawSpeechBubble(anchorX, c.y - 4, c.speech.text, c.speech.color, fade, sideDir);
  }
}

// Darken or lighten a hex color by `amount` (-255..+255).
function shadeColor(hex, amount) {
  let n = parseInt(hex.replace('#',''), 16);
  let r = Math.min(255, Math.max(0, (n >> 16) + amount));
  let g = Math.min(255, Math.max(0, ((n >> 8) & 0xff) + amount));
  let b = Math.min(255, Math.max(0, (n & 0xff) + amount));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function drawLoadMeter(c, loadLimit) {
  loadLimit = loadLimit || LOAD_TIME_LIMIT;
  const pressRatio = Math.min(1, c.loadMeter);
  const timeRatio  = Math.max(0, 1 - c.loadTimer / loadLimit);
  const cx = c.x;
  const baseY = c.y - c.h / 2 - 14;   // just above the car roof

  // ── Time ring (outer arc countdown) ────────────────────────────────────
  const ringR = 26;
  const ringX = cx, ringY = baseY - 52;
  ctx.save();
  // Track (grey)
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(ringX, ringY, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2);
  ctx.stroke();
  // Fill (color shifts green→yellow→red as time runs out)
  let ringCol = '#69f0ae';
  if (timeRatio < 0.5) ringCol = '#ffd54f';
  if (timeRatio < 0.25) ringCol = '#ef5350';
  ctx.strokeStyle = ringCol;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const endAngle = -Math.PI / 2 + Math.PI * 2 * timeRatio;
  ctx.arc(ringX, ringY, ringR, -Math.PI / 2, endAngle);
  ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.restore();

  // ── [E] label in ring center ─────────────────────────────────────────────
  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 130);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(255,255,255,${0.7 + 0.3 * pulse})`;
  ctx.font = `bold ${Math.round(14 + pulse * 3)}px ui-monospace, monospace`;
  ctx.fillText('E', ringX, ringY);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();

  // ── Progress bar (presses filled) ────────────────────────────────────────
  const bw = 80, bh = 8;
  const bx = cx - bw / 2, by = baseY - 16;
  // Track
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
  // Fill — green when done, accent otherwise
  const barCol = pressRatio >= 1 ? '#69f0ae' : C_ACCENT;
  ctx.fillStyle = barCol;
  ctx.fillRect(bx, by, bw * pressRatio, bh);
  // Segment ticks so each press is visible
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  const presses = loadPresses();
  for (let i = 1; i < presses; i++) {
    const tx = bx + (bw / presses) * i;
    ctx.beginPath(); ctx.moveTo(tx, by); ctx.lineTo(tx, by + bh); ctx.stroke();
  }

  // ── "SPAM E" text below bar ───────────────────────────────────────────────
  ctx.save();
  ctx.globalAlpha = 0.5 + 0.5 * pulse;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe082';
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.fillText('SPAM E TO LOAD', cx, by + bh + 12);
  ctx.restore();

  // ── Critical flash overlay ────────────────────────────────────────────────
  if (timeRatio < 0.3) {
    const flash = 0.25 * Math.abs(Math.sin(performance.now() / 80));
    ctx.fillStyle = `rgba(239,83,80,${flash})`;
    ctx.fillRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h);
  }
}

// Top of the car's silhouette (trucks carry a cargo box above the roof line).
function carTop(c) { return c.y - c.h / 2 - (c.kind === 'truck' ? 22 : 0); }

function drawSequenceBubble(c) {
  const items = c.sequence;
  const iconSize = 28;
  const pad = 6;
  const w = items.length * (iconSize + pad) + pad;
  const h = iconSize + pad * 2 + 4;
  const x = c.x - w / 2;
  const y = carTop(c) - 60;
  // Bubble
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  roundRect(x, y, w, h, 8, true, false);
  ctx.strokeStyle = '#0D1B2A';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 8, false, true);
  // Tail
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(c.x - 6, y + h);
  ctx.lineTo(c.x + 6, y + h);
  ctx.lineTo(c.x, y + h + 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#0D1B2A';
  ctx.beginPath();
  ctx.moveTo(c.x - 6, y + h);
  ctx.lineTo(c.x, y + h + 8);
  ctx.lineTo(c.x + 6, y + h);
  ctx.stroke();
  // Items
  for (let i = 0; i < items.length; i++) {
    const ix = x + pad + i * (iconSize + pad) + iconSize / 2;
    const iy = y + pad + iconSize / 2 + 2;
    const done = i < c.progress;
    const current = i === c.progress;
    if (current) {
      // Pulsing highlight on the slot the player needs to fill next
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 180);
      ctx.fillStyle = `rgba(255,245,100,${pulse})`;
      ctx.fillRect(ix - iconSize/2 - 3, iy - iconSize/2 - 3, iconSize + 6, iconSize + 6);
    }
    const popS = (i === c.popIdx && c.popT > 0) ? 1 + c.popT * 1.7 : 1;
    drawToolIcon(items[i], ix, iy, iconSize * popS);
    if (done) {
      ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ix - 8, iy + 1);
      ctx.lineTo(ix - 2, iy + 7);
      ctx.lineTo(ix + 8, iy - 6);
      ctx.stroke();
    }
  }
}

function drawPatienceBar(c) {
  const ratio = Math.max(0, Math.min(1, c.satisfaction / 100));
  const w = 80, h = 6;
  const x = c.x - w/2;
  // Positioned just below the sequence bubble (bubble = car.y - c.h/2 - 60,
  // bubble height ~44) so they don't overlap. -10 gives 6px gap below bubble.
  let y = carTop(c) - 10;
  // Shake the bar vertically when patience is critically low — visual urgency.
  if (ratio < 0.2) {
    const shake = Math.sin(performance.now() / 70) * 1.5;
    y += shake;
  }
  // Pulsing red glow behind bar at critical patience.
  if (ratio < 0.25) {
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 160));
    ctx.fillStyle = `rgba(239,83,80,${0.35 * pulse})`;
    ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  let col = '#66bb6a';
  if (ratio < 0.5) col = '#ffd54f';
  if (ratio < 0.25) col = '#ef5350';
  ctx.fillStyle = col;
  ctx.fillRect(x, y, w * ratio, h);
}

function drawManager() {
  const m = state.manager;
  if (!m) return;
  // Scale Danny up so he reads as the same physical size as Yasa.
  // Yasa is 128px tall; original Danny was ~86px tall → scale ≈ 1.5×.
  const DANNY_SCALE = 1.1;
  const x = m.x;
  // Walk bob: vertical sine when moving so Danny feels alive
  const isMoving = Math.abs(m.x - m.targetX) > 3 || Math.abs(m.y - m.targetY) > 3;
  const bob = isMoving ? Math.sin(performance.now() / 110) * 2.5 : 0;
  const y = m.y - bob;

  // Ground shadow — drawn at world scale (not affected by Danny scaling) so
  // the contact patch stays grounded under his feet at the proper size.
  const shadowW = 26 * DANNY_SCALE;
  const shadowH = 7  * DANNY_SCALE;
  const sgrad = ctx.createRadialGradient(x, m.y, 2, x, m.y, shadowW);
  sgrad.addColorStop(0,    'rgba(0,0,0,0.40)');
  sgrad.addColorStop(0.6,  'rgba(0,0,0,0.18)');
  sgrad.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = sgrad;
  ctx.beginPath();
  ctx.ellipse(x, m.y - 2, shadowW, shadowH, 0, 0, Math.PI * 2);
  ctx.fill();

  // All Danny artwork below is at the original 86px-tall scale — wrap in a
  // transform so the existing pixel offsets stay readable, but he renders
  // at character-scale.
  ctx.save();
  ctx.translate(x, m.y);
  ctx.scale(DANNY_SCALE, DANNY_SCALE);
  ctx.translate(-x, -m.y);

  // Body — light-blue shirt matching the player's uniform
  ctx.fillStyle = '#64b5f6';           // same soft blue as player shirt
  ctx.fillRect(x - 16, y - 28, 32, 44);
  // Black vest over the shirt (two panels, open-front)
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(x - 16, y - 28, 10, 44); // left panel
  ctx.fillRect(x + 6,  y - 28, 10, 44); // right panel
  // Vest collar V notch (clear it back to shirt colour)
  ctx.fillStyle = '#64b5f6';
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 28);
  ctx.lineTo(x,     y - 10);
  ctx.lineTo(x + 6, y - 28);
  ctx.fill();
  // Everclean "E" logo, yellow on chest (visible in the shirt gap)
  ctx.fillStyle = '#ffd54f';
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('E', x, y - 4);
  // Pants
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(x - 14, y + 16, 28, 20);
  // Head
  ctx.fillStyle = '#f3c8a0';
  ctx.beginPath(); ctx.arc(x, y - 38, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.fillRect(x - 12, y - 50, 24, 6); // hair
  // Eye
  ctx.fillStyle = '#000';
  if (m.facing === 'right') ctx.fillRect(x + 4, y - 40, 3, 3);
  else ctx.fillRect(x - 7, y - 40, 3, 3);
  // Friendly smile — Danny's a nice guy.
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(x, y - 34, 4, 0.1 * Math.PI, 0.9 * Math.PI);
  ctx.stroke();
  // Clipboard
  ctx.fillStyle = '#fff';
  ctx.fillRect(x + (m.facing === 'right' ? 10 : -22), y - 6, 12, 16);
  ctx.lineWidth = 1;
  ctx.strokeRect(x + (m.facing === 'right' ? 10 : -22), y - 6, 12, 16);
  // Nameplate
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(x - 28, y - 64, 56, 14);
  ctx.fillStyle = C_TEXT;
  ctx.font = 'bold 10px ui-monospace, monospace';
  ctx.fillText('DANNY', x, y - 53);
  // Three bump pips under the nameplate — fill red as you bump him.
  // Quick at-a-glance read of "how close am I to getting fired".
  const pipY = y - 71;
  for (let i = 0; i < 3; i++) {
    const px = x - 10 + i * 10;
    ctx.fillStyle = i < (m.bumpCount || 0) ? '#ef5350' : '#455a64';
    ctx.fillRect(px - 2, pipY, 4, 4);
  }
  ctx.restore();   // end Danny scale transform

  // Danny speech bubble — drawn at world scale, anchored above his (scaled) head
  if (m.speech && m.speech.life > 0) {
    const fade = Math.min(1, m.speech.life / 0.35);
    // y - 56 was the original anchor; multiply by scale so it sits above the
    // taller sprite. m.y is the foot anchor, head top is ~64*scale above it.
    const headTop = m.y - 64 * DANNY_SCALE;
    drawSpeechBubble(x, headTop, m.speech.text, m.speech.color || '#bbdefb', fade, 'down');
  }
}

function drawPlayer() {
  const p = state.player;
  const r = state.anim.sheetRect();
  // FIXED on-screen box size for every frame of every direction. The walk
  // sheet has rows of different tight heights (walk_up back-view is much
  // shorter than walk_right profile); using per-frame aspect would make the
  // character's rendered width jump 30%+ every time the player turned, which
  // reads as the body "spinning" or ballooning. Uniform box + bottom-anchored
  // source rects keeps feet on the ground line and proportions locked.
  const drawH = PLAYER_DRAW_H;
  const drawW = PLAYER_DRAW_W;
  let sprite;
  if (r) {
    if (r.sheet === 'walk') sprite = state.walkSprite;
    else if (r.sheet === 'main') sprite = state.sprite;
    else if (r.sheet === 'hose') sprite = state.hoseSprite;
    else if (r.sheet === 'backbrush') sprite = state.backbrushSprite;
    else if (r.sheet === 'scent_yellow') sprite = state.scentYellowSprite;
    else if (r.sheet === 'scent_red') sprite = state.scentRedSprite;
    else if (r.sheet === 'scent_purple') sprite = state.scentPurpleSprite;
  }
  // Ground shadow — soft ellipse at feet anchors the sprite to the floor.
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(Math.round(p.x), p.y - 4, 20, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  if (sprite && r) {
    // Snap to integer pixels so image-rendering:pixelated gives crisp output
    // instead of subpixel blur when the character is mid-stride.
    const dx = Math.round(p.x - drawW / 2);
    const dy = Math.round(p.y - drawH);
    if (r.flip) {
      ctx.save();
      ctx.translate(dx + drawW, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(sprite, r.sx, r.sy, r.sw, r.sh, 0, 0, drawW, drawH);
      ctx.restore();
    } else {
      ctx.drawImage(sprite, r.sx, r.sy, r.sw, r.sh, dx, dy, drawW, drawH);
    }
  } else {
    // Vector fallback if no sheets loaded. Use a LOCAL width here (do not
    // reassign drawW — it's const, and that throw would kill the rAF loop
    // before the start-screen Enter press could be handled).
    const fbW = 48;
    ctx.fillStyle = C_ACCENT;
    ctx.fillRect(p.x - fbW/2, p.y - drawH * 0.65, fbW, drawH * 0.45);
    ctx.fillStyle = C_PANTS;
    ctx.fillRect(p.x - fbW/2, p.y - drawH * 0.2, fbW, drawH * 0.2);
    ctx.fillStyle = '#f3c8a0';
    ctx.beginPath(); ctx.arc(p.x, p.y - drawH * 0.78, fbW * 0.32, 0, Math.PI * 2); ctx.fill();
  }

  // Tool overlay icon — tool hangs in the player's hand while walking/idle.
  // DURING an action we normally skip this (the tool + FX get drawn ON the
  // car by drawActionTool), EXCEPT for the hose: the hose is a long-range
  // sprayer, so it stays in the player's hand and the water stream arcs
  // from the nozzle to the front of the car. That way you can wash from
  // across the floor without the tool teleporting onto the vehicle.
  const inAction = state.actionTimer > 0 && state.actionType === state.currentTool;
  const toolStaysInHand = inAction && state.currentTool === 'hose';
  if (state.currentTool && r && (!inAction || toolStaysInHand)) {
    const iconH = TOOL_ICON_H[state.currentTool] || 28;
    const base = handOffset(p.facing, drawW, drawH, state.currentTool);
    const tx = p.x + base.x;
    const ty = p.y - drawH + base.y;
    drawToolIcon(state.currentTool, tx, ty, iconH);
  }

  // Player speech bubble — fades in the last 0.4s
  if (state.playerSpeech) {
    const s = state.playerSpeech;
    const fade = Math.min(1, s.life / 0.4);
    drawSpeechBubble(p.x, p.y - drawH - 4, s.text, s.color, fade);
  }
}

// How big each tool renders on the character. Hose reel + scrub brush are
// bulky real-world items; scent bottles are small hand-held sprayers.
const TOOL_ICON_H = {
  hose:         48,
  backbrush:    62,
  scent_yellow: 26,
  scent_red:    26,
  scent_purple: 26,
};

function handOffset(facing, dw, dh, tool) {
  // Scents are held higher (raised to spray); hose/brush hang lower in
  // the hand. y is measured from the TOP of the draw box, so a larger
  // y means lower on the body.
  const isSmall = tool && tool.startsWith('scent');
  const yFrac = isSmall ? 0.48 : 0.62;
  if (facing === 'right') return { x: dw *  0.42, y: dh * yFrac };
  if (facing === 'left')  return { x: dw * -0.42, y: dh * yFrac };
  if (facing === 'up')    return { x: dw *  0.22, y: dh * yFrac };
  return                       { x: dw *  0.32, y: dh * yFrac };
}

function drawParticles() {
  for (const pa of state.particles) {
    const a = Math.max(0, Math.min(1, pa.life / pa.max));
    ctx.fillStyle = pa.color;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(pa.x, pa.y, pa.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTipBills() {
  for (const b of state.tipBills) {
    const a = Math.max(0, Math.min(1, b.life / b.max));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    // Bill body
    ctx.fillStyle = '#43a047';
    ctx.fillRect(-12, -7, 24, 14);
    ctx.fillStyle = '#66bb6a';
    ctx.fillRect(-11, -6, 22, 12);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$' + b.amt, 0, 0);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawRain() {
  // Fade in based on transition (1 = freshly changed; 0 = settled)
  let alpha = 1;
  if (state.weather !== 'rainy') {
    if (state.prevWeather === 'rainy' && state.weatherTransition > 0) {
      alpha = state.weatherTransition;
    } else return;
  } else if (state.weatherTransition > 0) {
    alpha = 1 - state.weatherTransition;
  }
  ctx.save();
  ctx.globalAlpha = 0.45 * alpha;
  ctx.strokeStyle = '#b3e5fc';
  ctx.lineWidth = 1;
  for (const d of state.rainDrops) {
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - 3, d.y + d.len);
    ctx.stroke();
  }
  ctx.restore();
}

function drawWeatherTint() {
  // Light overall color cast for cloudy/rainy.
  let tint = null;
  if (state.weather === 'cloudy') tint = 'rgba(60,80,100,0.12)';
  else if (state.weather === 'rainy') tint = 'rgba(40,55,80,0.22)';
  if (tint) {
    ctx.fillStyle = tint;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

function drawPhoneModal() {
  if (!state.phoneOpen || !state.phoneMsg) return;
  // Dark scrim
  ctx.fillStyle = 'rgba(6,14,26,0.78)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // Phone body
  const pw = 320, ph = 480;
  const px = VIEW_W / 2 - pw / 2;
  const py = VIEW_H / 2 - ph / 2;
  ctx.fillStyle = '#1a1a1a';
  roundRect(px, py, pw, ph, 28, true, false);
  ctx.fillStyle = '#0d1b2a';
  roundRect(px + 10, py + 50, pw - 20, ph - 100, 6, true, false);
  // Notch
  ctx.fillStyle = '#000';
  roundRect(px + pw / 2 - 40, py + 8, 80, 18, 8, true, false);
  // Header bar
  ctx.fillStyle = '#90caf9';
  ctx.font = 'bold 14px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('iMessage', px + 22, py + 76);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px ui-monospace, monospace';
  ctx.fillText(state.phoneMsg.from, px + 22, py + 102);
  // Bubble
  const bw = pw - 60;
  ctx.fillStyle = '#37474f';
  roundRect(px + 22, py + 130, bw, 140, 14, true, false);
  ctx.fillStyle = '#fff';
  ctx.font = '15px ui-monospace, monospace';
  // word-wrap text
  const words = state.phoneMsg.text.split(' ');
  let line = '', y = py + 158;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > bw - 20) {
      ctx.fillText(line, px + 32, y);
      line = w;
      y += 22;
    } else line = test;
  }
  if (line) ctx.fillText(line, px + 32, y);
  // Footer
  ctx.fillStyle = '#69f0ae';
  ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('+5 ENERGY', VIEW_W / 2, py + ph - 80);
  ctx.fillStyle = '#cfd8dc';
  ctx.font = '13px ui-monospace, monospace';
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 380);
  ctx.globalAlpha = 0.5 + 0.5 * pulse;
  ctx.fillText(IS_TOUCH ? 'Tap [P] / [A] / [II] to close' : '[P / E / ESC] close',
               VIEW_W / 2, py + ph - 56);
  ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
  for (const t of state.floatingTexts) {
    const a = Math.max(0, Math.min(1, t.life / t.max));
    const sc = t.scale || 1;
    ctx.save();
    ctx.globalAlpha = a;
    if (sc !== 1) {
      ctx.translate(t.x, t.y);
      ctx.scale(sc, sc);
      ctx.translate(-t.x, -t.y);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.font = 'bold 16px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

/* ----------- TOP BAR / UI ----------- */
const HUD_AUDIO_BTNS = { music: { x: 0, y: 0, w: 0, h: 0 }, sfx: { x: 0, y: 0, w: 0, h: 0 } };
function stageScale() {
  const r = document.getElementById('stage').getBoundingClientRect();
  return Math.min(r.width / VIEW_W, r.height / VIEW_H) || 1;
}
function touchStripOffset() {
  return IS_TOUCH ? 112 / stageScale() : 0;
}
function drawTopBar() {
  // Bar background
  ctx.fillStyle = C_UI_BG;
  ctx.fillRect(0, 0, VIEW_W, 44);
  ctx.fillStyle = '#10243a';
  ctx.fillRect(0, 44, VIEW_W, 2);

  let x = 16;
  // Energy
  ctx.fillStyle = C_TEXT;
  ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('💧', x, 28);
  x += 22;
  const eW = 160, eH = 16;
  // Pulsing danger glow behind the bar when water is critically low.
  if (state.energy < 25) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 140);
    ctx.fillStyle = `rgba(239,83,80,${0.25 * pulse})`;
    ctx.fillRect(x - 3, 11, eW + 6, eH + 6);
  }
  ctx.fillStyle = '#0a1825';
  ctx.fillRect(x, 14, eW, eH);
  let eCol = C_ACCENT;
  if (state.energyDisplay < 40) eCol = '#ffb74d';
  if (state.energyDisplay < 20) eCol = '#ef5350';
  const barW = (eW - 2) * (state.energyDisplay / ENERGY_MAX);
  ctx.fillStyle = eCol;
  ctx.fillRect(x + 1, 15, barW, eH - 2);
  // Animated sheen traveling across the bar — gives it a liquid feel
  if (barW > 8) {
    const sheenPos = ((performance.now() / 800) % 1) * barW;
    const sg = ctx.createLinearGradient(x + 1 + sheenPos - 12, 0, x + 1 + sheenPos + 12, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.18)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(x + 1, 15, barW, eH - 2);
  }
  ctx.strokeStyle = state.energy < 25 ? '#ef5350' : '#1e3850';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, 14, eW, eH);
  x += eW + 18;

  // Tips / score
  const metQuota = state.quota && state.tips >= state.quota;
  const tipSize = Math.round(18 + (state.tipPop || 0) * 22);
  ctx.fillStyle = metQuota ? '#69f0ae' : '#fff59d';
  ctx.font = `bold ${tipSize}px ui-monospace, monospace`;
  ctx.fillText('$' + state.tips, x, 29);
  const tipW = ctx.measureText('$' + state.tips).width;
  if (state.quota) {
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.fillStyle = '#90a4ae';
    ctx.fillText('/ $' + state.quota, x + tipW + 6, 28);
    const qr = Math.min(1, state.tips / state.quota);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, 35, 116, 3);
    ctx.fillStyle = metQuota ? '#69f0ae' : '#ffd54f';
    ctx.fillRect(x, 35, 116 * qr, 3);
  }
  x += 140;

  // Served / lost
  ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillStyle = '#90caf9';
  ctx.fillText('✓' + state.carsServed, x, 28); x += 60;
  ctx.fillStyle = '#ef9a9a';
  ctx.fillText('✗' + state.carsLost, x, 28); x += 64;

  // Difficulty level
  ctx.fillStyle = '#ffe082';
  ctx.fillText('DAY ' + (state.day || 1), x, 28); x += 80;

  // ── Game timer — center stage ──────────────────────────────────────────
  const secs = Math.ceil(state.gameTimer);
  const timerStr = secs + 's';
  const timerLow = state.gameTimer < 15;
  const timerPulse = timerLow ? 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 120)) : 1;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `bold ${timerLow ? 22 : 18}px ui-monospace, monospace`;
  ctx.fillStyle = timerLow ? `rgba(239,83,80,${timerPulse})` : C_ACCENT;
  ctx.fillText('⏱ ' + timerStr, VIEW_W / 2, 28);
  ctx.restore();

  // ── RIGHT SIDE (right-aligned, working inward from VIEW_W) ─────────────
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px ui-monospace, monospace';

  // Current tool — far right. Width varies a lot ("[BACKBRUSH]" is 93px,
  // "[BUG SPRAY HOSE]" is 135px) so measure and decrement dynamically with
  // a 14px gap so it never collides with the next slot.
  // Audio toggles (in-canvas so they scale with the game). On touch the
  // DOM pause/help strip covers the top-right corner, so shift left of it.
  let rx = VIEW_W - 12 - touchStripOffset();
  const ui = window.__audioUI;
  const btnS = 30;
  for (const [key, label, on] of [
    ['sfx', ui && ui.sfxOn() ? '🔊' : '🔇', ui ? ui.sfxOn() : true],
    ['music', ui && ui.musicPlaying() ? '♪' : '♪̸', ui ? ui.musicPlaying() : true],
  ]) {
    const b = HUD_AUDIO_BTNS[key];
    b.x = rx - btnS; b.y = 7; b.w = btnS; b.h = btnS;
    ctx.fillStyle = 'rgba(13,27,42,0.9)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = on ? 'rgba(144,202,249,0.7)' : 'rgba(84,110,122,0.6)';
    ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.save(); ctx.textAlign = 'center';
    ctx.font = 'bold 16px ui-monospace, monospace';
    ctx.fillStyle = on ? '#90caf9' : '#546e7a';
    ctx.globalAlpha = on ? 1 : 0.7;
    ctx.fillText(key === 'music' ? '♪' : label, b.x + b.w / 2, b.y + 21);
    if (!on && key === 'music') { ctx.strokeStyle = '#ef9a9a'; ctx.beginPath(); ctx.moveTo(b.x + 7, b.y + b.h - 7); ctx.lineTo(b.x + b.w - 7, b.y + 7); ctx.stroke(); }
    ctx.restore();
    const inGame = !state.startScreen && !state.gameOver && !state.paused && !state.phoneOpen && !state.shiftOver && ui;
    if (inGame) addButton(b.x, b.y, b.w, b.h, key === 'music' ? ui.toggleMusic : ui.toggleSfx);
    rx -= btnS + 6;
  }
  rx -= 8;
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px ui-monospace, monospace';

  const tool = state.currentTool;
  let toolText;
  if (tool) {
    toolText = '[' + (TOOL_NAMES[tool] || tool.toUpperCase()) + ']';
    ctx.fillStyle = C_ACCENT;
  } else {
    toolText = '(no tool)';
    ctx.fillStyle = '#607D8B';
  }
  ctx.fillText(toolText, rx, 28);
  rx -= ctx.measureText(toolText).width + 14;

  // High score
  ctx.font = 'bold 14px ui-monospace, monospace';
  ctx.fillStyle = '#ffd54f';
  const bestText = 'BEST $' + state.highScore;
  ctx.fillText(bestText, rx, 28); rx -= ctx.measureText(bestText).width + 16;

  // Weather icon
  let wIcon = '☀', wCol = '#ffd54f';
  if (state.weather === 'cloudy') { wIcon = '☁'; wCol = '#b0bec5'; }
  else if (state.weather === 'rainy') { wIcon = '🌧'; wCol = '#81d4fa'; }
  ctx.fillStyle = wCol;
  ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillText(wIcon, rx, 30); rx -= 30;

  // Phone notification pill (flashing, right-aligned before stocks)
  if (state.phoneMsg && !state.phoneOpen) {
    const flash = 0.5 + 0.5 * Math.sin(performance.now() / 220);
    ctx.fillStyle = `rgba(129,212,250,${0.7 + 0.3 * flash})`;
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.fillText('📱(P)', rx, 28); rx -= 54;
  }

  // Reputation stars — scale every tip (see repMult)
  const stars = Math.round(state.rep / 20);
  ctx.font = 'bold 15px ui-monospace, monospace';
  ctx.fillStyle = state.rep < 30 ? '#ef9a9a' : '#ffd54f';
  ctx.fillText('★'.repeat(stars) + '☆'.repeat(5 - stars), rx, 28);
  rx -= ctx.measureText('★★★★★').width + 6;
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.fillStyle = '#90a4ae';
  ctx.fillText('REP', rx, 27);
}

function drawPauseOverlay() {
  // Show the splash screen art as the pause backdrop — same visual as the
  // title screen so it feels intentional, not just a grey overlay.
  ctx.fillStyle = C_UI_BG;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const img = state.splashImage;
  if (img && img.complete && img.naturalWidth > 0) {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.min(VIEW_W / iw, VIEW_H / ih);
    const dw = iw * scale, dh = ih * scale;
    const dx = (VIEW_W - dw) / 2, dy = (VIEW_H - dh) / 2;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  // Slight dark veil so the "PAUSED" badge reads clearly
  ctx.fillStyle = 'rgba(6,18,29,0.52)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // Pulsing "PAUSED" badge

  ctx.fillText('PAUSED', VIEW_W / 2, 100);

  // Resume prompt — same style as the start-screen prompt

  ctx.globalAlpha = 0.4 + pulse * 0.55;

  ctx.fillStyle = '#fff59d';
  ctx.beginPath();
  ctx.arc(VIEW_W / 2 + 220, VIEW_H / 2 - 80, 30, 0, Math.PI * 2);

  ctx.fillRect(VIEW_W / 2 + 215, VIEW_H / 2 - 60, 10, 100);
  // Player sit pose: reuse current sprite, sitting position.
  // Save/restore so we don't corrupt the world-space player position —
  // when the player exits the break room, updatePlayer resets to the door,
  // but we still shouldn't be mutating simulation state from a draw call.
  const p = state.player;

  p.y = VIEW_H / 2 + 60;
  drawPlayer();
  p.x = savedX; p.y = savedY;

  // Granola bar in the player's hand — pixel art snack that tags the
  // "I'm on break" vibe. Yellow oat body + foil wrapper at the ends +
  // chocolate-chip specks. Sits to the player's right while they munch.
  {
    const gx = VIEW_W / 2 + 42;
    const gy = VIEW_H / 2 + 48;
    // Foil wrapper ends
    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(gx - 22, gy - 5, 6, 14);
    ctx.fillRect(gx + 16, gy - 5, 6, 14);
    // Oat bar body
    ctx.fillStyle = '#ffe082';
    ctx.fillRect(gx - 16, gy - 4, 32, 12);
    ctx.fillStyle = '#ffca28';
    ctx.fillRect(gx - 16, gy + 6, 32, 2);
    // Oat / chocolate specks
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(gx - 11, gy - 1, 3, 2);
    ctx.fillRect(gx -  3, gy + 2, 3, 2);
    ctx.fillRect(gx +  5, gy    , 3, 2);
    ctx.fillRect(gx + 10, gy + 3, 2, 2);
    ctx.fillStyle = '#a1887f';
    ctx.fillRect(gx -  7, gy + 3, 2, 2);
    ctx.fillRect(gx +  1, gy - 2, 2, 2);
    // Tiny label strip
    ctx.fillStyle = '#6d4c41';
    ctx.font = 'bold 8px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GRANOLA', gx, gy + 22);
  }

  // Drifting music notes — rendered on top of the overlay so they read
  // clearly over the dimmed background.
  for (const n of (state.breakNotes || [])) {
    const a = Math.max(0, Math.min(1, n.life / n.max));
    ctx.globalAlpha = a;
    // Soft dark shadow for readability.
    ctx.fillStyle = '#1a237e';
    ctx.font = 'bold 32px "Apple Color Emoji", "Segoe UI Symbol", ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(n.text, n.x + 2, n.y + 2);
    ctx.fillStyle = '#ce93d8';
    ctx.fillText(n.text, n.x, n.y);
  }
  ctx.globalAlpha = 1;
  // Title
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('BREAK ROOM', VIEW_W / 2, 110);
  ctx.font = '20px ui-monospace, monospace';
  ctx.fillStyle = C_ACCENT;
  ctx.fillText('SPAM [E] to chomp granola — +12 energy per bite', VIEW_W / 2, 160);
  ctx.fillStyle = '#90a4ae';
  ctx.fillText('Press [Q] to head back to the floor', VIEW_W / 2, 188);
  // Energy bar
  const eW = 400, eH = 24;
  const ex = VIEW_W / 2 - eW / 2, ey = 220;
  ctx.fillStyle = '#0a1825';
  ctx.fillRect(ex, ey, eW, eH);
  ctx.fillStyle = C_ACCENT;
  ctx.fillRect(ex + 2, ey + 2, (eW - 4) * (state.energy / ENERGY_MAX), eH - 4);
  ctx.strokeStyle = '#1e3850';
  ctx.strokeRect(ex, ey, eW, eH);
}



function drawStartScreen() {
  ctx.fillStyle = C_UI_BG;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const img = state.splashImage;
  if (img && img.complete && img.naturalWidth > 0) {
    // Letterbox the splash into the canvas. contain-fit: preserve aspect,
    // fill width OR height — whichever is the tighter constraint — and
    // center the result. No distortion, no cropping.
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.min(VIEW_W / iw, VIEW_H / ih);
    const dw = iw * scale, dh = ih * scale;
    const dx = (VIEW_W - dw) / 2, dy = (VIEW_H - dh) / 2;
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false; // keep pixel-art edges crisp
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.imageSmoothingEnabled = prev;

    drawTitleMenu();
    return;
  }

  // Splash still loading: show a plain backdrop so the text card never flashes first.
  if (!state.splashFailed) return;
  // Fallback: splash failed to load — text-only title card.
  ctx.textAlign = 'center';
  ctx.fillStyle = C_ACCENT;
  ctx.font = 'bold 88px ui-monospace, monospace';
  ctx.fillText("YASA'S EVERCLEAN", VIEW_W / 2, 220);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px ui-monospace, monospace';
  ctx.fillText('Carwash Simulator', VIEW_W / 2, 270);

  drawTitleMenu();
}
