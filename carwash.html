// Draw a pixel-art-ish speech bubble at (ax, ay). `dir` controls tail direction:
//   'down' (default): tail points down, bubble sits above (ax, ay)
//   'left':  tail points left, bubble sits to the right of (ax, ay)
//   'right': tail points right, bubble sits to the left of (ax, ay)
function drawSpeechBubble(ax, ay, text, color = '#ffffff', alpha = 1, dir = 'down') {
  if (!text) return;
  ctx.save();
  ctx.font = 'bold 13px ui-monospace, monospace';
  const pad = 8;
  const tw = ctx.measureText(text).width;
  const w = Math.max(40, tw + pad * 2);
  const h = 24;
  let bx, by;
  if (dir === 'down') { bx = ax - w / 2;       by = ay - h - 10; }
  else if (dir === 'left')  { bx = ax + 10;    by = ay - h / 2; }
  else /* right */          { bx = ax - w - 10; by = ay - h / 2; }
  // Clamp inside viewport
  bx = Math.max(6, Math.min(VIEW_W - w - 6, bx));
  by = Math.max(50, Math.min(VIEW_H - h - 6, by));
  // Shadow
  ctx.fillStyle = `rgba(0,0,0,${0.35 * alpha})`;
  ctx.fillRect(bx + 2, by + 2, w, h);
  // Body
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.fillRect(bx, by, w, h);
  // Border
  ctx.strokeStyle = `rgba(30,40,60,${alpha})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, w, h);
  // Tail
  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.beginPath();
  if (dir === 'down') {
    const tx = Math.max(bx + 8, Math.min(bx + w - 8, ax));
    ctx.moveTo(tx - 5, by + h);
    ctx.lineTo(tx + 5, by + h);
    ctx.lineTo(tx, by + h + 8);
  } else if (dir === 'left') {
    const ty = Math.max(by + 6, Math.min(by + h - 6, ay));
    ctx.moveTo(bx,     ty - 5);
    ctx.lineTo(bx,     ty + 5);
    ctx.lineTo(bx - 8, ty);
  } else {
    const ty = Math.max(by + 6, Math.min(by + h - 6, ay));
    ctx.moveTo(bx + w,     ty - 5);
    ctx.lineTo(bx + w,     ty + 5);
    ctx.lineTo(bx + w + 8, ty);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = `rgba(30,40,60,${alpha})`;
  ctx.stroke();
  // Text
  ctx.fillStyle = `rgba(20,30,50,${alpha})`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + w / 2, by + h / 2);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

// Particles only advance while the sim runs; spawning while frozen piles them up.
function simFrozen() { return state.paused || state.gameOver || !!state.shiftOver || state.shiftIntro > 0 || state.startScreen; }
function emitParticles(x, y, color, n, opts = {}) {
  if (simFrozen()) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (opts.speed || 60) * (0.4 + Math.random());
    state.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - (opts.lift || 0),
      life: (opts.life || 0.6) * (0.5 + Math.random()),
      max: (opts.life || 0.6),
      color,
      size: (opts.size || 3) + Math.random() * 2,
      g: opts.g === undefined ? 80 : opts.g,
    });
  }
}

function getDifficulty() {
  // Each new day starts harder; serving cars ramps it within the shift.
  return Math.min(10, Math.min(6, (state.day || 1) - 1) + Math.floor(state.carsServed / 3));
}

function canSpawnCar() {
  if (state.cars.some(c => c.state === 'arriving' || c.state === 'loading')) return false;
  // Don't drive in head-on with a car backing out of the staging spot
  if (state.cars.some(c => c.state === 'leaving_angry' && c.exitLeft)) return false;
  const moving = state.cars.filter(c => c.state === 'moving');
  if (moving.length >= maxCarsOnLane()) return false;
  return moving.every(c => c.x - c.w / 2 > CAR_STAGING_X + 190);
}

function spawnCarIfPossible() {
  if (!canSpawnCar()) return;
  state.cars.push(makeCar());
}

/* ============================================================================
   PLAYER — movement, animation routing, pickups, actions
============================================================================ */
function updatePlayer(dt) {
  const p = state.player;
  // Phone modal blocks all gameplay input (similar to tutorial).
  if (state.phoneOpen) {
    p.moving = false;
    state.anim.play('idle_down');
    if (consumeEdge('p') || consumeEdge('escape') || consumeEdge('e') || consumeEdge('enter')) {
      state.phoneOpen = false;
      state.phoneMsg = null;
      state.phoneIgnoredTimer = 0;
      state.energy = Math.min(ENERGY_MAX, state.energy + 5);
      AudioKit.uiSelect();
    }
    return;
  }
  if (state.actionTimer > 0) {
    // During an action we DON'T lock movement — instead, the player quickly
    // walks over to the correct spot on the car (front/back/window) and then
    // tracks it. If they're already there, movement is zero.
    const acar = state.actionCar;
    if (acar && acar.state === 'moving') {
      const off = actionTargetOffset(state.actionType);
      const tx = Math.max(24, Math.min(VIEW_W - 24, acar.x + off.x));
      const ty = Math.max(FLOOR_MIN_Y, Math.min(FLOOR_MAX_Y, acar.y - 55));
      const ddx = tx - p.x, ddy = ty - p.y;
      const dist = Math.hypot(ddx, ddy);
      const RUN_SPEED = 900;   // snappy dash so far distances feel intentional
      if (dist > 2) {
        const step = Math.min(dist, RUN_SPEED * dt);
        p.x += (ddx / dist) * step;
        p.y += (ddy / dist) * step;
        p.moving = true;
        // Face the direction we're running so the walk animation reads right
        if (Math.abs(ddx) >= Math.abs(ddy)) p.facing = ddx > 0 ? 'right' : 'left';
        else p.facing = ddy > 0 ? 'down' : 'up';
      } else {
        p.moving = false;
        p.facing = 'down';
      }
    }
    if (state.actionType === 'hose') {
      state.hoseLoopTimer -= dt;
      if (state.hoseLoopTimer <= 0) { AudioKit.hoseLoop(); state.hoseLoopTimer = 0.15; }
    } else if (state.actionType === 'backbrush') {
      state.brushLoopTimer -= dt;
      if (state.brushLoopTimer <= 0) { AudioKit.brushLoop(); state.brushLoopTimer = 0.12; }
    }
    state.actionTimer -= dt;
    if (state.actionTimer <= 0) finishAction();
    // While running over to the action spot, use the normal walk animation so
    // it actually reads as running. Only switch to the tool-specific action
    // pose once we've arrived at the target.
    if (p.moving) routeAnim();
    else routeIdleOrActionAnim();
    return;
  }
  if (state.inBreakRoom) {
    p.moving = false;
    state.anim.play('break_sit');

    // Spam E to chomp granola bar — each press = +12 energy + a music note + chime
    if (!state.breakNotes) state.breakNotes = [];
    state.breakTimer = (state.breakTimer || 0) + dt;

    if (consumeEdge('e')) {
      if (state.energy < ENERGY_MAX) {
        state.energy = Math.min(ENERGY_MAX, state.energy + 12);
        AudioKit.energyRefill();
        const glyphs = ['\u266A', '\u266B', '\u266C'];
        state.breakNotes.push({
          text: glyphs[Math.floor(Math.random() * glyphs.length)],
          x: VIEW_W / 2 + (Math.random() - 0.5) * 100,
          y: VIEW_H / 2 - 20,
          vx: (Math.random() - 0.5) * 50,
          vy: -55 - Math.random() * 25,
          life: 2.0, max: 2.0,
        });
        if (state.energy >= ENERGY_MAX) {
          AudioKit.loadComplete();   // little fanfare on max
        }
      } else {
        AudioKit.uiDeny();           // already maxed
      }
    }

    // Q (or ESC) to leave the break room manually
    if (consumeEdge('q')) {
      state.inBreakRoom = false;
      state.breakNotes = [];
      AudioKit.breakRoomExit();
      AudioKit.breakDoorOpen();
      setTimeout(() => AudioKit.breakDoorClose(), 350);
      p.x = BREAK_ROOM_DOOR_X - 40;
      p.y = FLOOR_MIN_Y + 80;
      if (state.manager) state.manager.bumpContact = true;
      return;
    }

    for (const n of state.breakNotes) {
      n.life -= dt;
      n.x += n.vx * dt;
      n.y += n.vy * dt;
    }
    state.breakNotes = state.breakNotes.filter(n => n.life > 0);

    // Reset energyLow warning once refilled past 25
    if (state.energy > 25) state.energyLowWarned = false;
    state.energyRefillTimer = 0;
    return;
  }

  let dx = 0, dy = 0;
  if (state.keys['w'] || state.keys['arrowup']) dy -= 1;
  if (state.keys['s'] || state.keys['arrowdown']) dy += 1;
  if (state.keys['a'] || state.keys['arrowleft']) dx -= 1;
  if (state.keys['d'] || state.keys['arrowright']) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    const spd = playerSpeed();
    p.x += dx * spd * dt;
    p.y += dy * spd * dt;
    p.moving = true;
    // Facing with a small dead-zone: on near-perfect diagonals |dx|≈|dy|,
    // tiny FP jitter would otherwise flip facing every frame and the walk
    // cycle would appear to "spin" between walk_right and walk_down. Require
    // a clear lead (>10%) before we change the dominant axis; otherwise keep
    // the prior facing so diagonals commit to one animation.
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (adx > ady * 1.1) p.facing = dx > 0 ? 'right' : 'left';
    else if (ady > adx * 1.1) p.facing = dy > 0 ? 'down' : 'up';
    // else keep p.facing unchanged
  } else {
    p.moving = false;
  }

  // Footstep sound — throttled every 0.22s while moving
  if (p.moving) {
    state.footstepTimer -= dt;
    if (state.footstepTimer <= 0) {
      AudioKit.footstep();
      state.footstepTimer = 0.22;
      emitParticles(p.x + (Math.random() - 0.5) * 16, p.y - 2, '#b0bec5', 2,
        { speed: 22, life: 0.35, size: 2, g: -25 });
    }
  } else {
    state.footstepTimer = 0;
  }

  // Clamp to playfield — walkable floor between the counter (top) and the
  // road/parking bays (bottom). y bounds are tuned to the painted bg.png
  // so the player never clips through tools or off the asphalt edge.
  const margin = 24;
  p.x = Math.max(margin, Math.min(VIEW_W - margin, p.x));
  p.y = Math.max(FLOOR_MIN_Y, Math.min(FLOOR_MAX_Y, p.y));

  routeAnim();

  // F outside break room: spam to load a car into its bay
  // E handles both loading and all other interactions (priority: load > pickup > car)
  if (consumeEdge('e')) {
    const atSpot = stationInReach() || within(p, BREAK_ROOM_DOOR_X, BREAK_ROOM_DOOR_Y, 70);
    if (atSpot || !tryLoadCar()) tryInteract();
  }
  // P opens the phone if there's an unread message
  if (consumeEdge('p') && state.phoneMsg) {
    state.phoneOpen = true;
    AudioKit.uiSelect();
  }
}

function routeAnim() {
  const p = state.player;
  if (p.moving) {
    state.anim.play('walk_' + p.facing);
  } else {
    state.anim.play('idle_' + p.facing);
  }
}

function routeIdleOrActionAnim() {
  // During an action the *body* animates via the walk sheet (locked size,
  // no skinny-body regression), and the *tool icon* does the tool-specific
  // motion in drawPlayer (pump/sweep/squeeze). Picking walk_* here gives
  // the body a natural arm+leg cycle that reads as "working" — a static
  // pose looks dead. Facing is already set at action-start in tryInteract,
  // so the character is oriented toward the car.
  const t = state.actionType;
  const f = state.player.facing;
  if (t === 'backbrush') {
    // Scrub: full walk cycle → arm swing drives the brush sweep.
    state.anim.play('walk_' + f);
  } else if (t === 'hose') {
    // Hose: subtle aim-hold; walk cycle gives a slight body sway.
    state.anim.play('walk_' + f);
  } else if (t && t.startsWith('scent_')) {
    // Spray: near-still; walk cycle still reads as pump-work.
    state.anim.play('walk_' + f);
  } else {
    state.anim.play('idle_' + f);
  }
}

function tryInteract() {
  const p = state.player;
  // Break-room door — painted into bg.png on the right side of the counter.
  // Tight radius: must be right at the door, matches the [E] hover range.
  if (within(p, BREAK_ROOM_DOOR_X, BREAK_ROOM_DOOR_Y, 70)) {
    enterBreakRoom();
    return;
  }
  // Tool stations — pickup requires HUGGING the wall (player close to the
  // top of the walkable area) AND being directly under the tool. This
  // keeps the mid-floor free for tool work without accidentally swapping.
  {
    const s = stationInReach();
    if (s) {
      state.currentTool = s.id;
      state.pickupStation = s.id;
      state.player.pop = 0.22;
      AudioKit.pickupSound();
      addFloating(TOOL_NAMES[s.id], p.x, p.y - 170, s.color || C_ACCENT, 0.9);
      return;
    }
  }
  // Car interaction.
  //
  // Hose is special: it's a long-range sprayer, so pressing E with the
  // hose equipped targets the nearest waiting car regardless of distance.
  // Brushes and scent bottles still require getting up close (110px).
  if (state.currentTool === 'hose') {
    let best = null, bestD2 = Infinity;
    for (const car of state.cars) {
      if (car.state !== 'moving') continue;
      const d2 = dist2(p.x, p.y, car.x, car.y);
      if (d2 < bestD2) { bestD2 = d2; best = car; }
    }
    if (best) {
      const dxc = best.x - p.x, dyc = best.y - p.y;
      if (Math.abs(dyc) >= Math.abs(dxc)) p.facing = dyc > 0 ? 'down' : 'up';
      else p.facing = dxc > 0 ? 'right' : 'left';
      state.actionTimer = actionDuration();
      state.actionType = 'hose';
      state.actionCar = best;
      AudioKit.water();
      return;
    }
    addFloating("no car to spray", p.x, p.y - 170, '#ffb74d', 0.9);
    AudioKit.uiDeny();
    return;
  }
  const inReach = state.cars
    .filter(c => c.state === 'moving' && within(p, c.x, c.y, CAR_ACTION_RADIUS))
    .sort((a, b) => dist2(p.x, p.y, a.x, a.y) - dist2(p.x, p.y, b.x, b.y));
  for (const car of inReach) {
    {
      if (!state.currentTool) {
        addFloating("need a tool!", p.x, p.y - 170, '#ffb74d', 0.9);
        AudioKit.uiDeny();
        return;
      }
      // Player dashes to the correct spot on the car during the action:
      //   hose → front / hood, backbrush → rear / trunk, scent_* → driver window.
      // The walk-to happens inside updatePlayer while actionTimer > 0, so no
      // teleport — the player visibly runs there, then settles and works.
      const dxc2 = car.x - p.x, dyc2 = car.y - p.y;
      if (Math.abs(dyc2) >= Math.abs(dxc2)) p.facing = dyc2 > 0 ? 'down' : 'up';
      else p.facing = dxc2 > 0 ? 'right' : 'left';
      // Start action
      state.actionTimer = actionDuration();
      state.actionType = state.currentTool;
      state.actionCar = car;
      // Start tool SFX
      if (state.currentTool === 'backbrush') AudioKit.squeak();
      else AudioKit.spray();
      return;
    }
  }
}

function finishAction() {
  const car = state.actionCar;
  const tool = state.actionType;
  state.actionType = null;
  state.actionTimer = 0;
  state.actionCar = null;
  if (!car || car.state !== 'moving') return;
  applyToolToCar(car, tool);
  // Drop the tool after applying — feels natural and frees the bar
  // (per spec: E to pick up/drop, applying counts as use)
  // We keep the tool in hand so player can move to next car if it matches.
  // But for satisfying flow, only drop scent tools after use:
  if (tool && tool.startsWith('scent_')) {
    state.currentTool = null;
    AudioKit.putdown();
  }
}

function applyToolToCar(car, tool) {
  // Bird splat: backbrush on a splatted car cleans it instead of advancing sequence.
  if (car.birdSplat && tool === 'backbrush') {
    car.birdSplatProgress = Math.max(0, car.birdSplatProgress - 0.55);
    AudioKit.brushLoop();
    emitParticles(car.x, car.y - car.h / 2 - 6, '#ffffff', 8,
      { speed: 60, life: 0.5, size: 2, g: 30 });
    if (car.birdSplatProgress <= 0) {
      car.birdSplat = false;
      addFloating("SPLAT CLEARED!", car.x, car.y - 90, '#69f0ae', 1.2);
      sayCar(car, "thank you 😩", 1.4, '#c8e6c9');
    }
    return;
  }
  const expected = car.sequence[car.progress];
  if (expected === tool) {
    car.progress++;
    car.popIdx = car.progress - 1;
    car.popT = 0.35;
    car.squash = 0.25;
    car.dirt = Math.max(0, 1 - car.progress / car.sequence.length);
    // Track highest-rarity scent applied so far — drives the tip multiplier.
    const r = TOOL_RARITY[tool];
    if (r) {
      const cur = car.topRarity;
      if (!cur || RARITY_ORDER[r] > RARITY_ORDER[cur]) car.topRarity = r;
    }
    spawnSuccessParticles(car, tool);
    // Correct tool sound — scent gets special sizzle, others get bwip
    if (car.progress < car.sequence.length) {
      if (tool === 'scent_yellow') AudioKit.scentLemon();
      else if (tool === 'scent_red') AudioKit.scentBlackIce();
      else if (tool === 'scent_purple') AudioKit.scentMystery();
      else AudioKit.actionSuccess();
    }
    // Occasional happy reactions on correct tool
    if (Math.random() < 0.45) {
      if (tool === 'hose') sayCar(car, pickLine(CAR_LINES.happyHose), 1.4, '#b3e5fc');
      else if (tool === 'backbrush') sayCar(car, pickLine(CAR_LINES.happyBrush), 1.4, '#c8e6c9');
    }
    if (car.progress >= car.sequence.length) completeCar(car);
  } else {
    car.satisfaction -= 18;
    car.perfectSoFar = false;
    car.wrongT = 0.35;
    state.flash = { r: 239, g: 83, b: 80, a: 0.18 };
    state.shake = 0.35;
    AudioKit.negBuzz();
    AudioKit.dirtPuff();
    const expectedName = TOOL_NAMES[expected] || expected.toUpperCase();
    addFloating("WRONG! needs " + expectedName, car.x, car.y - 60, '#ef5350', 1.4);
    state.anim.play('mistake');
    sayCar(car, pickLine(CAR_LINES.grump), 1.4, '#ffcdd2');
    if (car.satisfaction <= 0) loseCar(car);
  }
}

function spawnSuccessParticles(car, tool) {
  if (tool === 'hose') {
    emitParticles(car.x, car.y - 5, C_WATER, 14, { speed: 90, life: 0.7, size: 2, g: 200 });
    emitParticles(car.x, car.y - 5, '#ffffff', 8, { speed: 60, life: 0.6, size: 2, g: 60 });
  } else if (tool === 'backbrush') {
    emitParticles(car.x, car.y - 10, '#ffffff', 14, { speed: 70, life: 0.8, size: 3, g: 30 });
    emitParticles(car.x, car.y - 5, '#5d4037', 6, { speed: 60, life: 0.5, size: 2, g: 100 });
  } else if (tool === 'scent_yellow') {
    // LEMON — bright citrus puff.
    emitParticles(car.x, car.y - 30, '#fdd835', 18, { speed: 80, life: 0.9, size: 3, g: 0 });
    emitParticles(car.x, car.y - 28, '#fff59d', 8,  { speed: 60, life: 0.7, size: 2, g: -10 });
  } else if (tool === 'scent_red') {
    // BLACK ICE — hot red burst + orange embers.
    emitParticles(car.x, car.y - 30, '#e53935', 16, { speed: 80, life: 0.9, size: 3, g: 0 });
    emitParticles(car.x, car.y - 28, '#ff8a65', 10, { speed: 70, life: 0.8, size: 2, g: -30 });
    emitParticles(car.x, car.y - 26, '#ffeb3b', 6,  { speed: 60, life: 0.6, size: 2, g: -10 });
  } else if (tool === 'scent_purple') {
    // MYSTERY — rare, double-layered mist with gold sparkle accents.
    emitParticles(car.x, car.y - 30, '#ba68c8', 18, { speed: 80, life: 1.0, size: 3, g: 0 });
    emitParticles(car.x, car.y - 32, '#f8bbd0', 10, { speed: 60, life: 0.9, size: 2, g: -15 });
    emitParticles(car.x, car.y - 35, '#fff59d', 8,  { speed: 90, life: 0.8, size: 2, g: -40 });
  }
}

function completeCar(car, _perfectOverride) {
  // Bird splat still present at completion → tip penalty + rep hit + combo break
  if (car.birdSplat) {
    car.perfectSoFar = false;
    state.rep = Math.max(0, state.rep - 3);
    sayCar(car, "you missed the splat!", 1.8, '#ffcdd2');
    breakCombo('birdsplat');
  }
  // Slam the speed — car peels out visibly on a clean finish.
  car.moveSpeed = Math.max(car.moveSpeed, CAR_SPEED_EXIT) * 2.2;
  car.state = 'driving_out';
  // Tyre-screech smoke from rear wheels
  AudioKit.tyreScreech();
  AudioKit.cashDing();
  emitParticles(car.x - car.w / 2, car.y + 4, '#b0bec5', 14, { speed: 55, life: 0.7, size: 5, g: -18 });
  emitParticles(car.x - car.w / 2, car.y + 4, '#ffffff', 6,  { speed: 35, life: 0.5, size: 3, g: -10 });
  if (!car.thanked) {
    car.thanked = true;
    sayPlayer(pickLine(YASA_LINES.bye), 2.4, '#e3f2fd');
    // Car replies immediately — by 900ms it's already off-screen at peel-out speed
    sayCar(car, pickLine(CAR_LINES.farewell), 2.2);
  }
  let tip = TIP_BASE + Math.floor(car.satisfaction / 12);
  if (car.perfectSoFar) tip += TIP_PERFECT_BONUS;
  // Rarity multiplier: the rarer the scent used, the bigger the tip.
  // Applied AFTER the perfect-bonus so high-skill + high-rarity compound.
  const rar = car.topRarity;
  const mult = rar ? RARITY_TIP_MULT[rar] : 1.0;
  tip = Math.round(tip * mult);
  // VIP cars: 3× tip
  if (car.vip) tip = Math.round(tip * 3);
  // Car type, Tip Jar upgrade, golden sponge, rush hour
  tip = Math.round(tip * (car.tipKind || 1) * tipMult());
  // Sunny weather: +20% tips
  if (state.weather === 'sunny') tip = Math.round(tip * 1.2);
  // Combo multiplier
  const cmult = comboMultiplier();
  if (cmult > 1) tip = Math.round(tip * cmult);
  // Update combo: perfect cars +1, otherwise reset.
  if (car.perfectSoFar) {
    state.combo += 1;
    state.stats.perfects++;
    state.stats.bestCombo = Math.max(state.stats.bestCombo, state.combo);
    // Milestones
    if ((state.combo === 3 || state.combo === 5 || state.combo === 8) &&
        state.comboMilestoneHit < state.combo) {
      state.comboMilestoneHit = state.combo;
      const cm = comboMultiplier();
      queuePopup('COMBO ×' + state.combo + '!', 'Multiplier is now ' + cm.toFixed(1) + '×! Keep it up.', '#ff7043', '#ffccbc', 'combo');
      AudioKit.comboBig();
    }
  } else {
    breakCombo('imperfect');
  }
  car.finalTip = tip;
  state.tips += tip;
  state.tipPop = 0.35;
  state.hitStop = car.perfectSoFar ? 0.09 : 0.045;
  car.squash = 0.3;
  if (car.perfectSoFar) state.flash = { r: 255, g: 224, b: 130, a: 0.28 };
  if (state.quota && state.tips >= state.quota && state.tips - tip < state.quota) {
    queuePopup('QUOTA HIT!', "Day's quota is in the bag. Everything else is extra cash for the shop.", '#69f0ae', '#b9f6ca', 'combo');
    AudioKit.perfectJingle();
  }
  state.carsServed++;
  state.rep = Math.min(100, state.rep + (car.perfectSoFar ? 4 : 2));
  AudioKit.repUp();
  if (state.tips > state.highScore) {
    state.highScore = state.tips;
    localStorage.setItem('everclean_hs', state.tips);
  }
  AudioKit.cashDing();
  // Level up fanfare every 3 cars served
  if (state.carsServed % 3 === 0) AudioKit.levelUp();
  // Combo: if previous car was completed less than 4s ago, it's a combo
  if (state.comboTimer > 0) AudioKit.comboFanfare();
  state.comboTimer = 4.0;
  state.comboDecayTimer = 15.0;   // refresh streak window
  // Time bonus: +10s per car, scales with rarity
  const timeBonus = rar === 'rare' ? 16 : rar === 'medium' ? 13 : 10;
  state.gameTimer = Math.min(shiftTime(), state.gameTimer + timeBonus);
  AudioKit.timeBonus();
  // Label shows rarity tag, time bonus, perfect star
  const rTag = (rar && rar !== 'common') ? ' ' + RARITY_LABEL[rar] : '';
  const starTag = car.perfectSoFar ? ' ★' : '';
  const col = rar === 'rare' ? '#ce93d8' : (rar === 'medium' ? '#81d4fa' : '#fff59d');
  addFloating("+$" + tip + rTag + starTag, car.x, car.y - 70, col, 1.6);
  spawnTipBills(car, tip);
  AudioKit.tipFloat();
  addFloating("+" + timeBonus + "s ⏱", car.x, car.y - 100, '#69f0ae', 1.2);
  // Satisfying completion burst — gold coins + white sparkles above the car
  emitParticles(car.x, car.y - car.h / 2, '#ffd54f', 12, { speed: 110, life: 0.8, size: 3, g: 180, lift: 50 });
  emitParticles(car.x, car.y - car.h / 2, '#ffffff', 8,  { speed: 80,  life: 0.6, size: 2, g: 160, lift: 40 });
  if (car.perfectSoFar) {
    // Perfect wash: extra star-burst in rarity color
    emitParticles(car.x, car.y - car.h / 2 - 10, col, 16, { speed: 140, life: 1.0, size: 3, g: 120, lift: 60 });
    if (rar === 'rare') {
      addFloating('PERFECT + RARE! 🔥', car.x, car.y - 130, '#ce93d8', 1.8);
      AudioKit.rareFlair();
      AudioKit.perfectJingle();
    } else if (rar === 'medium') {
      addFloating('PERFECT WASH! ★', car.x, car.y - 130, '#81d4fa', 1.5);
      AudioKit.perfectFlair();
      AudioKit.repUp();
    }
  }
}

function missedCar(c) {
  breakCombo('miss');
  const done = c.progress;
  const total = c.sequence.length;
  state.carsLost++;
  state.missFlash = 0.55;
  state.shake = Math.max(state.shake, 0.22);
  AudioKit.missSound();
  AudioKit.honk();
  AudioKit.escapeWhoosh();
  emitParticles(c.x, c.y - c.h / 2, '#ef5350', 8, { speed: 80, life: 0.6, size: 4, g: -30 });
  if (done === 0) {
    // No service at all — full rep hit
    state.rep = Math.max(0, state.rep - 8); AudioKit.repDown();
    addFloating('MISSED! -rep', c.x, c.y - 70, '#ef5350', 1.6);
  } else {
    // Partial service — small consolation tip, lighter rep hit
    const partial = Math.floor((done / total) * TIP_BASE);
    state.tips += partial;
    state.rep = Math.max(0, state.rep - 4); AudioKit.repDown();
    const pctDone = Math.round((done / total) * 100);
    addFloating('ESCAPED! +$' + partial + ' (' + pctDone + '%)', c.x, c.y - 70, '#ffd54f', 1.5);
    if (state.tips > state.highScore) {
      state.highScore = state.tips;
      localStorage.setItem('everclean_hs', state.tips);
    }
  }
}

function loseCar(car) {
  breakCombo('angry');
  car.state = 'leaving_angry';
  state.carsLost++;
  state.rep = Math.max(0, state.rep - 8);
  AudioKit.honk();
  addFloating("LOST", car.x, car.y - 60, '#ef5350', 1.4);
  // Angry exhaust puff
  emitParticles(car.x - car.w / 2, car.y, '#ef5350', 10, { speed: 70, life: 0.7, size: 4, g: -20 });
  emitParticles(car.x - car.w / 2, car.y, '#263238', 6,  { speed: 50, life: 0.9, size: 5, g: -30 });
  state.shake = Math.max(state.shake, 0.2);
}

function enterBreakRoom() {
  state.inBreakRoom = true;
  state.breakTimer = 0;
  state.breakNotes = [];
  state.energyRefillTimer = 0;
  AudioKit.breakRoomEnter();
}

// Returns true if a loading car was found and pressed (so E doesn't also
// trigger tool-pickup or car-service on the same keypress).
function tryLoadCar() {
  const car = state.cars.find(c => c.state === 'loading');
  if (!car) return false;

  car.loadMeter += 1 / loadPresses();
  emitParticles(car.x - car.w / 2, car.y, '#81d4fa', 3,
    { speed: 55, life: 0.35, size: 2, g: 80 });
  AudioKit.carLoadTick(car.loadMeter);

  if (car.loadMeter >= 1) {
    car.loadMeter = 1;
    car.state = 'moving';
    AudioKit.loadReady();
    AudioKit.loadComplete();
    addFloating('LOADED! ✓', car.x, car.y - 70, '#69f0ae', 1.1);
    emitParticles(car.x, car.y - car.h / 2, '#69f0ae', 10,
      { speed: 90, life: 0.6, size: 3, g: 120, lift: 30 });
    // Yasa asks about scents (or car says it wants basic wash if no scents)
    if (!car.offeredScents) {
      car.offeredScents = true;
      if (car.wantsScents) {
        sayPlayer(pickLine(YASA_LINES.askScents), 2.6, '#e3f2fd');
        setTimeout(() => {
          if (car.state === 'moving') sayCar(car, pickScentReply(car), 2.0);
        }, 1200);
      } else {
        setTimeout(() => {
          if (car.state === 'moving') sayCar(car, pickLine(CAR_LINES.noScents), 2.2);
        }, 600);
      }
    }
  }
  return true;
}

/* ============================================================================
   CARS — driving in/out + waiting + impatience
============================================================================ */
function updateCars(dt) {
  for (const c of state.cars) {
    if (c.popT > 0) c.popT = Math.max(0, c.popT - dt);
    if (c.squash > 0) c.squash = Math.max(0, c.squash - dt);
    if (c.wrongT > 0) c.wrongT = Math.max(0, c.wrongT - dt);
    if (c.state === 'arriving') {
      c.x += CAR_SPEED_ARRIVE * dt;
      if (c.x >= CAR_STAGING_X) {
        c.x = CAR_STAGING_X;
        c.state = 'loading';
        c.loadMeter = 0;
        c.loadTimer = 0;
        if (c.vipAnnounce) {
          queuePopup('VIP INCOMING', "Big tipper alert. They're impatient as heck. 3× tips if you nail it!", '#ffd54f', '#fff59d', 'vip');
          c.vipAnnounce = false;
        }
        AudioKit.carArrive();
        setTimeout(() => AudioKit.carDoorClose(), 220);
        setTimeout(() => AudioKit.carHonkSoft(), 480);
        AudioKit.honk();
        // Yasa greets the car
        if (!c.greeted) {
          c.greeted = true;
          sayPlayer(pickLine(YASA_LINES.greet), 2.4, '#e3f2fd');
          setTimeout(() => {
            if (c.state === 'loading' || c.state === 'moving') {
              sayCar(c, pickLine(CAR_LINES.greetBack), 1.8);
            }
          }, 700);
        }
      }
    } else if (c.state === 'loading') {
      c.loadTimer += dt;
      const loadLimit = Math.max(3, LOAD_TIME_LIMIT - getDifficulty() * 0.3);
      if (c.loadTimer >= loadLimit) {
        c.state = 'leaving_angry';
        c.exitLeft = true;
        state.carsLost++;
        state.rep = Math.max(0, state.rep - 8); AudioKit.repDown();
        AudioKit.angryHonk();
        addFloating("TOO SLOW!", c.x, c.y - 60, '#ef5350', 1.6);
        emitParticles(c.x, c.y, '#ef5350', 10, { speed: 70, life: 0.7, size: 4, g: -20 });
        emitParticles(c.x, c.y, '#263238', 6,  { speed: 50, life: 0.9, size: 5, g: -30 });
        state.shake = Math.max(state.shake, 0.25);
      }
    } else if (c.state === 'moving') {
      // While the player is actively using a tool on THIS car, slow it way
      // down so the walk-alongside animation reads naturally instead of the
      // car sliding out from under them at full speed.
      const slowForAction = (state.actionTimer > 0 && state.actionCar === c) ? 0.15 : 1;
      const prevX = c.x;
      c.x += c.moveSpeed * slowForAction * dt;
      for (const o of state.cars) {
        if (o === c || o.x <= prevX || o.exitLeft) continue;
        const minGap = (o.w + c.w) / 2 + 95;
        if (o.x - c.x < minGap) c.x = Math.max(prevX, o.x - minGap);
      }
      // Update patience — VIPs drain 1.8× faster
      const vipMult = c.vip ? 1.8 : 1.0;
      const patienceDrain = (0.025 + getDifficulty() * 0.003) * dt * vipMult * patienceMult() * (c.patienceKind || 1);
      c.satisfaction = Math.max(0, c.satisfaction - patienceDrain * 100);
      // VIP honks every ~2s while moving
      if (c.vip) {
        c.vipHonkCooldown -= dt;
        if (c.vipHonkCooldown <= 0) {
          c.vipHonkCooldown = 1.8 + Math.random() * 0.6;
          AudioKit.carHonkSoft();
        }
      }
      // Bird splat event — rolled exactly once per car when it crosses x=200
      if (!c.birdSplatChecked && c.x > 200) {
        c.birdSplatChecked = true;
        if (Math.random() < 0.08) {
          c.birdSplat = true;
          c.birdSplatProgress = 1;
          queuePopup('INCOMING!', 'A bird just dropped a payload on the car. Backbrush it OFF before it leaves!', '#9ccc65', '#dcedc8', 'bird');
          AudioKit.birdCaw();
          setTimeout(() => AudioKit.birdSplat(), 280);
          emitParticles(c.x, c.y - c.h / 2 - 20, '#ffffff', 8,
            { speed: 60, life: 0.6, size: 3, g: 240 });
          sayCar(c, "EW WHAT THE—", 1.6, '#fff59d');
        }
      }
      // Random impatient chatter past halfway if still unfinished
      if (c.progress < c.sequence.length && c.x > VIEW_W * 0.5 && !c.speech) {
        c.impatientCooldown -= dt;
        if (c.impatientCooldown <= 0) {
          c.impatientCooldown = 3 + Math.random() * 2;
          if (Math.random() < 0.6) sayCar(c, pickLine(CAR_LINES.impatient), 1.6, '#ffe0b2');
        }
      }
      // Miss trigger: when 2/3 of the car has passed the right edge
      // (only 1/3 still visible), lock it as missed and floor it
      const missThreshold = VIEW_W - Math.floor(c.w / 3);
      if (!c.missTriggered && c.progress < c.sequence.length && c.x > missThreshold) {
        c.missTriggered = true;
        missedCar(c);
        // Jerk forward — noticeably faster so player sees it escape
        c.moveSpeed = CAR_SPEED_EXIT * 1.6;
        state.shake = Math.max(state.shake, 0.18);
      }
      if (c.x > VIEW_W + CAR_W + 20) {
        c.state = 'driving_out';
      }
    } else if (c.state === 'driving_out') {
      // Use car's own moveSpeed (boosted by completeCar on a clean finish)
      // so a freshly-completed car visibly peels out faster than a missed one.
      c.x += (c.moveSpeed || CAR_SPEED_EXIT) * dt;
    } else if (c.state === 'leaving_angry') {
      if (c.exitLeft) c.x -= CAR_SPEED_EXIT * dt;
      else            c.x += CAR_SPEED_EXIT * dt;
    }
  }
  state.cars = state.cars.filter(c => c.x > -500 && c.x < VIEW_W + 400);
}

function updateSpawn(dt) {
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnCarIfPossible();
    // Gap between cars shrinks with difficulty: 4s → 1.5s
    let base = Math.max(1.5, 4 - getDifficulty() * 0.25);
    if (state.rushT > 0) base *= 0.5;
    state.spawnTimer = base + Math.random() * 1.2;
  }
}

/* ============================================================================
   MANAGER NPC — pacing + catch
============================================================================ */
function updateManager(dt) {
  const m = state.manager;
  if (!m) return;
  if (state.gameOver) {
    if (m.speech) {
      m.speech.life -= dt;
      if (m.speech.life <= 0) m.speech = null;
    }
    return;
  }
  m.catchCooldown    = Math.max(0, m.catchCooldown    - dt);
  m.bumpCooldown     = Math.max(0, m.bumpCooldown     - dt);
  m.friendlyCooldown = Math.max(0, m.friendlyCooldown - dt);
  if (m.speech) {
    m.speech.life -= dt;
    if (m.speech.life <= 0) m.speech = null;
  }

  // ── Break room cycle ─────────────────────────────────────────────────────
  m.breakPhaseTimer -= dt;
  if (m.breakPhase === 'floor' && m.breakPhaseTimer <= 0) {
    m.breakPhase = 'heading_break';
    m.targetX = BREAK_ROOM_DOOR_X - 30;
    m.targetY = BREAK_ROOM_DOOR_Y + 40;
    m.waitTimer = 999;   // don't pick new waypoints while heading to break
  } else if (m.breakPhase === 'heading_break') {
    if (Math.abs(m.x - m.targetX) < 8 && Math.abs(m.y - m.targetY) < 8) {
      m.breakPhase = 'in_break';
      m.breakPhaseTimer = 18 + Math.random() * 20;  // mostly in break: 18-38s
      AudioKit.breakDoorOpen();
      setTimeout(() => AudioKit.breakDoorClose(), 350);
      // Danny says something before disappearing
      sayDanny(pickLine(DANNY_LINES.doorEnter), 2.4);
    }
  } else if (m.breakPhase === 'in_break') {
    if (m.breakPhaseTimer <= 0) {
      // Put Danny back at the door so he visibly walks out from there.
      // This is always the door position since heading_break walked him there.
      m.x = BREAK_ROOM_DOOR_X - 30;
      m.y = BREAK_ROOM_DOOR_Y + 40;
      m.breakPhase = 'returning';
      m.bumpContact = true;
      AudioKit.breakDoorOpen();
      setTimeout(() => AudioKit.breakDoorClose(), 400);
      // Pick a patrol spot somewhere in the middle of the floor
      m.targetX = 250 + Math.random() * (VIEW_W - 500);
      m.targetY = 440 + Math.random() * 60;
      m.waitTimer = 0.5;
    }
  } else if (m.breakPhase === 'returning') {
    if (Math.abs(m.x - m.targetX) < 10 && Math.abs(m.y - m.targetY) < 10) {
      m.breakPhase = 'floor';
      m.breakPhaseTimer = 6 + Math.random() * 8;   // short floor visit: 6-14s then heads back
      sayDanny(pickLine(DANNY_LINES.back), 2.4);
      AudioKit.dannyBack();
    }
  }

  // Skip all on-floor logic (movement, bumping, greetings) while in break.
  if (m.breakPhase === 'in_break') {
    return;
  }

  m.waitTimer -= dt;
  if (m.breakPhase === 'floor' && m.waitTimer <= 0 && Math.abs(m.x - m.targetX) < 6 && Math.abs(m.y - m.targetY) < 6) {
    // Pick a new waypoint — Danny patrols the walkway in front of the
    // counter (clear of the player's tool work zone when possible). He
    // never walks onto the counter (tools) or into the parking bays.
    m.targetX = 180 + Math.random() * (VIEW_W - 360);
    // 30% chance he strolls near the parking bays to check on cars;
    // 70% stays higher up where the player doesn't usually do tool work.
    m.targetY = Math.random() < 0.30
      ? 520 + Math.random() * 60    // near bays (520-580)
      : 420 + Math.random() * 70;   // counter-side walkway (420-490)
    m.waitTimer = 2 + Math.random() * 2.5;
  }
  const dx = m.targetX - m.x, dy = m.targetY - m.y;
  const d = Math.hypot(dx, dy);
  if (d > 1) {
    m.x += (dx / d) * m.speed * dt;
    m.y += (dy / d) * m.speed * dt;
    m.facing = dx >= 0 ? 'right' : 'left';
    if (m.breakPhase !== 'in_break') {
      state.dannyFootTimer -= dt;
      if (state.dannyFootTimer <= 0) {
        AudioKit.dannyFootstep();
        state.dannyFootTimer = 0.32;
      }
    }
  } else {
    state.dannyFootTimer = 0;
  }

  const p = state.player;
  const distPM = Math.hypot(p.x - m.x, p.y - m.y);

  // Danny randomly shouts encouragement anywhere on the floor — nice guy vibes.
  if (m.breakPhase === 'floor' && !state.inBreakRoom && !state.gameOver && m.friendlyCooldown <= 0) {
    m.friendlyCooldown = 5 + Math.random() * 4;
    sayDanny(pickLine(DANNY_LINES.friendly), 2.4);
    AudioKit.dannyFriendly();
  }

  // Physical bump detection — 3 strikes and you're fired.
  // Debounced: the player must back off (>1.3× BUMP_R) before a new bump
  // can register, so grazing him once doesn't tick the counter repeatedly.
  // VERY tight hitboxes: you can walk around Danny freely — only a real
  // overlap with his torso/legs triggers a strike. Each box is much smaller
  // than the rendered sprite so brushing past his edges is safe.
  const D_HW = 6,  D_HH = 16;   // Danny torso half-width / half-height (tight)
  const P_HW = 10, P_HH = 26;   // Player torso half-width / half-height (tight)
  const dCx = m.x,           dCy = m.y - D_HH;
  const pCx = state.player.x, pCy = state.player.y - P_HH;
  const overlapX = Math.abs(pCx - dCx) < (D_HW + P_HW);
  const overlapY = Math.abs(pCy - dCy) < (D_HH + P_HH);
  const touching = overlapX && overlapY;
  // Diagonal distance (used only for the re-arm threshold below)
  const tightDist = Math.hypot(pCx - dCx, pCy - dCy);
  // Bump on 'floor' OR while Danny is in transit (returning/heading_break).
  // Only safe phase is 'in_break' (he's off-screen).
  // ALSO safe: while the player is mid-action (auto-walking to a car or tracking
  // it during a tool use). They're not in control, so a Danny strike isn't fair.
  const canBump = m.breakPhase !== 'in_break' && state.actionTimer <= 0 && !state.phoneOpen;
  if (canBump && !state.inBreakRoom && touching && !m.bumpContact && m.bumpCooldown <= 0) {
    m.bumpContact  = true;
    m.bumpCooldown = 1.0;
    m.bumpCount   += 1;
    state.caughtFlash = 0.45;
    state.shake = Math.max(state.shake, 0.3);
    if (m.bumpCount >= 3) {
      AudioKit.fired();
      sayDanny(pickLine(DANNY_LINES.fired), 3.0, '#ffcdd2');
      careerOver('fired');
    } else {
      AudioKit.dannyWarn();
      const tag = m.bumpCount === 1 ? " (1/3)" : " (2/3)";
      sayDanny(pickLine(DANNY_LINES.bumpWarn) + tag, 2.2, '#ffe0b2');
      breakCombo('bump');
    }
  } else if (!touching && tightDist > 50) {
    m.bumpContact = false; // re-arm once player steps clear of Danny's body
  }
}

/* ============================================================================
   ENERGY, SHIFT, GAME OVER
============================================================================ */
function updateEnergyAndTimer(dt) {
  // Energy drains while on the floor; break room holds F to refill.
  if (!state.inBreakRoom) {
    state.energy = Math.max(0, state.energy - energyDrain() * dt);
    // Energy low warning — fire once when crossing 20%
    if (state.energy < 20 && !state.energyLowWarned && !state.gameOver) {
      state.energyLowWarned = true;
      AudioKit.energyLow();
    }
    if (state.energy <= 0 && !state.gameOver) careerOver('tired');
  }
  // Game clock counts down — reaching 0 ends the run.
  const prevTimer = state.gameTimer;
  state.gameTimer = Math.max(0, state.gameTimer - dt);
  // Urgent blip every second when under 15s
  if (!state.gameOver && state.gameTimer > 0 && state.gameTimer <= 15) {
    if (Math.floor(prevTimer) !== Math.floor(state.gameTimer)) AudioKit.timeLow();
  }
  if (state.gameTimer <= 0 && !state.gameOver && !state.shiftOver) endShift();
}
