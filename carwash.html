      "  • Don't let cars escape — partial credit only",
      "  • Watch your energy AND the clock",
      "  • Toasts (top-right) tell you what's happening",
      "",
      "Press E or → to flip pages.",
      "Press S or ESC to skip. Good luck out there!",
    ],
  },
];

const TUT_SKIP_BTN = { x: 0, y: 0, w: 0, h: 0 };
function openTutorial() {
  state.tutorialOpen = true;
  state.tutorialPage = 0;
  state.paused = true;
  AudioKit.uiSelect();
}
function closeTutorial() {
  state.tutorialOpen = false;
  state.paused = false;
  state.tutorialSeen = true;
  localStorage.setItem('everclean_tut_v2', '1');
  AudioKit.uiSelect();
}
function tutorialNext() {
  if (state.tutorialPage < TUTORIAL_PAGES.length - 1) {
    state.tutorialPage++;
    AudioKit.speechBlip();
  } else {
    closeTutorial();
  }
}
function tutorialPrev() {
  if (state.tutorialPage > 0) {
    state.tutorialPage--;
    AudioKit.speechBlip();
  }
}

// Translate keyboard-centric labels in tutorial body lines into touch-friendly
// equivalents when the player is on a phone/tablet. Desktop unaffected.
function mobilizeLine(line) {
  if (!IS_TOUCH) return line;
  return line
    .replace(/WASD or arrow keys/gi, 'D-pad (bottom-left)')
    .replace(/WASD/g, 'D-pad')
    .replace(/arrow keys/gi, 'D-pad')
    .replace(/SPAM E/g, 'TAP the A button fast')
    .replace(/Spam E/g, 'Tap the A button fast')
    .replace(/spam E/g, 'tap the A button fast')
    .replace(/\[E\]/g, '[A button]')
    .replace(/Press E/g, 'Tap the A button')
    .replace(/press E/g, 'tap the A button')
    .replace(/\[T \/ ESC\]/g, '[?] / [II]')
    .replace(/\[E \/ →\]/g, '[Next ▶]')
    .replace(/\[← \/ Q\]/g, '[◀ Back]')
    .replace(/E or →/g, 'A button or D-pad ▶')
    .replace(/T or ESC/g, '[?] or [II]')
    .replace(/Press P/g, 'Tap the P button')
    .replace(/press P/g, 'tap the P button')
    .replace(/Press Q/g, 'Tap the Q button')
    .replace(/press Q/g, 'tap the Q button')
    .replace(/\[P \/ E \/ ESC\]/g, '[P] / [A] / [II]')
    .replace(/ESC pauses\. T reopens this tutorial anytime\./g,
             '[II] pauses. [?] reopens this tutorial anytime.')
    .replace(/ESC pauses/g, '[II] pauses')
    .replace(/\bESC\b/g, '[II]')
    .replace(/\bT reopens\b/g, '[?] reopens')
    .replace(/\bP key\b/gi, '[P] button')
    .replace(/with E\./g, 'with the A button.')
    .replace(/ E /g, ' the A button ')
    .replace(/Press \[\?\]/g, 'Tap [?]')
    .replace(/A button or → to flip pages\./g,
             'A button or D-pad ▶ to flip pages.');
}

function drawTutorial() {
  // Dark scrim
  ctx.fillStyle = 'rgba(6, 14, 26, 0.92)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  const page = TUTORIAL_PAGES[state.tutorialPage] || TUTORIAL_PAGES[0];
  const total = TUTORIAL_PAGES.length;
  const i = state.tutorialPage;

  // Card
  const cardW = 820, cardH = 500;
  const cx = (VIEW_W - cardW) / 2;
  const cy = (VIEW_H - cardH) / 2;
  // Card shadow
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(cx + 6, cy + 8, cardW, cardH);
  // Card body
  ctx.fillStyle = '#0f2236';
  ctx.fillRect(cx, cy, cardW, cardH);
  // Card border
  ctx.strokeStyle = C_ACCENT;
  ctx.lineWidth = 3;
  ctx.strokeRect(cx + 1.5, cy + 1.5, cardW - 3, cardH - 3);

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffe082';
  ctx.font = 'bold 32px ui-monospace, monospace';
  ctx.fillText(page.title, VIEW_W / 2, cy + 60);

  // Page indicator dots
  const dotsY = cy + 84;
  const gap = 18;
  const startX = VIEW_W / 2 - ((total - 1) * gap) / 2;
  for (let d = 0; d < total; d++) {
    ctx.fillStyle = d === i ? '#ffe082' : '#37474f';
    ctx.beginPath();
    ctx.arc(startX + d * gap, dotsY, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Body lines
  ctx.fillStyle = '#e6f2ff';
  ctx.font = '20px ui-monospace, monospace';
  ctx.textAlign = 'left';
  const lineH = 28;
  const bodyStartY = cy + 140;
  const bodyX = cx + 64;
  for (let r = 0; r < page.body.length; r++) {
    ctx.fillText(mobilizeLine(page.body[r]), bodyX, bodyStartY + r * lineH);
  }

  // Footer hints — different on touch (tap the buttons rather than read keys)
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px ui-monospace, monospace';
  ctx.fillStyle = '#90a4ae';
  const footY = cy + cardH - 28;
  let footText;
  if (IS_TOUCH) {
    if (i === 0 && total > 1) {
      footText = 'Tap [Next ▶] to continue   •   [Skip] to close';
    } else if (i === total - 1) {
      footText = '[◀ Back]   •   Tap [Next ▶] to play!   •   [Skip] to close';
    } else {
      footText = '[◀ Back]   •   [Next ▶]   •   [Skip] to close';
    }
  } else {
    if (i === 0 && total > 1) {
      footText = '[E / →] next   •   [S / ESC] skip & play';
    } else if (i === total - 1) {
      footText = '[← / Q] back   •   [E / →] start playing!   •   [S / ESC] skip & play';
    } else {
      footText = '[← / Q] back   •   [E / →] next   •   [S / ESC] skip & play';
    }
  }
  ctx.fillText(footText, VIEW_W / 2, footY);

  // Clickable "Skip & Play" button (top-right of the card)
  const sb = TUT_SKIP_BTN;
  sb.x = cx + cardW - 176; sb.y = cy - 52; sb.w = 176; sb.h = 40;
  ctx.fillStyle = 'rgba(255,224,130,0.16)'; ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
  ctx.strokeStyle = '#ffe082'; ctx.lineWidth = 2; ctx.strokeRect(sb.x, sb.y, sb.w, sb.h);
  ctx.fillStyle = '#ffe082'; ctx.font = 'bold 18px ui-monospace, monospace';
  ctx.fillText('SKIP & PLAY ▶', sb.x + sb.w / 2, sb.y + 26);
  addButton(sb.x, sb.y, sb.w, sb.h, closeTutorial);

  // Pulsing prompt on first page
  if (i === 0) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 380);
    ctx.globalAlpha = 0.5 + pulse * 0.5;
    ctx.fillStyle = '#ffe082';
    ctx.font = 'bold 18px ui-monospace, monospace';
    const promptText = IS_TOUCH ? 'Tap [Next ▶] to flip the page →'
                                : 'Press E to flip the page →';
    ctx.fillText(promptText, VIEW_W / 2, cy + cardH - 60);
    ctx.globalAlpha = 1;
  }
}

function updateTutorial() {
  if (consumeEdge('escape') || consumeEdge('t') || consumeEdge('s')) { closeTutorial(); return; }
  if (consumeEdge('e') || consumeEdge('arrowright') || consumeEdge(' ')
      || consumeEdge('enter') || consumeEdge('d')) {
    tutorialNext();
    return;
  }
  if (consumeEdge('arrowleft') || consumeEdge('q') || consumeEdge('a')) {
    tutorialPrev();
    return;
  }
}

function drawCaughtFlash() {
  if (state.caughtFlash > 0) {
    ctx.fillStyle = `rgba(255,80,80,${state.caughtFlash * 0.5})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

// Where each tool's action visibly lands on the car body. Coordinates are
// RELATIVE to car center (car.x, car.y). Cars are drawn in profile facing
// RIGHT (headlights on right), so:
//   * front windshield  = right-half of the cabin, above the body
//   * back panel        = left edge / trunk of the body
//   * driver's window   = front-half of cabin (driver sits up front, left
//                         side of US cars, which in side-view maps to the
//                         forward portion of the visible-side window)
// These are the visual targets where the tool icon hovers, the effect
// overlay paints, and the particle system sources from.
function actionTargetOffset(actionType) {
  if (actionType === 'hose')      return { x:  70, y:  -8 };   // front bumper / hood
  if (actionType === 'backbrush') return { x: -55, y:   0 };   // back / trunk panel
  if (actionType && actionType.startsWith('scent_'))
                                  return { x:  10, y: -38 };   // driver window
  return { x: 0, y: 0 };
}

function drawAction() {
  if (state.actionTimer <= 0) return;
  const car = state.actionCar;
  // Clear stale action if car has peeled out or left
  if (!car || car.state === 'driving_out' || car.state === 'leaving_angry') {
    state.actionTimer = 0;
    state.actionType = null;
    state.actionCar = null;
    return;
  }

  // Action progress bar — sits above the sequence bubble (car.y - car.h/2 - 60).
  // With CAR_H=54 that bubble top is at car.y-87; put the bar 12px above it.
  const w = 90, h = 7;
  const x = car.x - w / 2;
  const y = carTop(car) - 74;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = C_ACCENT;
  const ratio = 1 - (state.actionTimer / actionDuration());
  ctx.fillRect(x, y, w * ratio, h);

  // Target point on the car body for this tool.
  const off = actionTargetOffset(state.actionType);
  const tx = car.x + off.x;
  const ty = car.y + off.y;

  // Draw the cool FX overlay and tool icon ON the car. Called from here
  // (drawAction is invoked after the depth-sort loop in draw()) so the
  // result layers cleanly on top of the vehicle — never hidden behind it.
  drawActionEffect(tx, ty, state.actionType, state.actionTimer);
  drawActionTool(tx, ty, state.actionType, state.actionTimer);
  if (simFrozen()) return;

  // Continuous particle bursts — tool-specific, sourced AT the target so
  // it reads as "X is happening TO this part of the car":
  //  * hose  → jetting stream from player's nozzle → windshield impact + splash
  //  * brush → foam puffs + dirt flicks at the back panel
  //  * scent → colored mist wafting out of / into the driver window
  const p = state.player;
  if (state.actionType === 'hose') {
    // Arcing jet: continuous stream originates at the player's hose
    // nozzle and flies across the floor to the front of the car. Distance
    // doesn't matter — aim the stream wherever the car is. Particle
    // speed is tuned to the gap so the arc lands roughly at (tx,ty).
    const hoff = handOffset(p.facing, PLAYER_DRAW_W, PLAYER_DRAW_H, 'hose');
    const nx = p.x + hoff.x, ny = p.y - PLAYER_DRAW_H + hoff.y;
    const dxJet = tx - nx, dyJet = ty - ny;
    const dist = Math.max(40, Math.hypot(dxJet, dyJet));
    // Give the jet enough speed to reach the target in ~0.45s and
    // compensate upward for the parabolic drop under gravity.
    const tFlight = 0.45;
    const gJet = 260;
    const vx = dxJet / tFlight;
    const vy = dyJet / tFlight - 0.5 * gJet * tFlight; // arc lift
    for (let k = 0; k < 3; k++) {
      if (Math.random() < 0.95) {
        state.particles.push({
          x: nx + (Math.random() - 0.5) * 3,
          y: ny + (Math.random() - 0.5) * 3,
          vx: vx + (Math.random() - 0.5) * 40,
          vy: vy + (Math.random() - 0.5) * 30,
          life: tFlight + 0.15 + Math.random() * 0.1,
          max:  tFlight + 0.25,
          color: Math.random() < 0.6 ? C_WATER : '#e1f5fe',
          size: 2 + Math.random() * 1.2,
          g: gJet,
        });
      }
    }
    // Impact splash at the front of the car — droplets fan out on contact.
    if (Math.random() < 0.7) {
      emitParticles(tx, ty, '#ffffff', 2,
                    { speed: 90, life: 0.3, size: 2, g: 260 });
      emitParticles(tx, ty, C_WATER, 2,
                    { speed: 70, life: 0.4, size: 2, g: 220 });
    }
    // Runoff trickle dripping off the front bumper.
    if (Math.random() < 0.22) {
      emitParticles(tx + 4, ty + 14, C_WATER, 1,
                    { speed: 20, life: 0.55, size: 2, g: 320 });
    }
    void dist; // silence unused
  } else if (state.actionType === 'backbrush') {
    // Scrub produces lots of foam on the back panel.
    if (Math.random() < 0.9) {
      emitParticles(tx + (Math.random() - 0.5) * 40,
                    ty + (Math.random() - 0.5) * 20,
                    '#ffffff', 3,
                    { speed: 40, life: 0.7, size: 3, g: 10 });
    }
    // Dirt flicks fly off the brush at the arc extremes.
    if (Math.random() < 0.4) {
      const fDir = Math.random() < 0.5 ? -1 : 1;
      emitParticles(tx, ty - 10, '#5d4037', 2,
                    { speed: 90, life: 0.5, size: 2, g: 240, lift: 40 });
      // Horizontal momentum kick — particles shoot sideways from the sweep.
      const last = state.particles[state.particles.length - 1];
      if (last) last.vx += fDir * 60;
    }
  } else if (state.actionType && state.actionType.startsWith('scent_')) {
    // Mist puffs out of the window — drifts forward (toward front of car = +x)
    // and slightly upward, like a freshener being squeezed into the cabin.
    if (Math.random() < 0.7) {
      const mc = scentColor(state.actionType);
      const spread = (Math.random() - 0.5) * 20;
      state.particles.push({
        x: tx + 4, y: ty + (Math.random() - 0.5) * 10,
        vx: 25 + Math.random() * 30 + spread,
        vy: -8 - Math.random() * 20,
        life: 1.0 * (0.7 + Math.random() * 0.6),
        max: 1.0, color: mc,
        size: 3.5 + Math.random() * 2.5,
        g: -6,
      });
    }
    // A few mist wisps drift BACK too — scent fills the whole car interior.
    if (Math.random() < 0.3) {
      const mc = scentColor(state.actionType);
      state.particles.push({
        x: tx - 4, y: ty,
        vx: -15 - Math.random() * 15,
        vy: -6 - Math.random() * 14,
        life: 0.7 + Math.random() * 0.3,
        max: 0.7, color: mc,
        size: 2 + Math.random() * 1.5,
        g: -4,
      });
    }
    // Mystery: gold sparkle motes that lift and drift.
    if (state.actionType === 'scent_purple' && Math.random() < 0.55) {
      emitParticles(tx + (Math.random() - 0.5) * 30, ty,
                    '#fff59d', 1, { speed: 45, life: 1.0, size: 2, g: -35 });
    }
    // Cherry Bomb: hot red embers drifting up.
    if (state.actionType === 'scent_red' && Math.random() < 0.5) {
      emitParticles(tx + (Math.random() - 0.5) * 30, ty,
                    '#ff7043', 1, { speed: 35, life: 1.0, size: 2, g: -30 });
    }
  }
}

// Draws the tool icon hovering over the car's target point with a
// tool-specific procedural animation. Rendered on top of the car.
function drawActionTool(tx, ty, actionType, timer) {
  // Hose is held by the player (long-range sprayer). Skip the on-car icon —
  // drawPlayer handles rendering it in the hand.
  if (actionType === 'hose') return;

  const iconH = TOOL_ICON_H[actionType] || 28;
  // t: 0 → 1 over the action duration. Envelope: smooth fade at edges.
  const t = 1 - Math.max(0, timer / actionDuration());
  const envelope = Math.sin(t * Math.PI);

  let offX = 0, offY = 0, rotation = 0, iconScale = 1;

  if (actionType === 'backbrush') {
    // Scrub: wide side-to-side sweep across the back panel. Fast cadence.
    const sweep = Math.sin(t * Math.PI * 7);
    offX = sweep * 28 * envelope;
    offY = -Math.abs(sweep) * 4 * envelope;
    rotation = sweep * 0.6 * envelope;
    iconScale = 1 + Math.abs(sweep) * 0.12 * envelope;
  } else if (actionType === 'hose') {
    // Pressurized jitter + aim-down tilt: hose barrel points at the glass.
    offX = Math.sin(t * Math.PI * 14) * 3;
    offY = -22 + Math.cos(t * Math.PI * 11) * 2; // hovers ABOVE windshield
    rotation = 1.4 + Math.sin(t * Math.PI * 8) * 0.05; // ~80° (nozzle down)
  } else if (actionType && actionType.startsWith('scent_')) {
    // Three discrete pump-squeezes, bottle tilted toward the window.
    const pumpT = t * 3;
    const phase = pumpT - Math.floor(pumpT);
    const squeeze = phase < 0.35 ? (phase / 0.35)
                                 : (1 - (phase - 0.35) / 0.65);
    iconScale = 1 - squeeze * 0.18;
    offX = -14;                  // bottle sits just left of the window
    offY = -10 + squeeze * 3;
    rotation = 0.8 + squeeze * 0.15; // tilts more as it pumps
  }

  ctx.save();
  ctx.translate(tx + offX, ty + offY);
  if (rotation !== 0) ctx.rotate(rotation);
  if (iconScale !== 1) ctx.scale(iconScale, iconScale);
  drawToolIcon(actionType, 0, 0, iconH);
  ctx.restore();
}

// Painterly overlay that sits between the car surface and the tool icon.
// Gives each action a visible "working area" on the body so the car looks
// like it's being cleaned/scented in real-time, not just pelted by particles.
function drawActionEffect(tx, ty, actionType, timer) {
  const t = 1 - Math.max(0, timer / actionDuration());
  const envelope = Math.sin(t * Math.PI);
  ctx.save();

  if (actionType === 'hose') {
    // Soft water impact splash on the front of the car — subtle pulsing
    // puddle where the stream lands. No ring rings on the glass: the
    // visual emphasis is the arcing jet, not a painted-on target.
    ctx.globalAlpha = 0.22 * envelope;
    ctx.fillStyle = C_WATER;
    ctx.beginPath();
    ctx.ellipse(tx, ty + 2, 22 + Math.sin(t * Math.PI * 8) * 3, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.35 * envelope;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(tx, ty + 1, 9, 3, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (actionType === 'backbrush') {
    // Scrub arc trails: two white curved strokes mirroring the brush sweep.
    const sweep = Math.sin(t * Math.PI * 7);
    ctx.globalAlpha = 0.6 * envelope;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      const ox = (k - 1) * 14;
      ctx.beginPath();
      ctx.arc(tx + ox, ty + 2, 12, Math.PI * 0.15, Math.PI - Math.PI * 0.15);
      ctx.stroke();
    }
    // Moving soap smear that follows the brush.
    ctx.globalAlpha = 0.35 * envelope;
    ctx.fillStyle = '#fff59d';
    ctx.beginPath();
    ctx.ellipse(tx + sweep * 20, ty, 22, 8, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (actionType && actionType.startsWith('scent_')) {
    // Aura cloud pulsing around the driver's window — color matches scent.
    const pump = Math.abs(Math.sin(t * Math.PI * 3));
    const r = 14 + pump * 10;
    const col = scentColor(actionType);
    ctx.globalAlpha = 0.35 * envelope;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(tx + 6, ty, r, 0, Math.PI * 2);
    ctx.fill();
    // Halo ring expanding outward on each pump — wispy aromatic ring.
    const ringPhase = (t * 3) % 1;
    ctx.globalAlpha = (1 - ringPhase) * 0.55 * envelope;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tx + 6, ty, 10 + ringPhase * 24, 0, Math.PI * 2);
    ctx.stroke();
    // Mystery: second halo in gold for a rare-item shimmer.
    if (actionType === 'scent_purple') {
      ctx.globalAlpha = (1 - ringPhase) * 0.45 * envelope;
      ctx.strokeStyle = '#fff59d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(tx + 6, ty, 6 + ringPhase * 30, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function scentColor(t) {
  if (t === 'scent_yellow') return '#fdd835';  // LEMON — bright yellow
  if (t === 'scent_red')    return '#e53935';  // CHERRY BOMB — hot red
  if (t === 'scent_purple') return '#ba68c8';  // MYSTERY — shimmer purple
  return '#fff';
}

// Emit particles with a biased velocity vector from (x0,y0) toward (x1,y1).
// `spread` is the lateral jitter as a fraction of forward velocity (0 = laser,
// 0.3 = broad cone). Used for hose stream so water sprays TO the car, not FROM.
function emitDirectional(x0, y0, x1, y1, color, n, opts = {}) {
  if (simFrozen()) return;
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  // Perpendicular unit vector for lateral spread.
  const px = -uy, py = ux;
  const sp = opts.speed || 300;
  const sprd = opts.spread || 0.2;
  for (let i = 0; i < n; i++) {
    const s = sp * (0.8 + Math.random() * 0.4);
    const lat = (Math.random() - 0.5) * 2 * sprd * s;
    state.particles.push({
      x: x0, y: y0,
      vx: ux * s + px * lat,
      vy: uy * s + py * lat,
      life: (opts.life || 0.4) * (0.7 + Math.random() * 0.6),
      max: (opts.life || 0.4),
      color,
      size: (opts.size || 2) + Math.random(),
      g: opts.g === undefined ? 80 : opts.g,
    });
  }
}

/* ============================================================================
   WEATHER + PHONE + TIP BILLS
============================================================================ */
function updateWeather(dt) {
  state.weatherTimer -= dt;
  if (state.weatherTransition > 0) {
    state.weatherTransition = Math.max(0, state.weatherTransition - dt * 0.5);
  }
  if (state.weatherTimer <= 0) {
    const opts = ['sunny', 'cloudy', 'rainy'].filter(w => w !== state.weather);
    state.prevWeather = state.weather;
    state.weather = opts[Math.floor(Math.random() * opts.length)];
    state.weatherTimer = 40 + Math.random() * 15;
    state.weatherTransition = 1;
    if (state.weather === 'sunny') {
      queuePopup('SUNNY DAY', 'Customers are in a great mood. Tips are boosted by 20% — go cash in!', '#ffd54f', '#fff59d', 'sun');
    } else if (state.weather === 'cloudy') {
      queuePopup('CLOUDS ROLL IN', 'Just a normal day at the wash. No bonuses, no penalties — just hustle.', '#b0bec5', '#eceff1', 'cloud');
    } else if (state.weather === 'rainy') {
      queuePopup('IT\'S RAINING', 'Cars are showing up extra dirty. Expect bonus hose steps on the front of the line.', '#81d4fa', '#b3e5fc', 'rain');
    }
  }
  // Maintain rain drops if rainy.
  if (state.weather === 'rainy') {
    if (state.rainDrops.length < 80) {
      for (let i = state.rainDrops.length; i < 80; i++) {
        state.rainDrops.push({
          x: Math.random() * VIEW_W, y: Math.random() * VIEW_H,
          vy: 700 + Math.random() * 300, len: 8 + Math.random() * 8,
        });
      }
    }
    for (const d of state.rainDrops) {
      d.y += d.vy * dt;
      d.x -= 60 * dt;   // slight wind
      if (d.y > VIEW_H) { d.y = -10; d.x = Math.random() * VIEW_W + 60; }
    }
  } else if (state.weather !== 'rainy' && state.rainDrops.length && state.weatherTransition <= 0) {
    state.rainDrops.length = 0;
  }
}

function updatePhone(dt) {
  if (state.phoneOpen) return;   // pause buzz cycle while reading
  if (state.phoneMsg) {
    // Has unread message — count ignore time, re-buzz at 20s.
    state.phoneIgnoredTimer += dt;
    if (state.phoneIgnoredTimer >= 20) {
      state.phoneIgnoredTimer = 0;
      AudioKit.phoneBuzz();
    }
    return;
  }
  state.phoneBuzzCooldown -= dt;
  if (state.phoneBuzzCooldown <= 0) {
    state.phoneBuzzCooldown = 30 + Math.random() * 20;
    state.phoneMsg = PHONE_TEXTS[Math.floor(Math.random() * PHONE_TEXTS.length)];
    state.phoneIgnoredTimer = 0;
    queuePopup('NEW MESSAGE', '"' + state.phoneMsg.from + '" texted you. Press P to read.', '#81d4fa', '#b3e5fc', 'phone');
    AudioKit.phoneBuzz();
  }
}

function updateTipBills(dt) {
  for (const b of state.tipBills) {
    b.life -= dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += 40 * dt;        // slight downward drag eventually
    b.rot += b.vrot * dt;
  }
  state.tipBills = state.tipBills.filter(b => b.life > 0);
}

function spawnTipBills(car, amount) {
  const n = 2 + Math.floor(Math.random() * 3);   // 2..4
  for (let i = 0; i < n; i++) {
    state.tipBills.push({
      x: car.x + (Math.random() - 0.5) * 18,
      y: car.y - car.h / 2 - 4,
      vx: (Math.random() - 0.5) * 60,
      vy: -90 - Math.random() * 40,
      rot: (Math.random() - 0.5) * 0.5,
      vrot: (Math.random() - 0.5) * 1.4,
      life: 1.5, max: 1.5,
      amt: Math.max(1, Math.round(amount / n)),
    });
  }
}

function comboMultiplier() {
  return Math.min(4, 1 + Math.floor(state.combo / 2) * 0.5);
}

function breakCombo(reason) {
  if (state.combo > 0) {
    addFloating("COMBO LOST", state.player.x, state.player.y - 170, '#ef9a9a', 1.0);
  }
  state.combo = 0;
  state.comboMilestoneHit = 0;
}

/* ============================================================================
   POPUP ANNOUNCEMENT SYSTEM
============================================================================ */
// ── TOAST ACHIEVEMENTS (Minecraft-style slide-in from top-right) ─────────
// state.popupQueue holds currently active toasts. Each has:
//   { title, body, color, accent, life, max, anim (0→1 slide-in) }
// New toasts push on the bottom; older ones stack above. Each auto-dismisses
// after `max` seconds (computed from body length so long msgs stay longer).
function queuePopup(title, body, color = '#90caf9', accent = '#fff59d', kind = 'info') {
  // Dedup: don't stack identical titles back-to-back
  const last = state.popupQueue[state.popupQueue.length - 1];
  if (last && last.title === title && last.life > 0) return;
  // Lifetime scales with body length (~70ms/char), clamped 11–22s — comfy reading
  const dur = Math.max(11.0, Math.min(22.0, 9.0 + (body ? body.length * 0.07 : 0)));
  state.popupQueue.push({
    title, body: body || '', color, accent, kind,
    life: dur, max: dur, anim: 0,
  });
  AudioKit.uiSelect();
}
function updateToasts(dt) {
  const arr = state.popupQueue;
  for (const t of arr) {
    t.anim = Math.min(1, t.anim + dt * 6);   // slide-in ease
    t.life -= dt;
  }
  // Drop expired (iterate backwards to splice safely)
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i].life <= 0) arr.splice(i, 1);
  }
}
// Chunky pixel-art icon in a 24x24 box at (x, y). `color` is the toast's accent.
function drawToastIcon(kind, x, y, size, color) {
  const u = Math.floor(size / 8); // unit pixel ~ 3
  const px = (cx, cy, w, h, fill) => {
    ctx.fillStyle = fill;
    ctx.fillRect(Math.floor(x + cx * u), Math.floor(y + cy * u), Math.ceil(w * u), Math.ceil(h * u));
  };
  if (kind === 'rain') {
    // cloud body (white-ish)
    px(1, 2, 2, 2, '#eceff1');
    px(2, 1, 3, 2, '#eceff1');
    px(4, 2, 3, 2, '#eceff1');
    px(1, 3, 6, 1, '#cfd8dc');
    // raindrops
    px(2, 5, 1, 2, '#4fc3f7');
    px(4, 5, 1, 2, '#4fc3f7');
    px(6, 5, 1, 2, '#4fc3f7');
  } else if (kind === 'sun') {
    // center
    px(3, 3, 2, 2, '#ffd54f');
    // cardinal rays
    px(3, 0, 2, 1, '#ffd54f');
    px(3, 7, 2, 1, '#ffd54f');
    px(0, 3, 1, 2, '#ffd54f');
    px(7, 3, 1, 2, '#ffd54f');
    // diagonal rays
    px(1, 1, 1, 1, '#ffd54f');
    px(6, 1, 1, 1, '#ffd54f');
    px(1, 6, 1, 1, '#ffd54f');
    px(6, 6, 1, 1, '#ffd54f');
  } else if (kind === 'cloud') {
    px(1, 3, 2, 2, '#b0bec5');
    px(2, 2, 3, 2, '#cfd8dc');
    px(4, 3, 3, 2, '#b0bec5');
    px(1, 4, 6, 1, '#90a4ae');
  } else if (kind === 'vip') {
    // crown spikes
    px(1, 2, 1, 1, '#ffd54f');
    px(3, 1, 1, 1, '#ffd54f');
    px(5, 2, 1, 1, '#ffd54f');
    // crown body
    px(1, 3, 6, 2, '#ffca28');
    // base bar
    px(1, 5, 6, 1, '#f9a825');
    // gem
    px(3, 4, 1, 1, '#e53935');
  } else if (kind === 'bird') {
    // body
    px(2, 3, 3, 2, '#cfd8dc');
    // head
    px(4, 2, 2, 2, '#cfd8dc');
    // wing
    px(2, 4, 2, 1, '#90a4ae');
    // beak
    px(6, 3, 1, 1, '#ffb300');
    // eye
    px(5, 2, 1, 1, '#0e1726');
  } else if (kind === 'phone') {
    // outline
    px(2, 1, 4, 6, color || '#81d4fa');
    // screen
    px(3, 2, 2, 3, '#0e1726');
    // speaker dot
    px(3, 5, 2, 1, '#0e1726');
    px(3, 6, 2, 1, color || '#81d4fa');
  } else if (kind === 'combo') {
    // flame stack
    px(3, 5, 2, 2, '#e53935');
    px(2, 4, 4, 1, '#fb8c00');
    px(3, 3, 2, 1, '#fb8c00');
    px(2, 2, 1, 1, '#ffb300');
    px(5, 2, 1, 1, '#ffb300');
    px(3, 1, 2, 1, '#ffb300');
    px(3, 6, 2, 1, '#ffeb3b');
  } else {
    // info: circle 'i'
    px(2, 1, 4, 1, color || '#90caf9');
    px(1, 2, 6, 4, color || '#90caf9');
    px(2, 6, 4, 1, color || '#90caf9');
    px(3, 3, 2, 2, '#0e1726');
    px(3, 2, 2, 1, '#0e1726');
  }
}
function wrapText(text, maxW, maxLines) {
  const lines = [];
  let cur = '';
  for (const w of (text || '').split(' ')) {
    const test = cur ? cur + ' ' + w : w;
    if (!cur || ctx.measureText(test).width <= maxW) cur = test;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let last = lines[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last + '…';
  }
  return lines;
}
function drawToasts() {
  const arr = state.popupQueue;
  if (!arr.length) return;
  const cw = 360, ch = 72;              // card dimensions
  const pad = 10;                        // vertical gap between stacked toasts
  const baseY = 60;                      // below top HUD bar
  ctx.save();
  ctx.textBaseline = 'alphabetic';
  ctx.font = '12px ui-monospace, monospace';
  const maxW = cw - 62;
  let cy = baseY;
  for (let i = 0; i < arr.length; i++) {
    const t = arr[i];
    const lines = wrapText(t.body, maxW, 3);
    const h = Math.max(ch, 40 + lines.length * 16);
    if (cy + h > VIEW_H - 20) break;
    // Slide-in easing: anim=0 → offscreen right, anim=1 → final x
    const ease = 1 - Math.pow(1 - t.anim, 3);
    const finalX = VIEW_W - cw - 16;
    const offX = (1 - ease) * (cw + 40);
    const cx = finalX + offX;
    // Fade near end of life
    const fade = t.life < 0.6 ? (t.life / 0.6) : 1;
    ctx.globalAlpha = Math.max(0, Math.min(1, fade));
    // Card body
    ctx.fillStyle = '#0e1726';
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(cx, cy, cw, h, 10); ctx.fill();
    } else ctx.fillRect(cx, cy, cw, h);
    // Accent side-bar (left edge) — iconic achievement stripe
    ctx.fillStyle = t.color || '#90caf9';
    ctx.fillRect(cx, cy, 5, h);
    // Subtle border
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(cx + 0.5, cy + 0.5, cw - 1, h - 1, 10); ctx.stroke();
    } else ctx.strokeRect(cx + 0.5, cy + 0.5, cw - 1, h - 1);
    // Icon (24x24 in 30px-wide gutter on the left, after the accent stripe)
    drawToastIcon(t.kind || 'info', cx + 12, cy + (h - 24) / 2, 24, t.color || '#90caf9');
    // Title
    ctx.fillStyle = t.accent || '#fff59d';
    ctx.font = 'bold 15px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(t.title, cx + 50, cy + 26);
    ctx.fillStyle = '#cfd8dc';
    ctx.font = '12px ui-monospace, monospace';
    lines.forEach((ln, li) => ctx.fillText(ln, cx + 50, cy + 45 + li * 16));
    // Life bar along bottom
    const lifeRatio = Math.max(0, t.life / t.max);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(cx + 5, cy + h - 3, cw - 5, 2);
    ctx.fillStyle = t.color || '#90caf9';
    ctx.fillRect(cx + 5, cy + h - 3, (cw - 5) * lifeRatio, 2);
    cy += h + pad;
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============================================================================
   MAIN UPDATE / DRAW
============================================================================ */
function update(dt) {
  // Handle game over: hard freeze, only fade-in animates and only ENTER works.
  if (state.flash) { state.flash.a -= dt * 2.2; if (state.flash.a <= 0) state.flash = null; }
  if (state.gameOver) {
    state.gameOverFade = Math.min(0.4, state.gameOverFade + dt);
    state.gameOverT = (state.gameOverT || 0) + dt;
    // Short delay so frantic E-spam at the moment of failure doesn't skip the screen.
    if (state.gameOverT > 0.8 && (consumeEdge('enter') || consumeEdge('e') || consumeEdge(' '))) {
      AudioKit.uiSelect();
      goToTitle();
    }
    clearEdges();
    return;
  }

  // Tutorial overlay (modal — pauses the game). Handled before everything
  // else so it also works when opened from the title menu.
  if (state.tutorialOpen) {
    updateTutorial();
    clearEdges();
    return;
  }

  if (state.startScreen) { updateTitle(dt); clearEdges(); return; }
  if (state.shiftOver) { updateShiftOver(dt); clearEdges(); return; }
  if (state.shiftIntro > 0) { updateShiftIntro(dt); clearEdges(); return; }

  // T anywhere in-game reopens the tutorial
  if (!state.phoneOpen && consumeEdge('t')) {
    openTutorial();
    clearEdges();
    return;
  }

  // Pause toggle
  if (!state.phoneOpen && consumeEdge('escape')) {
    if (!state.paused) { AudioKit.pauseIn(); } else { AudioKit.pauseOut(); }
    state.paused = !state.paused;
  }
  if (state.paused) {
    if (consumeEdge('q')) { AudioKit.uiSelect(); goToTitle(); }
    clearEdges();
    return;
  }
  if (state.hitStop > 0) { state.hitStop -= dt; return; }
  if (state.introGo > 0) state.introGo -= dt;
  if (state.tipPop > 0) state.tipPop = Math.max(0, state.tipPop - dt);
  updateRush(dt);
  updatePowerups(dt);

  // Toast achievements — auto-dismiss, no input needed
  updateToasts(dt);

  state.shake = Math.max(0, state.shake - dt);
  state.caughtFlash = Math.max(0, state.caughtFlash - dt);
  // Pre-compute sinusoidal shake offset so both update and draw use the SAME
  // values this frame. Random-per-draw-call causes a new offset every render
  // which makes shake look like flickering noise instead of a smooth lurch.
  if (state.shake > 0) {
    const s = state.shake * 5;
    const t = performance.now() / 1000;
    state.shakeX = Math.sin(t * 53.1) * s;
    state.shakeY = Math.cos(t * 47.3) * s;
  } else {
    state.shakeX = 0; state.shakeY = 0;
  }

  // Smooth energy bar — lerps toward the real value at 8×/s so drops feel
  // snappy (1 tick = 0.125s to close 63% of the gap) while slow drain is
  // buttery. Refill in break room also slides in smoothly.
  state.energyDisplay += (state.energy - state.energyDisplay) * Math.min(1, 10 * dt);
  if (state.missFlash > 0) state.missFlash = Math.max(0, state.missFlash - dt * 1.8);
  if (state.playerSpeech) {
    state.playerSpeech.life -= dt;
    if (state.playerSpeech.life <= 0) state.playerSpeech = null;
  }
  for (const c of state.cars) {
    if (c.speech) {
      c.speech.life -= dt;
      if (c.speech.life <= 0) c.speech = null;
    }
  }

  state.comboTimer = Math.max(0, state.comboTimer - dt);
  // Combo decay — if no completions in 15s, reset streak.
  if (state.combo > 0) {
    state.comboDecayTimer = (state.comboDecayTimer || 0) - dt;
    if (state.comboDecayTimer <= 0) breakCombo('decay');
  }
  updatePlayer(dt);
  updateCars(dt);
  updateSpawn(dt);
  updateManager(dt);
  updateEnergyAndTimer(dt);
  updateWeather(dt);
  updatePhone(dt);
  updateTipBills(dt);
  state.anim.update(dt);
  updateParticles(dt);

  clearEdges();
}

function draw() {
  clearScreen();
  UI.buttons.length = 0;

  if (state.startScreen) {
    drawStartScreen();
    if (state.tutorialOpen) drawTutorial();
    return;
  }

  // Camera shake — offset pre-computed in update() so it's consistent all draw calls
  ctx.save();
  if (state.shakeX !== 0 || state.shakeY !== 0) {
    ctx.translate(state.shakeX, state.shakeY);
  }

  drawBackground();

  // Depth-sort drawables by y
  const drawables = [];
  for (const c of state.cars) drawables.push({ y: c.y + c.h / 2, kind: 'car', ref: c });
  drawables.push({ y: state.player.y, kind: 'player' });
  if (state.manager && state.manager.breakPhase !== 'in_break') {
    drawables.push({ y: state.manager.y, kind: 'manager' });
  }
  for (const pu of (state.powerups || [])) drawables.push({ y: pu.y, kind: 'powerup', ref: pu });
  drawables.sort((a, b) => a.y - b.y);
  for (const d of drawables) {
    if (d.kind === 'car') drawCarJuiced(d.ref);
    else if (d.kind === 'manager') drawManager();
    else if (d.kind === 'player') drawPlayerJuiced();
    else if (d.kind === 'powerup') drawPowerup(d.ref);
  }

  // Interaction chips draw AFTER sprites so the [E] prompt floats on top
  // of the player's head instead of being hidden behind the sprite.
  drawStations();
  drawAction();
  drawParticles();
  drawTipBills();
  drawFloatingTexts();
  drawWeatherTint();
  drawRain();
  drawCaughtFlash();

  ctx.restore();

  // ── Miss flash vignette (red edges) ─────────────────────────────────────
  if (state.missFlash > 0) {
    const alpha = Math.min(0.55, state.missFlash) * 0.85;
    const grad = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, VIEW_H*0.25, VIEW_W/2, VIEW_H/2, VIEW_H*0.85);
    grad.addColorStop(0, 'rgba(200,0,0,0)');
    grad.addColorStop(1, `rgba(200,0,0,${alpha})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  if (state.flash) {
    ctx.fillStyle = `rgba(${state.flash.r},${state.flash.g},${state.flash.b},${Math.max(0, state.flash.a)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  drawTopBar();
  if (!state.inBreakRoom && !state.paused && !state.gameOver && !state.shiftOver) drawStatusRow();

  if (state.inBreakRoom) drawBreakRoomOverlay();
  if (state.paused && !state.tutorialOpen) drawPauseOverlay();
  if (state.gameOver) drawGameOver();
  if (state.tutorialOpen) drawTutorial();
  if (state.phoneOpen && !state.gameOver) drawPhoneModal();
  if (!state.gameOver && !state.tutorialOpen && !state.phoneOpen && !state.inBreakRoom && !state.paused && !state.shiftOver && !(state.shiftIntro > 0)) drawToasts();
  if (state.shiftIntro > 0 || state.introGo > 0) drawShiftIntro();
  if (state.shiftOver) drawShiftOver();

  if (!state.loaded) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 24px ui-monospace, monospace';
    ctx.fillText('Loading sprites…', VIEW_W / 2, VIEW_H / 2);
  }
}

============================================================================ */
const CAREER_KEY = 'everclean_career_v1';
const RECORDS_KEY = 'everclean_records_v1';
const UPGRADES = [
  { id: 'shoes',  name: 'RUNNING SHOES',    icon: '👟', desc: 'Move 12% faster per level',          cost: [60, 140, 260] },
  { id: 'tools',  name: 'PRO TOOLS',        icon: '🧽', desc: 'Every wash step is 15% quicker',     cost: [90, 200, 340] },
  { id: 'ramp',   name: 'LOADING RAMP',     icon: '🔧', desc: '3 fewer E presses to load a car',    cost: [50, 120, 230] },
  { id: 'bottle', name: 'BIG WATER BOTTLE', icon: '💧', desc: 'Energy drains 18% slower',           cost: [70, 160, 280] },
  { id: 'charm',  name: 'CHARM SCHOOL',     icon: '😊', desc: 'Customers lose patience 15% slower', cost: [80, 180, 300] },
  { id: 'jar',    name: 'TIP JAR',          icon: '💰', desc: '+12% tips on every car',             cost: [110, 240, 400] },
  { id: 'clock',  name: 'OVERTIME',         icon: '⏰', desc: '+10 seconds on every shift',         cost: [90, 200, 340] },
];
function defaultCareer() { return { day: 1, wallet: 0, up: {}, totalTips: 0 }; }
function loadJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v && typeof v === 'object' ? Object.assign(fallback, v) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
const career = loadJSON(CAREER_KEY, defaultCareer());
if (!career.up || typeof career.up !== 'object') career.up = {};
const records = loadJSON(RECORDS_KEY, { bestDay: 1, totalTips: 0, totalCars: 0, totalPerfects: 0, careers: 0 });
function saveCareer() { saveJSON(CAREER_KEY, career); }
function saveRecords() { saveJSON(RECORDS_KEY, records); }
function resetCareer() { Object.assign(career, defaultCareer()); saveCareer(); }
function upLvl(id) { return Math.max(0, Math.min(3, career.up[id] | 0)); }

function quotaForDay(d) { const n = d - 1; return Math.round(50 + 45 * n + 8 * n * n); }
function shiftTime()      { return GAME_TIME_START + 10 * upLvl('clock'); }
function playerSpeed()    { return PLAYER_SPEED * (1 + 0.12 * upLvl('shoes')) * (state.buffs.speed > 0 ? 1.35 : 1); }
function actionDuration() { return ACTION_DURATION * (1 - 0.15 * upLvl('tools')); }
function loadPresses()    { return Math.max(3, LOAD_PRESSES_NEEDED - 3 * upLvl('ramp')); }
function energyDrain()    { return ENERGY_DRAIN_BASE * (1 - 0.18 * upLvl('bottle')); }
function patienceMult()   { return 1 - 0.15 * upLvl('charm'); }
// Reputation 0..100 → tips ×0.75..×1.25 (50 = neutral). Lost cars hurt, perfect washes help.
function repMult() { return 0.75 + 0.5 * Math.max(0, Math.min(100, state.rep)) / 100; }
function tipMult() {
  return repMult() * (1 + 0.12 * upLvl('jar')) * (state.buffs.gold > 0 ? 2 : 1) * (state.rushT > 0 ? 1.25 : 1);
}
function maxCarsOnLane()  { return (state.day >= 3 ? 2 : 1) + (state.rushT > 0 ? 1 : 0); }

Object.assign(state, {
  day: career.day, quota: 0,
  buffs: { speed: 0, gold: 0 }, rushT: 0, rushAt: -1, shiftElapsed: 0,
  powerups: [], powerupTimer: 20,
  hitStop: 0, flash: null, tipPop: 0,
  shiftIntro: 0, introGo: 0, shiftOver: null,
  gameOverT: 0, careerSummary: null,
  menu: { page: 'main', index: 0 },
  stats: { perfects: 0, bestCombo: 0 },
});
state.player.pop = 0;

function startShift() {
  fullReset();
  state.day = career.day;
  state.quota = quotaForDay(state.day);
  state.gameTimer = shiftTime();
  state.buffs = { speed: 0, gold: 0 };
  state.rushT = 0;
  state.rushAt = state.day >= 2 ? 30 + Math.random() * 40 : -1;
  state.shiftElapsed = 0;
  state.powerups = [];
  state.powerupTimer = 15 + Math.random() * 10;
  state.hitStop = 0; state.flash = null; state.tipPop = 0;
  state.stats = { perfects: 0, bestCombo: 0 };
  state.shiftOver = null;
  state.manager = makeManager();
  state.runStartBest = state.highScore;
  state.shiftIntro = 3.8;
  state.introGo = 0;
  state.startScreen = false;
  if (!state.tutorialSeen) openTutorial();
}

function goToTitle() {
  Object.assign(state, {
    startScreen: true, gameOver: false, shiftOver: null, shiftIntro: 0, introGo: 0,
    paused: false, tutorialOpen: false, phoneOpen: false, inBreakRoom: false,
    actionTimer: 0, actionType: null, actionCar: null,
    cars: [], particles: [], popupQueue: [], powerups: [], flash: null, hitStop: 0,
    menu: { page: 'main', index: 0 },
  });
}

function saveBestShift() {
  if (state.tips <= state.runStartBest) return false;
  state.highScore = Math.max(state.highScore, state.tips);
  try { localStorage.setItem('everclean_hs', state.highScore); } catch (e) {}
  return true;
}

function endShift() {
  const made = state.tips, served = state.carsServed;
  if (made < state.quota) { careerOver('quota'); return; }
  const ratio = made / state.quota;
  const perfectRate = served ? state.stats.perfects / served : 0;
  let grade = 'C';
  if (ratio >= 2 && perfectRate >= 0.6) grade = 'S';
  else if (ratio >= 1.6) grade = 'A';
  else if (ratio >= 1.25) grade = 'B';
  const bonus = { S: 60, A: 35, B: 15, C: 0 }[grade];
  const newBest = saveBestShift();
  const walletBefore = career.wallet;
  career.wallet += made + bonus;
  career.totalTips += made;
  career.day += 1;
  records.bestDay = Math.max(records.bestDay, career.day);
  records.totalTips += made;
  records.totalCars += served;
  records.totalPerfects += state.stats.perfects;
  saveCareer(); saveRecords();
  state.shiftOver = {
    phase: 'report', t: 0, day: state.day, made, quota: state.quota, served,
    perfects: state.stats.perfects, lost: state.carsLost, bestCombo: state.stats.bestCombo,
    grade, bonus, newBest, walletBefore, index: 0, msg: null, msgT: 0, shake: 0, stamped: false, bought: null,
  };
  Object.assign(state, { actionTimer: 0, actionType: null, actionCar: null, phoneOpen: false, paused: false, inBreakRoom: false });
  AudioKit.levelUp();
  if (newBest) setTimeout(() => AudioKit.newHighScore(), 900);
}

function careerOver(reason) {
  if (state.gameOver) return;
  const newBest = saveBestShift();
  if (newBest) setTimeout(() => AudioKit.newHighScore(), 600);
  records.bestDay = Math.max(records.bestDay, state.day || 1);
  records.careers = (records.careers || 0) + 1;
  records.totalTips += state.tips;
  records.totalCars += state.carsServed;
  records.totalPerfects += state.stats.perfects;
  saveRecords();
  state.careerSummary = {
    day: state.day || 1, made: state.tips, quota: state.quota,
    careerTips: career.totalTips + state.tips, newBest,
  };
  resetCareer();
  Object.assign(state, {
    gameOver: true, gameOverFade: 0, gameOverT: 0, gameOverReason: reason,
    phoneOpen: false, paused: false, actionTimer: 0, actionType: null, actionCar: null,
  });
  AudioKit.gameOverSound();
}

/* ============================================================================
   CANVAS UI — clickable/tappable buttons registered each frame while drawing
============================================================================ */
const UI = { buttons: [] };
function addButton(x, y, w, h, onClick, onHover) { UI.buttons.push({ x, y, w, h, onClick, onHover }); }
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  const k = Math.min(r.width / VIEW_W, r.height / VIEW_H);
  return {
    x: (e.clientX - r.left - (r.width - VIEW_W * k) / 2) / k,
    y: (e.clientY - r.top - (r.height - VIEW_H * k) / 2) / k,
  };
}
function buttonAt(pt) {
  for (let i = UI.buttons.length - 1; i >= 0; i--) {
    const b = UI.buttons[i];
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) return b;
  }
  return null;
}
canvas.addEventListener('pointerdown', (e) => {
  AudioKit.unlock();
  const b = buttonAt(canvasPoint(e));
  if (b) { e.preventDefault(); b.onClick(); return; }
  // Tap-anywhere fallbacks for full-screen prompts
  if (state.gameOver && state.gameOverT > 0.8) { AudioKit.uiSelect(); goToTitle(); }
  else if (state.shiftOver && state.shiftOver.phase === 'report') advanceReport();
  else if (state.shiftIntro > 0 && !state.tutorialOpen) state.shiftIntro = 0.0001;
}, { passive: false });
canvas.addEventListener('pointermove', (e) => {
  const b = buttonAt(canvasPoint(e));
  canvas.style.cursor = b ? 'pointer' : '';
  if (b && b.onHover) b.onHover();
});

function shadowText(t, x, y, col, off = 2) {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillText(t, x + off, y + off);

}
function dimScreen(a) { ctx.fillStyle = `rgba(4,10,18,${a})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
function drawPanel(x, y, w, h, border = 'rgba(144,202,249,0.45)') {

  ctx.fillStyle = '#0e1a2b';

  roundRect(x, y, w, h, 16, false, true);

function drawPill(x, y, w, h, label, selected, onClick, onHover, opts = {}) {

function updateShiftIntro(dt) {

/* ============================================================================
   END OF SHIFT — report card + upgrade shop
============================================================================ */
const REPORT_FULL = 2.4;
const GRADE_COLOR = { S: '#ffd54f', A: '#69f0ae', B: '#81d4fa', C: '#b0bec5' };
function advanceReport() {
  const so = state.shiftOver;
  if (so.t < REPORT_FULL) { so.t = REPORT_FULL; so.stamped = true; return; }
  so.phase = 'shop';
  so.index = 0;
  AudioKit.uiSelect();
}
function shopActivate(i) {
  const so = state.shiftOver;
  so.index = i;
  if (i === UPGRADES.length) { AudioKit.uiSelect(); startShift(); return; }
  const u = UPGRADES[i], lvl = upLvl(u.id);
  if (lvl >= 3) { AudioKit.uiDeny(); so.msg = u.name + ' is already maxed out'; so.msgT = 1.8; return; }
  const cost = u.cost[lvl];
  if (career.wallet < cost) {
    AudioKit.uiDeny();
    so.shake = 0.3;
    so.msg = 'Need $' + (cost - career.wallet) + ' more for ' + u.name;
    so.msgT = 1.8;
    return;
  }
  career.wallet -= cost;
  career.up[u.id] = lvl + 1;
  saveCareer();
  AudioKit.cashDing();
  AudioKit.levelUp();
  so.msg = u.name + ' → LEVEL ' + (lvl + 1) + '!';
  so.msgT = 1.8;
  so.bought = { i, t: 0.45 };
}
function updateShiftOver(dt) {
  const so = state.shiftOver;
  so.t += dt;
  if (so.msgT > 0) so.msgT -= dt;
  if (so.shake > 0) so.shake = Math.max(0, so.shake - dt);
  if (so.bought && (so.bought.t -= dt) <= 0) so.bought = null;
  if (so.phase === 'report') {
    if (!so.stamped && so.t >= 0.7) {
      so.stamped = true;
      if (so.grade === 'S' || so.grade === 'A') AudioKit.perfectJingle(); else AudioKit.comboBig();
    }
    if (consumeEdge('enter') || consumeEdge('e') || consumeEdge(' ')) advanceReport();
    return;
  }
  const n = UPGRADES.length + 1;
  if (consumeEdge('arrowup') || consumeEdge('w')) { so.index = (so.index - 1 + n) % n; AudioKit.uiSelect(); }
  if (consumeEdge('arrowdown') || consumeEdge('s')) { so.index = (so.index + 1) % n; AudioKit.uiSelect(); }
  if (consumeEdge('enter') || consumeEdge('e') || consumeEdge(' ')) shopActivate(so.index);
  if (consumeEdge('escape') || consumeEdge('q')) { AudioKit.uiSelect(); goToTitle(); }
}
function drawShiftOver() {
  const so = state.shiftOver;
  dimScreen(0.8);
  if (so.phase === 'report') drawReport(so); else drawShop(so);
}
function drawReport(so) {

  if (so.t >= 0.7) {

    const sc = 2.6 - 1.6 * (1 - Math.pow(1 - k, 3));
    const gx = x + w - 150, gy = y + 220;

    ctx.textBaseline = 'middle';
    shadowText(so.grade, 0, 4, GRADE_COLOR[so.grade], 3);
    ctx.restore();

    shadowText('GRADE', gx, gy + 100, '#b0bec5');
    ctx.globalAlpha = 1;
  }
  const rows = [

  ];
  rows.forEach(([k, v, col], i) => {

    shadowText('WALLET  $' + (so.phase === 'report' ? shown : career.wallet), VIEW_W / 2, y + 470, '#ffd54f');
  }
  if (so.t >= REPORT_FULL) {

    ctx.globalAlpha = p;

  drawPill(rowX + rowW / 2 - 190, sy, 380, 54, '▶ START DAY ' + career.day, so.index === UPGRADES.length,
    () => shopActivate(UPGRADES.length), () => { so.index = UPGRADES.length; },
    { selFill: '#69f0ae', glow: 'rgba(105,240,174,0.9)', border: 'rgba(105,240,174,0.7)', color: '#b9f6ca', size: 22 });
  ctx.textAlign = 'center';
  if (so.msgT > 0) {
    ctx.globalAlpha = Math.min(1, so.msgT / 0.3);
    ctx.font = 'bold 18px ui-monospace, monospace';
    shadowText(so.msg, VIEW_W / 2, y + h - 14, so.msg.indexOf('Need') === 0 || so.msg.indexOf('maxed') > 0 ? '#ef9a9a' : '#69f0ae');
  } else {
    ctx.font = '14px ui-monospace, monospace';
    ctx.fillStyle = '#78909c';
    ctx.fillText(IS_TOUCH ? 'Tap an upgrade to buy it' : '↑ ↓ choose  •  ENTER buy  •  ESC save & quit to title', VIEW_W / 2, y + h - 14);
  }
  ctx.restore();
}

/* ============================================================================
   CAREER OVER screen
============================================================================ */
function drawGameOver() {
  const a = Math.max(0, Math.min(1, state.gameOverFade / 0.4));
  dimScreen(0.8 * a);
  const cs = state.careerSummary || { day: 1, made: state.tips, quota: 0, careerTips: state.tips, newBest: false };
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  const titles = { fired: "YOU'RE FIRED!", tired: 'PASSED OUT!', quota: 'QUOTA MISSED!' };
  const subs = {
    fired: "Danny's had enough. Three strikes.",
    tired: 'You ran out of energy. Take more breaks!',
    quota: `You made $${cs.made}, but the quota was $${cs.quota}.`,
  };
  const shakeX = state.gameOverT < 0.5 ? Math.sin(state.gameOverT * 60) * (0.5 - state.gameOverT) * 16 : 0;
  ctx.font = 'bold 88px ui-monospace, monospace';
  shadowText(titles[state.gameOverReason] || 'GAME OVER', VIEW_W / 2 + shakeX, VIEW_H / 2 - 130, '#ef5350', 4);
  ctx.font = 'bold 24px ui-monospace, monospace';
  shadowText(subs[state.gameOverReason] || '', VIEW_W / 2, VIEW_H / 2 - 78, '#ffffff');
  ctx.font = 'bold 28px ui-monospace, monospace';
  shadowText('CAREER OVER', VIEW_W / 2, VIEW_H / 2 - 18, '#ffe082');
  ctx.font = 'bold 24px ui-monospace, monospace';
  shadowText('You made it to DAY ' + cs.day, VIEW_W / 2, VIEW_H / 2 + 22, '#e6f2ff');
  ctx.font = '18px ui-monospace, monospace';
  shadowText('Career tips: $' + cs.careerTips + '   •   Furthest ever: Day ' + records.bestDay, VIEW_W / 2, VIEW_H / 2 + 58, '#90caf9');
  if (cs.newBest) {
    const p = 0.7 + 0.3 * Math.sin(performance.now() / 220);
    ctx.font = 'bold 22px ui-monospace, monospace';
    shadowText('★ NEW BEST SHIFT: $' + cs.made + ' ★', VIEW_W / 2, VIEW_H / 2 + 98, `rgba(255,213,79,${p})`);
  } else {
    ctx.font = '18px ui-monospace, monospace';
    shadowText('Best shift: $' + state.highScore, VIEW_W / 2, VIEW_H / 2 + 98, '#ffd54f');
  }
  if (state.gameOverT > 0.8) {
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(performance.now() / 300);
    ctx.font = '20px ui-monospace, monospace';
    shadowText(IS_TOUCH ? 'Tap to return to the title screen' : 'Press ENTER to return to the title screen', VIEW_W / 2, VIEW_H / 2 + 150, '#cfd8dc');
  }
  ctx.restore();
}

/* ============================================================================
   POWER-UPS + RUSH HOUR
============================================================================ */
const POWERUP_DEFS = {
  coffee: { icon: '☕', color: '#bcaaa4', label: 'COFFEE! +ENERGY & SPEED' },
  gold:   { icon: '✨', color: '#ffd54f', label: 'GOLDEN SPONGE! 2× TIPS' },
  clock:  { icon: '⏱', color: '#69f0ae', label: 'STOPWATCH! +10s' },
};
function updatePowerups(dt) {
  state.buffs.speed = Math.max(0, state.buffs.speed - dt);
  state.buffs.gold = Math.max(0, state.buffs.gold - dt);
  if (state.player.pop > 0) state.player.pop = Math.max(0, state.player.pop - dt);
  state.powerupTimer -= dt;
  if (state.powerupTimer <= 0) {
    state.powerupTimer = 20 + Math.random() * 15;
    if (state.powerups.length < 2) {
      const r = Math.random();
      const kind = r < 0.45 ? 'coffee' : r < 0.75 ? 'gold' : 'clock';
      state.powerups.push({ kind, x: 170 + Math.random() * (VIEW_W - 420), y: 450 + Math.random() * 140, life: 12, t: 0 });
    }
  }
  const p = state.player;
  for (const pu of state.powerups) {
    pu.life -= dt; pu.t += dt;
    if (pu.life > 0 && !state.inBreakRoom && Math.hypot(p.x - pu.x, p.y - pu.y) < 52) {
      collectPowerup(pu);
      pu.life = 0;
    }
  }
  state.powerups = state.powerups.filter(pu => pu.life > 0);
}
function collectPowerup(pu) {
  const def = POWERUP_DEFS[pu.kind];
  if (pu.kind === 'coffee') {
    state.energy = Math.min(ENERGY_MAX, state.energy + 25);
    state.buffs.speed = 8;
    AudioKit.energyRefill();
  } else if (pu.kind === 'gold') {
    state.buffs.gold = 15;
    AudioKit.comboBig();
  } else {
    state.gameTimer += 10;
    AudioKit.timeBonus();
  }
  AudioKit.pickupSound();
  addFloating(def.label, pu.x, pu.y - 60, def.color, 1.6);
  emitParticles(pu.x, pu.y - 26, def.color, 18, { speed: 140, life: 0.7, size: 3, g: 120, lift: 40 });
  state.flash = { r: 255, g: 255, b: 255, a: 0.12 };
  state.player.pop = 0.22;
}
function drawPowerup(pu) {
  const def = POWERUP_DEFS[pu.kind];
  if (pu.life < 3 && Math.floor(pu.t * 8) % 2 === 0) return;
  const bob = Math.sin(pu.t * 4) * 4;
  const appear = Math.min(1, pu.t / 0.25);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(pu.x, pu.y, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.translate(pu.x, pu.y - 30 + bob);
  ctx.scale(appear, appear);
  const glow = 0.5 + 0.5 * Math.sin(pu.t * 6);
  ctx.shadowColor = def.color; ctx.shadowBlur = 12 + 10 * glow;
  ctx.fillStyle = 'rgba(13,27,42,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = def.color; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.stroke();
  ctx.font = '22px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(def.icon, 0, 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}
function updateRush(dt) {
  state.shiftElapsed += dt;
  if (state.rushAt > 0 && state.shiftElapsed >= state.rushAt) {
    state.rushAt = -1;
    state.rushT = 20;
    state.spawnTimer = Math.min(state.spawnTimer, 0.5);
    queuePopup('RUSH HOUR!', 'Cars are piling up! Extra cars on the lane and +25% tips for 20 seconds.', '#ff7043', '#ffccbc', 'combo');
    AudioKit.comboBig();
  }
  if (state.rushT > 0) state.rushT = Math.max(0, state.rushT - dt);
}

/* ============================================================================
   JUICE — squash/pop wrappers, combo meter + buff chips
============================================================================ */
function drawCarJuiced(c) {
  const s = c.squash || 0;
  if (s > 0) {
    const k = Math.sin((s / 0.3) * Math.PI) * 0.1;
    const fx = c.x, fy = c.y + c.h / 2 + 8;
    ctx.save();
    ctx.translate(fx, fy); ctx.scale(1 + k, 1 - k); ctx.translate(-fx, -fy);
    drawCar(c);
    ctx.restore();
  } else {
    drawCar(c);
  }
  if (c.wrongT > 0) {
    ctx.fillStyle = `rgba(239,83,80,${0.45 * (c.wrongT / 0.35)})`;
    ctx.fillRect(c.x - c.w / 2, c.y - c.h / 2 + 5, c.w, c.h * 0.65);
  }
}
function drawPlayerJuiced() {
  const p = state.player;
  if (!(p.pop > 0)) { drawPlayer(); return; }
  const k = Math.sin((p.pop / 0.22) * Math.PI) * 0.14;
  ctx.save();
  ctx.translate(p.x, p.y); ctx.scale(1 - k * 0.5, 1 + k); ctx.translate(-p.x, -p.y);
  drawPlayer();
  ctx.restore();
}
function drawStatusRow() {
  ctx.save();
  if (state.combo >= 1) {
    const x = 14, y = 54, w = 240, h = 34;
    ctx.fillStyle = 'rgba(13,27,42,0.85)';
    roundRect(x, y, w, h, 8, true, false);
    const glow = 0.5 + 0.5 * Math.sin(performance.now() / 160);
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px ui-monospace, monospace';
    ctx.fillStyle = `rgb(255,${Math.round(170 + 60 * glow)},90)`;
    ctx.fillText('🔥 COMBO ×' + state.combo, x + 10, y + 22);
    ctx.textAlign = 'right';
    ctx.font = 'bold 14px ui-monospace, monospace';
    ctx.fillStyle = '#fff59d';
    ctx.fillText(comboMultiplier().toFixed(1) + '× tips', x + w - 10, y + 22);
    const r = Math.max(0, Math.min(1, (state.comboDecayTimer || 0) / 15));
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(x + 6, y + h - 5, w - 12, 3);
    ctx.fillStyle = '#ff7043';
    ctx.fillRect(x + 6, y + h - 5, (w - 12) * r, 3);
  }
  const chips = [];
  if (state.buffs.speed > 0) chips.push(['☕ FAST ' + Math.ceil(state.buffs.speed) + 's', '#d7ccc8']);
  if (state.buffs.gold > 0) chips.push(['✨ 2× TIPS ' + Math.ceil(state.buffs.gold) + 's', '#ffd54f']);
  if (state.rushT > 0) chips.push(['🚗 RUSH HOUR ' + Math.ceil(state.rushT) + 's', '#ff8a65']);
  if (chips.length) {
    ctx.font = 'bold 15px ui-monospace, monospace';
    const ws = chips.map(([t]) => ctx.measureText(t).width + 24);
    let cx = VIEW_W / 2 - (ws.reduce((a, b) => a + b, 0) + 10 * (chips.length - 1)) / 2;
    chips.forEach(([t, col], i) => {
      ctx.fillStyle = 'rgba(13,27,42,0.88)';
      roundRect(cx, 54, ws[i], 30, 8, true, false);
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      roundRect(cx, 54, ws[i], 30, 8, false, true);
      ctx.fillStyle = col; ctx.textAlign = 'center';
      ctx.fillText(t, cx + ws[i] / 2, 74);
      cx += ws[i] + 10;
    });
  }
  ctx.restore();
}

const audioPanelEl = document.getElementById('audioPanel');
function syncAudioPanel() {
  const inPause = state.paused && !state.tutorialOpen && !state.startScreen && !state.gameOver && !state.phoneOpen;
  const inSettings = state.startScreen && state.menu.page === 'settings' && !state.tutorialOpen;
  audioPanelEl.classList.toggle('show', !!(inPause || inSettings));
  if (inPause || inSettings) {
    const k = Math.max(0.5, Math.min(1.3, stageScale()));
    audioPanelEl.style.transform = `translate(-50%, -50%) scale(${k.toFixed(3)})`;
  }
  const musicPaused = state.paused && !state.tutorialOpen && !state.startScreen;
  if (musicPaused !== lastMusicPaused) { lastMusicPaused = musicPaused; if (window.__musicPauseHook) window.__musicPauseHook(musicPaused); }
}
let lastMusicPaused = false;
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  if (dt > 0.1) dt = 0.1;
  last = now;
  // Guard update() and draw() separately. If either throws (e.g. a bad
  // sprite state during the brief window before images finish loading),
  // we log and keep the loop alive — an exception here used to kill rAF
  // silently, freezing the title screen so Enter could never be handled.
  try { update(dt); } catch (e) { console.error('update error', e); }
  try { draw(); } catch (e) { console.error('draw error', e); }
  try { syncTouchModalMode(); } catch (e) { console.error('hud error', e); }
  try { syncAudioPanel(); } catch (e) { console.error('audio panel error', e); }
  requestAnimationFrame(frame);
}

/* ============================================================================
   BOOT
============================================================================ */
setupTouchHud();
buildStations();
// Manager is created when the player starts the game (presses Enter on start
// screen) so he always walks out fresh from the door at game start.
// state.manager is null until then — updateManager / drawManager guard on !m.
loadAllSheets().then(() => {
  // Pick frame size from walk sheet
  if (WALK_FRAMES.walk_down && WALK_FRAMES.walk_down[0]) {
    const f = WALK_FRAMES.walk_down[0];
    state.frameW = f.w; state.frameH = f.h;
  }
});
// Splash image for the start screen (and shared favicon). Loaded raw —
// no colorKey pass, we want the full painted background to fill the canvas.
loadImage('splash.png').then((img) => { state.splashImage = img; })
  .catch(() => { state.splashFailed = true; });
// Painted carwash scene that all sprites walk on top of. Coordinates for
// stations / bays / door in the constants at the top of this file were
// chosen against this image so gameplay positions match the art.
loadImage('bg.png').then((img) => { state.bgImage = img; })
  .catch(() => { /* bg optional — fall back to flat-floor renderer */ });
requestAnimationFrame(frame);

</script>

<script>
// ── AUDIO CONTROLLER (music play/pause + volume, SFX mute + volume) ─────────
(function() {
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('musicBtn');
  const mVol = document.getElementById('musicVol');
  const sBtn = document.getElementById('sfxBtn');
  const sVol = document.getElementById('sfxVol');
  let autoPaused = false;
  if (!bgm || !btn) return;
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  let musicOn = get('everclean_music', '1') !== '0';
  let musicLevel = parseFloat(get('everclean_music_vol', '0.45'));
  let sfxOn = get('everclean_sfx', '1') !== '0';
  let sfxLevel = parseFloat(get('everclean_sfx_vol', '0.85'));

  function render() {
    bgm.volume = musicLevel;
    mVol.value = Math.round(musicLevel * 100);
    const playing = musicOn && !autoPaused;
    for (const b of [btn]) {
      b.textContent = playing ? '⏸' : '▶';
      b.title = playing ? 'Pause music (M)' : 'Play music (M)';
      b.classList.toggle('muted', !playing);
    }
    AudioKit.setVolume(sfxLevel); AudioKit.setMuted(!sfxOn);
    sVol.value = Math.round(sfxLevel * 100);
    for (const b of [sBtn]) {
      b.textContent = sfxOn && sfxLevel > 0 ? '🔊' : '🔇';
      b.title = sfxOn ? 'Mute sound effects (N)' : 'Unmute sound effects (N)';
      b.classList.toggle('muted', !sfxOn);
    }
    set('everclean_music', musicOn ? '1' : '0'); set('everclean_music_vol', musicLevel);
    set('everclean_sfx', sfxOn ? '1' : '0'); set('everclean_sfx_vol', sfxLevel);
  }
  function syncPlayback() {
    if (musicOn && !autoPaused) bgm.play().catch(() => {}); else bgm.pause();
  }
  function toggleMusic() {
    if (autoPaused) { autoPaused = false; musicOn = true; }
    else musicOn = !musicOn;
    render(); syncPlayback();
  }
  window.__audioUI = {
    toggleMusic, toggleSfx,
    musicPlaying: () => musicOn && !autoPaused,
    sfxOn: () => sfxOn && sfxLevel > 0,
  };
  window.__musicPauseHook = (paused) => { autoPaused = paused; render(); syncPlayback(); };
  function toggleSfx() {
    sfxOn = !sfxOn; render();
    if (sfxOn) { AudioKit.unlock(); AudioKit.uiSelect(); }
  }

  btn.addEventListener('click', (e) => { e.stopPropagation(); toggleMusic(); btn.blur(); });
  sBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSfx(); sBtn.blur(); });

  mVol.addEventListener('input', () => { musicLevel = mVol.value / 100; render(); });
  sVol.addEventListener('input', () => {
    sfxLevel = sVol.value / 100; sfxOn = sfxLevel > 0 ? true : sfxOn; render();
  });
  sVol.addEventListener('change', () => { AudioKit.unlock(); AudioKit.uiSelect(); sVol.blur(); });
  mVol.addEventListener('change', () => mVol.blur());
  [btn, sBtn, mVol, sVol].forEach(el => el.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') e.stopPropagation();
    if (e.key === 'Escape') el.blur();
  }));

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'm' || e.key === 'M') toggleMusic();
    else if (e.key === 'n' || e.key === 'N') toggleSfx();
  });

  // Browsers block autoplay until a gesture; start on the first one.
  function onFirstGesture() {
    syncPlayback();
    document.removeEventListener('pointerdown', onFirstGesture);
    document.removeEventListener('keydown', onFirstGesture);
  }
  document.addEventListener('pointerdown', onFirstGesture);
  document.addEventListener('keydown', onFirstGesture);

  render();
  if (musicOn) bgm.play().catch(() => {});
})();
</script>
